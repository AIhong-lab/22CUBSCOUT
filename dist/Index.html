<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- 資安（SPEC 附錄第 59 點）：只允許連到 Google 的後端、不載入任何外部程式或圖片，表單不會被送到別的網站。由 GAS 提供時建置會拿掉這一行 -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f4e9c">
<!-- 可以「加入主畫面」變成像 App 的圖示（PWA，SPEC 附錄第 62 點）；由 GAS 提供時這幾行沒有作用 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="22團">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>22團</title>
<script id="boot"></script>
<!--
  幼童軍進程與技能章查詢系統：前端（查詢端與後台同一頁，依身分顯示）
  ⚠️ 本 repo 為公開：這個檔案只能放 GAS 網址，其他任何設定值、金鑰都不可以出現在這裡。
  設計：叢林闖關冒險風（SPEC 附錄第 19 點）。不使用外部圖片，圖示用表情符號與 CSS。
-->
<style>
  :root {
    --blue: #1f4e9c; --blue-dark: #163a75; --blue-soft: #e6eefc; --sky: #dff0ff;
    --yellow: #ffc928; --yellow-dark: #e0a800; --yellow-soft: #fff4cc;
    --green: #2e9d57; --green-dark: #1d7a3a; --green-soft: #e2f6e9;
    --gray: #6b7385; --gray-soft: #eef0f4; --gray-line: #dfe4ee;
    --red: #c62828; --red-soft: #fde7e7;
    --bg: #f6f7fb; --card: #ffffff; --text: #1d2433;
    --radius: 14px; --shadow: 0 1px 2px rgba(20, 40, 80, .06), 0 4px 14px rgba(20, 40, 80, .06);
    --side: 220px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--text); background: #f6f7fb;
    font: 17px/1.65 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--blue); }

  /* ───── 頂部：品牌＋導覽列（電腦一排；手機在標題下方第二排，可左右滑） ───── */
  header.top { position: sticky; top: 0; z-index: 20; color: #fff; background: var(--blue); border-bottom: 3px solid var(--yellow); }
  header.top .row { display: flex; align-items: center; gap: 18px; max-width: 1200px; margin: 0 auto; padding: 0 24px; min-height: 76px; flex-wrap: wrap; }
  header.top h1 { font-size: 26px; margin: 0; font-weight: 900; letter-spacing: .5px; white-space: nowrap; cursor: pointer; }
  #headerRight { margin-left: auto; }
  header.top select { max-width: 220px; font-size: 15px; padding: 6px 10px; border-radius: 8px; border: 0; background: #fff; color: var(--text); font-weight: 700; }
  .chip-btn { background: var(--yellow); color: var(--text); border: 0; border-radius: 8px; padding: 7px 14px; font-size: 15px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  nav.tabs { display: flex; flex: 1; }
  nav.tabs .inner { width: 100%; }
  nav.tabs button[data-v=login] { margin-left: auto; } /* 登入固定在最右邊 */
  nav.tabs[hidden] { display: none; } /* 上面的 display:flex 會蓋過 hidden 屬性，需明確隱藏 */
  nav.tabs .inner { display: flex; gap: 2px; }
  nav.tabs button { border: 0; background: none; color: #dbe6fb; padding: 24px 18px 21px; font-size: 18px; font-weight: 800; cursor: pointer; white-space: nowrap; border-bottom: 4px solid transparent; margin-bottom: -3px; }
  nav.tabs button .ic { margin-right: 6px; }
  nav.tabs button:hover { color: #fff; background: rgba(255,255,255,.08); }
  nav.tabs button.on { color: #fff; border-bottom-color: var(--yellow); }
  /* 後台在寬螢幕改成左側選單 */
  @media (min-width: 1000px) {
    body.admin nav.tabs { position: fixed; top: 61px; left: 0; bottom: 0; width: var(--side); background: #fff; border-right: 1px solid var(--gray-line); padding: 14px 10px; display: block; overflow-y: auto; }
    body.admin nav.tabs .inner { flex-direction: column; gap: 4px; }
    body.admin nav.tabs button { color: var(--text); text-align: left; padding: 11px 14px; border-radius: 10px; border: 0; margin: 0; }
    body.admin nav.tabs button:hover { background: var(--gray-soft); }
    body.admin nav.tabs button.on { background: var(--blue-soft); color: var(--blue-dark); }
    body.admin main { margin-left: var(--side); max-width: none; padding-left: 32px; padding-right: 32px; }
    body.admin main > * { max-width: 1000px; }
  }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
  @media (max-width: 759px) { main { padding: 14px 12px 40px; } }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow); border: 1px solid var(--gray-line); }
  @media (max-width: 759px) { .card { padding: 16px; } }
  .card h2 { margin: 0 0 12px; font-size: 20px; font-weight: 900; color: var(--blue-dark); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 { margin: 14px 0 6px; font-size: 18px; font-weight: 900; }
  .muted { color: var(--gray); font-size: 16px; }
  .small { font-size: 15px; }
  .s { font-size: 15px; color: var(--gray); font-weight: 400; }
  .center { text-align: center; }
  .row-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }

  /* ───── 表單與按鈕 ───── */
  label { display: block; margin: 14px 0 6px; font-weight: 800; }
  input[type=text], input[type=password], input[type=date], input[type=number], input[type=search], select.full, textarea {
    width: 100%; font-size: 17px; padding: 11px 13px; border: 2px solid var(--gray-line); border-radius: 10px; background: #fff;
  }
  textarea { min-height: 120px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px var(--yellow-soft); }
  .check { display: flex; gap: 12px; align-items: flex-start; font-weight: 800; margin: 12px 0; cursor: pointer; }
  .check input { width: 26px; height: 26px; margin-top: 2px; flex: none; accent-color: var(--blue); }
  .btn { display: block; width: 100%; min-height: 48px; font-size: 17px; font-weight: 800; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; cursor: pointer; margin-top: 14px; box-shadow: 0 2px 0 var(--blue-dark); transition: transform .08s; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
  .btn.alt { background: var(--yellow); color: var(--text); box-shadow: 0 4px 0 var(--yellow-dark); }
  .btn.green { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
  .btn.ghost { background: #fff; color: var(--blue); border: 2px solid var(--blue); box-shadow: none; }
  .btn.danger { background: var(--red-soft); color: var(--red); box-shadow: 0 4px 0 #f3b8b8; }
  .btn.small { display: inline-block; width: auto; min-height: 38px; font-size: 15px; padding: 6px 14px; margin-top: 8px; border-radius: 8px; }
  @media (min-width: 760px) { form .btn, .card > .btn { max-width: 420px; } }
  .btn:disabled { opacity: .5; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--blue); text-decoration: underline; padding: 8px 0; font-size: 17px; cursor: pointer; font-weight: 700; }
  .msg { padding: 12px 15px; border-radius: 16px; margin-top: 12px; white-space: pre-wrap; font-weight: 700; }
  .msg.err { background: var(--red-soft); color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green-dark); }
  .msg.info { background: var(--blue-soft); color: var(--blue-dark); }
  .msg.warn { background: var(--yellow-soft); color: #7a5a00; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .chip { border: 2px solid var(--gray-line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pill { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 14px; font-weight: 900; white-space: nowrap; }
  .st-已頒發 { background: #fff1b8; color: #8a6100; }
  .st-已完成待頒發 { background: var(--blue-soft); color: var(--blue-dark); }
  .st-進行中 { background: var(--green-soft); color: var(--green-dark); }
  .st-未開始 { background: var(--gray-soft); color: var(--gray); }
  .bar { height: 14px; background: var(--gray-soft); border-radius: 999px; overflow: hidden; margin-top: 8px; border: 2px solid #fff; box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
  .bar > span { display: block; height: 100%; background: repeating-linear-gradient(45deg, var(--green) 0 12px, #39b169 12px 24px); border-radius: 999px; transition: width .6s; }
  .bar.full > span { background: repeating-linear-gradient(45deg, var(--yellow) 0 12px, #ffd85c 12px 24px); }
  .consent { background: var(--bg); border-radius: 16px; padding: 14px; max-height: 50vh; overflow: auto; white-space: pre-wrap; font-size: 16px; border: 2px solid var(--gray-line); }
  details > summary.fold { cursor: pointer; font-weight: 900; color: var(--blue); padding: 6px 0; }
  details.sub { margin-top: 6px; font-size: 15px; }
  details.sub > summary { cursor: pointer; color: var(--blue); font-weight: 700; }
  details.sub .g { margin: 6px 0 2px; font-weight: 900; }
  details.sub ul { margin: 2px 0 4px; padding-left: 1.4em; list-style: disc; }
  details.sub li { display: list-item; padding: 2px 0; border: 0; min-height: 0; font-size: 15px; }
  details.sub .std { color: var(--gray); margin: 0 0 4px; }

  /* ───── 登入頁 ───── */
  .welcome { text-align: center; padding: 26px 18px 18px; background: linear-gradient(180deg, var(--sky), #fff); }
  .welcome .mascot { font-size: 74px; line-height: 1; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .welcome h2 { justify-content: center; font-size: 25px; margin: 10px 0 4px; }
  .welcome.compact { padding: 14px 16px; }
  .welcome.compact .mascot { font-size: 44px; }
  .welcome.compact h2 { font-size: 21px; margin: 4px 0 0; }
  .tip { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--green-soft); color: var(--green-dark); font-weight: 700; font-size: 15px; }

  /* ───── 冒險家卡片 ───── */
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, #2d6bc4, var(--blue)); color: #fff; border: 0; }
  .hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .hero .top { display: flex; gap: 16px; align-items: center; position: relative; z-index: 1; }
  .avatar { width: 88px; height: 88px; flex: none; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 52px; border: 5px solid var(--yellow); box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hero .name { font-size: 26px; font-weight: 900; line-height: 1.2; }
  .hero .sub { opacity: .92; font-size: 16px; }
  .levelchip { display: inline-block; margin-top: 6px; background: var(--yellow); color: var(--text); font-weight: 900; border-radius: 999px; padding: 2px 12px; font-size: 15px; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
  .stats3 div { background: rgba(255,255,255,.14); border-radius: 16px; padding: 8px 4px; text-align: center; font-size: 14px; }
  .stats3 b { display: block; font-size: 22px; line-height: 1.3; }

  .mission { display: flex; gap: 12px; align-items: flex-start; padding: 12px; margin-top: 10px; border-radius: 16px; background: var(--yellow-soft); border: 2px dashed var(--yellow-dark); }
  .mission .no { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; font-weight: 900; }
  .mission .txt { font-weight: 700; }
  .congrats { font-size: 20px; font-weight: 900; color: var(--blue-dark); margin: 0; white-space: pre-wrap; }
  .banner { background: linear-gradient(90deg, var(--yellow-soft), #fff); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid var(--yellow); }

  /* 可展開卡片 */
  .unit { border: 1px solid var(--gray-line); border-radius: 12px; margin-top: 12px; overflow: hidden; background: #fff; }
  .unit > summary { list-style: none; cursor: pointer; padding: 14px; display: block; }
  .unit > summary::-webkit-details-marker { display: none; }
  .unit .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .unit .name { font-size: 20px; font-weight: 900; }
  .unit .body { padding: 2px 14px 14px; border-top: 2px dashed var(--gray-line); }
  .unit .more { color: var(--blue); font-size: 15px; margin-top: 6px; font-weight: 700; }
  .unit[open] .more { display: none; }
  .unit.bd-已頒發 { border-color: #ffd85c; }
  .unit.bd-已完成待頒發 { border-color: #9fbcec; }

  ul.items { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.items li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 2px solid var(--gray-soft); align-items: flex-start; }
  ul.items li:last-child { border-bottom: 0; }
  ul.items .mark { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; margin-top: 1px; }
  ul.items .done .mark { background: var(--yellow); box-shadow: 0 2px 0 var(--yellow-dark); }
  ul.items .todo .mark { background: var(--gray-soft); color: var(--gray); border: 2px dashed #c7cdd9; }
  ul.items .when { display: block; color: var(--gray); font-size: 15px; }
  ul.items .done .when { color: var(--green-dark); font-weight: 700; }
  .section-title { margin: 14px 0 0; font-weight: 900; color: var(--blue-dark); display: inline-block; background: var(--blue-soft); padding: 2px 12px; border-radius: 999px; font-size: 16px; }

  /* ───── 闖關地圖 ───── */
  .map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 4px 0; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 14px 8px 12px; border: 2px solid var(--gray-line); border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .15s, background .15s; }
  .stage:hover { border-color: #9fbcec; }
  .stage.sel { border-color: var(--blue); background: var(--blue-soft); }
  @media (max-width: 759px) { .map { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
  .node { position: relative; width: 88px; height: 88px; flex: none; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--green) calc(var(--p) * 1%), #e6ebe3 0); padding: 8px; transition: transform .15s; }
  .node .in { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 40px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.06); }
  .stage.locked .node .in { filter: grayscale(1); opacity: .45; }
  .stage.locked .node::before { content: '🔒'; position: absolute; right: -2px; bottom: -2px; font-size: 26px; z-index: 1; }
  
  .stage.pending .node { background: conic-gradient(var(--blue) 100%, #fff 0); }
  .stage.done .node { background: conic-gradient(var(--yellow) 100%, #fff 0); }
  .stage.done .node::before { content: '🏅'; position: absolute; right: -4px; bottom: -4px; font-size: 32px; z-index: 1; }
  
  .stage .lv { font-size: 19px; font-weight: 900; }
  .stage .st { font-size: 15px; font-weight: 800; }
  .stage .cnt { font-size: 15px; color: var(--gray); }
  .stage.open .node { background: conic-gradient(var(--yellow) 100%, #fff 0); }
  .badge.open .disc { background: conic-gradient(var(--blue) 100%, #fff 0); }
  .hit { padding: 10px 0; border-bottom: 2px solid var(--gray-soft); cursor: pointer; }
  .hit mark { background: var(--yellow-soft); color: inherit; border-radius: 4px; padding: 0 2px; }
  .finish { text-align: center; font-size: 15px; font-weight: 800; color: var(--green-dark); }

  /* ───── 徽章收藏冊 ───── */
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px 8px; }
  @media (max-width: 759px) { .badges { grid-template-columns: repeat(3, 1fr); } }
  .badge { border: 0; background: none; cursor: pointer; text-align: center; padding: 0; }
  .badge .disc { position: relative; width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; padding: 6px; background: conic-gradient(var(--green) calc(var(--p) * 1%), #e8ecf3 0); }
  .badge .disc .in { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 36px; }
  .badge.got .disc { background: conic-gradient(var(--yellow) 100%, #fff 0); box-shadow: 0 0 0 3px #fff3c2, 0 4px 0 var(--yellow-dark); }
  .badge.got .disc .in { background: radial-gradient(circle at 35% 30%, #fffbe6, #ffe37a); }
  .badge.got .disc::after { content: '✓'; position: absolute; right: -2px; top: -2px; width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 900; font-size: 16px; display: grid; place-items: center; }
  .badge.none .disc .in { filter: grayscale(1); opacity: .4; }
  .badge.pending .disc { background: conic-gradient(var(--blue) 100%, #fff 0); }
  .badge .nm { font-weight: 900; font-size: 15px; margin-top: 6px; line-height: 1.3; }
  .badge .pc { font-size: 13px; color: var(--gray); }

  /* ───── 集點卡 ───── */
  .ring { width: 160px; height: 160px; margin: 6px auto 10px; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 1%), #e8ecf3 0); display: grid; place-items: center; padding: 14px; }
  .ring .in { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; }
  .ring b { font-size: 36px; color: var(--green-dark); line-height: 1; }
  .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 12px 8px; }
  .stamp { text-align: center; font-size: 13px; color: var(--gray); }
  .stamp .sp { width: 62px; height: 62px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; border: 3px dashed #d5dbe6; background: #fff; }
  .stamp.出席 .sp { border: 3px solid var(--green); background: var(--green-soft); transform: rotate(-8deg); }
  .stamp.請假 .sp { border: 3px solid #b39ddb; background: #f3eefc; }
  .stamp.遲到 .sp { border: 3px solid #f0a020; background: #fff4dc; transform: rotate(-8deg); }
  .counts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .counts span { background: var(--gray-soft); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 15px; }

  /* ───── 彈出視窗、提示 ───── */
  .sheet-bg { position: fixed; inset: 0; background: rgba(20, 30, 50, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 720px; max-height: 86vh; overflow: auto; border-radius: 26px 26px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
  @media (min-width: 760px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; max-height: 80vh; } .sheet .grab { display: none; } }
  .sheet .grab { width: 54px; height: 6px; background: var(--gray-line); border-radius: 3px; margin: 0 auto 12px; }
  .sheet h2 { margin: 0 0 10px; font-size: 21px; color: var(--blue-dark); }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 800; z-index: 50; max-width: 90vw; text-align: center; animation: pop .2s ease-out; }
  .loading { text-align: center; padding: 60px 0; color: var(--gray); font-weight: 700; }
  .loading .paw { font-size: 44px; display: inline-block; animation: bob 1s ease-in-out infinite; }
  .confetti { position: fixed; top: -20px; font-size: 22px; z-index: 60; pointer-events: none; animation: fall linear forwards; }

  /* ───── 後台 ───── */
  .list-row { display: flex; gap: 10px; align-items: center; padding: 12px 4px; border-bottom: 2px solid var(--gray-soft); }
  .list-row:last-child { border-bottom: 0; }
  .list-row.tap { cursor: pointer; }
  /* 按鈕很多的列（行事曆）：手機上按鈕換到第二行 */
  @media (max-width: 759px) { .list-row.mrow { flex-wrap: wrap; } .list-row.mrow .grow { flex: 1 1 100%; } }
  .list-row .t { font-weight: 900; }
  .roll-btn { min-width: 96px; min-height: 50px; border-radius: 14px; border: 3px solid var(--gray-line); background: #fff; font-weight: 900; font-size: 17px; cursor: pointer; }
  .roll-btn.出席 { background: var(--green); border-color: var(--green); color: #fff; }
  .roll-btn.請假 { background: #ede7f6; border-color: #b39ddb; color: #4a2c8a; }
  .roll-btn.遲到 { background: #fff4dc; border-color: #f0a020; color: #7a4a00; }
  .roll-btn.changed { box-shadow: 0 0 0 4px var(--yellow); }

async function api(action, data) {

/** 表單送出：停用按鈕、顯示錯誤訊息 */
function bindForm(form, handler) {
  if (!form) return;
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    const out = form.querySelector('.out');
    if (btn) btn.disabled = true;
    msg(out, '');
    try { await handler(new FormData(form), out); }
    catch (e) { if (e.code !== 'SESSION_EXPIRED') { if (out) msg(out, e.message); else alert(e.message); } }
    finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
  });
}
/** 按鈕點擊包裝：執行中停用、錯誤用 alert 顯示 */
async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { if (e.code !== 'SESSION_EXPIRED') alert(e.message); }
  finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
}
/** 需要確認的後台操作：後端回 needConfirm 時詢問，確認後帶 confirm 重送 */
async function withConfirm(action, data) {
  let r = await api(action, data);
  if (r.needConfirm) {
    if (!confirm('請再確認一次：\n\n' + (r.warnings || []).join('\n') + '\n\n確定要繼續嗎？')) return null;
    r = await api(action, Object.assign({}, data, { confirm: true }));
  }
  return r;
}
function openSheet(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div>${html}<button class="btn ghost" data-close>關閉</button></div>`;
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
  document.body.appendChild(bg);
  if (onMount) onMount(bg.querySelector('.sheet'), close);
  return close;
}

// ═════════════ 主流程 ═════════════

const pendingAward = {
  get() { try { return sessionStorage.getItem('pendingAward'); } catch (e) { return null; } },
  set(v) { try { sessionStorage.setItem('pendingAward', v); } catch (e) {} },
  clear() { try { sessionStorage.removeItem('pendingAward'); } catch (e) {} },
};

/** LINE 關鍵字「點名」回覆的直達連結 #roll=集會ID（SPEC 附錄第 63 點）：登入後直接打開那一場的點名 */
const pendingRoll = {
  get() { try { return sessionStorage.getItem('pendingRoll'); } catch (e) { return null; } },
  set(v) { try { sessionStorage.setItem('pendingRoll', v); } catch (e) {} },
  clear() { try { sessionStorage.removeItem('pendingRoll'); } catch (e) {} },
};

async function start() {
  const h = IN_GAS ? gasHash : location.hash;
  const rm = /^#roll=(.+)$/.exec(h);
  if (rm) {
    try { pendingRoll.set(decodeURIComponent(rm[1])); } catch (e) {}
    setHash('');
    if (!store.get('token')) return renderLogin({ notice: '請先登入，登入後會直接打開點名畫面。' });
  }
  const am = /^#award=(.+)$/.exec(h);
  if (am) {
    try { pendingAward.set(decodeURIComponent(am[1])); } catch (e) {}
    setHash('');
    if (!store.get('token')) return renderLogin({ notice: '請先登入，登入後會直接打開頒章畫面。' });
  }
  if (h === '#home' || h === '#catalog') return renderHome();
  if (h === '#progress' || h === '#badges') return renderCatalog(h.slice(1), { sec: '小狼' }); // 舊網址與 LINE 選單：小狼
  // 分團網址（附錄第 73 點④）：#scout、#scout/progress、#scout/badges
  const sm = /^#([a-z]+)(?:\/(progress|badges))?$/.exec(h);
  if (sm && secOfSlug(sm[1])) return sm[2] ? renderCatalog(sm[2], { sec: secOfSlug(sm[1]) }) : renderSectionPage(secOfSlug(sm[1]));
  if (INFO_PAGES[h.slice(1)]) return renderInfo(h.slice(1)); // LINE 圖文選單的連結
  if (!store.get('token')) return renderHome(); // 沒登入：先看首頁（SPEC 附錄第 34 點）
  loading();
  if (!state.section) state.section = store.get('sec') || null; // 上次選的分團
  try {
    // 一趟拿到登入資料和第一個畫面要用的資料（SPEC 附錄第 58 點）；舊後端沒有 startup 時退回 me
    try { const st = await api('startup'); state.me = st.me; state.prefetch = st.prefetch || {}; }
    catch (e0) { if (e0.code === 'SESSION_EXPIRED') throw e0; state.prefetch = {}; state.me = await api('me'); }
  }
  catch (e) {
    if (e.code === 'SESSION_EXPIRED') return;
    $app.innerHTML = `<section class="card"><div class="msg err">${esc(e.message)}</div><button class="btn" id="re">再試一次</button></section>`;
    $('#re').onclick = start;
    return;
  }
  state.section = state.me.section || null; // 以後端判斷的為準
  if (state.me.needsConsent) return renderReconsent();
  const back = state.returnTo; state.returnTo = null;
  state.mode = back ? back.mode : (state.me.role ? 'admin' : 'parent'); // 管理員預設進後台
  if (!state.me.role) state.mode = 'parent';
  if (back && back.cubId) state.cubId = back.cubId;
  if (!state.cubId || !state.me.cubs.some((c) => c.cubId === state.cubId)) state.cubId = (state.me.cubs[0] || {}).cubId || null;
  state.view = back ? back.view : 'home';
  if (back && back.admin) state.admin = back.admin;
  const pe = pendingEvent.get();
  if (pe) { pendingEvent.clear(); return renderEventForm(pe); } // 從活動頁按「我要報名」過來的，登入後直接開報名表
  const pa = pendingAward.get();
  if (pa) {
    pendingAward.clear();
    if (state.me.role === '團長') { state.mode = 'admin'; state.admin = { tab: 'home', page: { name: 'award', params: { deeplink: pa } } }; }
  }
  const pr = pendingRoll.get();
  if (pr) {
    pendingRoll.clear();
    if (state.me.role) { state.mode = 'admin'; state.admin = { tab: 'roll', page: { name: 'roll', params: { meetingId: pr } } }; }
  }
  route();
}

function route() { return state.mode === 'admin' ? renderAdmin() : renderParent(); }

/** 分團切換（兼任多個分團、admin、總團）：記住選擇、重新取得身分與首頁資料 */
async function switchSection(sec) {
  if (!canLeave() || sec === state.section) return;
  leaveGuard = null;
  state.section = sec;
  try { localStorage.setItem('sec', sec); } catch (e) {}
  loading('切換到' + secFull(sec) + '……');
  try { const st = await api('startup'); state.me = st.me; state.prefetch = st.prefetch || {}; state.section = st.me.section || sec; }
  catch (e) { if (e.code === 'SESSION_EXPIRED') return; toast(e.message); }
  state.admin = { tab: 'home', page: null };
  route();
}

async function logout() {
  try { await api('logout'); } catch (e) {}
  store.del('token');
  Object.assign(state, { me: null, detail: null, cubId: null, section: null, admin: { tab: 'home', page: null } });
  renderLogin({ notice: '已登出，下次見！' });
}

// ═════════════ 家長畫面：闖關冒險 ═════════════

// 三個分頁：首頁、進度（闖關｜徽章｜出席 用上方切換）、我的（SPEC 附錄第 44 點）
const PARENT_TABS = [['home', '🏠', '首頁'], ['notices', '📣', '公佈欄'], ['progress', '🗺️', '進度'], ['mine', '👤', '我的']];
const PARENT_SEGS = [['map', '🗺️ 闖關'], ['badges', '🎖️ 徽章'], ['attendance', '🐾 出席']];

function renderParentHeader() {
  const me = state.me;
  let html = '';
  if (me.cubs.length > 1) html += `<select id="cubSel" aria-label="切換孩子">${me.cubs.map((c) => `<option value="${esc(c.cubId)}" ${c.cubId === state.cubId ? 'selected' : ''}>${esc(c.name)}${new Set(me.cubs.map((x) => x.section)).size > 1 ? '（' + esc(secFull(c.section)) + '）' : ''}</option>`).join('')}</select>`;
  if (me.role) html += `<button class="chip-btn" id="toAdmin">後台</button>`;
  setHeader(html);
  const sel = $('#cubSel');
  if (sel) sel.onchange = () => { state.cubId = sel.value; state.detail = null; state.mapSel = null; renderParent(); };
  const ta = $('#toAdmin');
  if (ta) ta.onclick = () => { state.mode = 'admin'; route(); };
}

/** keep=true 時沿用已載入的資料（切換分頁不重新呼叫後端） */
const mySecs = () => [...new Set(((state.me && state.me.cubs) || []).map((c) => c.section || '小狼'))];
async function renderParent(keep) {
  // 標題寫目前孩子的分團（附錄第 73 點①⑰）
  const cur = (state.me.cubs || []).find((c) => c.cubId === state.cubId);
  document.getElementById('title').textContent = '🐾 22團' + (cur ? ' ' + secFull(cur.section || '小狼') : '');
  renderParentHeader();
  // 舊的分頁名稱（徽章、集點）對應到「進度」裡的切換
  if (state.view === 'badges' || state.view === 'attendance') { state.seg = state.view; state.view = 'progress'; }
  setTabs(PARENT_TABS, state.view, (v) => { state.view = v; renderParent(true); });
  scrollTop();
  if (state.view === 'notices') {
    loading();
    try { const list = noticesFor(await loadNotices(true), mySecs()); $app.innerHTML = noticesHtml(list, 30) || '<section class="card" id="noticeCard"><h2>📣 公佈欄</h2><p class="muted" style="margin:0">目前沒有公告。</p></section>'; }
    catch (e) { if (e.code !== 'SESSION_EXPIRED') $app.innerHTML = `<section class="card"><div class="msg err">${esc(e.message)}</div></section>`; }
    return;
  }
  if (state.view === 'mine') return renderMine();
  if (!state.cubId) return renderNoCub();
  if (!keep || !state.detail || state.detail.cub.cubId !== state.cubId) {
    loading('正在打開冒險地圖……');
    const pre = state.prefetch && state.prefetch.cubDetail;
    if (pre && pre.cub && pre.cub.cubId === state.cubId) { state.detail = pre; state.prefetch = {}; }
    else try { state.detail = await api('cubDetail', { cubId: state.cubId }); }
    catch (e) {
      if (e.code === 'SESSION_EXPIRED') return;
      if (e.code === 'NEED_CONSENT') return renderReconsent();
      $app.innerHTML = `<section class="card"><div class="msg err">${esc(e.message)}</div><button class="btn" id="re">再試一次</button></section>`;
      $('#re').onclick = () => renderParent();
      return;
    }
  }
  if (state.view === 'home') return viewHome(state.detail);
  // 進度：先畫選到的那一種，再把切換列放到最上面；沒有進程的分團（第 1 期：小狼以外）只有出席
  const segs = state.detail.hasProgress === false ? PARENT_SEGS.filter((x) => x[0] === 'attendance') : PARENT_SEGS;
  const seg = segs.some((x) => x[0] === state.seg) ? state.seg : segs[0][0];
  ({ map: viewMap, badges: viewBadges, attendance: viewStamps })[seg](state.detail);
  if (state.detail.hasProgress === false) $app.insertAdjacentHTML('afterbegin', `<section class="card"><p class="muted" style="margin:0">${esc(secFull(state.detail.cub.section))}的進程與章預定第 2 期上線，目前先提供出席紀錄。</p></section>`);
  $app.insertAdjacentHTML('afterbegin', `<div class="seg" id="pseg">${segs.map(([k, t]) => `<button data-seg="${k}" class="${k === seg ? 'on' : ''}">${t}</button>`).join('')}</div>`);
  $$('#pseg button').forEach((b) => { b.onclick = () => { state.seg = b.dataset.seg; renderParent(true); }; });
}

function requestsHtml(reqs) {
  if (!reqs || !reqs.length) return '';
  return reqs.map((r) => `<div class="list-row"><span class="grow"><span class="t">${r.type === '服務員' ? '🧢 服務員申請' : '🧒 ' + esc(r.name || '孩子申請')}</span>
    ${r.note ? `<br><span class="s">團長備註：${esc(r.note)}</span>` : ''}</span>
    <span class="pill ${r.status === '待審核' ? 'st-已完成待頒發' : 'st-未開始'}">${r.status === '待審核' ? '⏳ 等待團長審核' : '未通過'}</span></div>`).join('');
}
function renderNoCub() {
  const reqs = state.me.requests || [];
  // 只有其他分團身分的人（SPEC 附錄第 68 點）：分團功能還在準備中
  const staff = state.me.staff || [];
  if (staff.length && !state.me.role) {
    $app.innerHTML = `<section class="card welcome"><div class="mascot">🏕️</div><h2>分團功能準備中</h2>
      <p>您的身分：${staff.map((x) => `<span class="pill st-進行中">${esc(x.role === '總團' ? '總團' : x.section + '／' + x.role)}${x.title ? '（' + esc(x.title) + '）' : ''}</span>`).join(' ')}</p>
      <p class="muted">22 團團部網站正在建置，目前只開放小狼（幼童軍）的功能。您所屬分團的功能完成後，登入就會看到；現在可以先看上方的「公佈欄」與行事曆。</p></section>`;
    return;
  }

  const waiting = reqs.some((r) => r.status === '待審核');
  $app.innerHTML = `
    <section class="card welcome"><div class="mascot">${waiting ? '⏳' : '🧒'}</div><h2>${waiting ? '申請已送出，等待團長審核' : '還沒有綁定孩子'}</h2>
      <p class="muted">${waiting ? '團長核准後，這裡就會出現孩子的冒險紀錄（服務員核准後會出現「後台」按鈕）。可以稍後再回來看看。' : '到「我的」頁面填寫孩子姓名送出申請，團長核准後就能看到孩子的冒險紀錄。'}</p>
      ${waiting ? '<button class="btn ghost" id="reload">🔄 重新整理</button>' : '<button class="btn alt" id="go">前往新增孩子</button>'}</section>
    ${reqs.length ? `<section class="card"><h2>📝 我的申請</h2>${requestsHtml(reqs)}</section>` : ''}`;
  const go = $('#go'); if (go) go.onclick = () => { state.view = 'mine'; renderParent(true); };
  const rl = $('#reload'); if (rl) rl.onclick = () => start();
}

/** 進程細項（團自訂，只顯示不勾選）：收合在項目下面，點開才看到 */
function detailsHtml(it) {
  const gs = it.details || [];
  if (!gs.length) return '';
  const n = gs.reduce((a, g) => a + g.subs.length, 0);
  const many = gs.length > 1;
  return `<details class="sub" onclick="event.stopPropagation()"><summary>📋 本團細項 ${n} 條</summary>${gs.map((g) => `
    ${many && g.group ? `<div class="g">${esc(g.group)}</div>` : ''}<ul>${g.subs.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
    ${g.standard ? `<p class="std">✅ 通過標準：${esc(g.standard)}</p>` : ''}${g.life ? `<p class="std">🏠 生活應用：${esc(g.life)}</p>` : ''}`).join('')}</details>`;
}

/** 單一級別或技能章的任務清單（依大項分組） */
function itemsHtml(u) {
  const sections = [];
  u.items.forEach((it) => {
    let s = sections.find((x) => x.name === it.section);
    if (!s) sections.push((s = { name: it.section, items: [] }));
    s.items.push(it);
  });
  const showSec = sections.length > 1 || (sections[0] && sections[0].name !== '－');
  return sections.map((s) => `
    ${showSec ? `<div class="section-title">${esc(s.name)}</div>` : ''}
    <ul class="items">${s.items.map((it) => `
      <li class="${it.done ? 'done' : 'todo'}"><span class="mark">${it.done ? '⭐' : ''}</span>
        <span>${esc(it.text)}<span class="when">${it.done ? `完成！${fmtDate(it.date)}${it.auto ? '（出席自動完成）' : ''}` : '待挑戰'}</span>${detailsHtml(it)}</span></li>`).join('')}
    </ul>`).join('');
}

function statusLabel(u) {
  return u.status === '已頒發' ? '🏅 已拿到' : u.status === '已完成待頒發' ? '⏳ 等待頒發' : u.status === '進行中' ? '🔥 挑戰中' : '🔒 未開始';
}

/** 可展開的卡片（首頁用） */
function unitCard(u) {
  const pct = u.total ? Math.round((u.done / u.total) * 100) : 0;
  const sub = u.status === '已頒發'
    ? `<div class="muted">🏅 ${fmtDate(u.awardDate)} 頒發${u.awardOccasion ? `・${esc(u.awardOccasion)}` : ''}</div>`
    : `<div class="muted">⭐ ${u.done}／${u.total}</div><div class="bar ${pct === 100 ? 'full' : ''}"><span style="width:${pct}%"></span></div>`;
  return `
    <details class="unit bd-${esc(u.status)}">
      <summary>
        <div class="head"><span class="name">${iconOf(u)} ${esc(unitLabel(u))}</span><span class="pill st-${esc(u.status)}">${statusLabel(u)}</span></div>
        ${sub}
        ${u.status === '已完成待頒發' ? `<div class="msg info small">${esc(u.statusText)}</div>` : ''}
        ${u.desc ? `<div class="small" style="margin-top:6px">${esc(u.desc)}</div>` : ''}
        <div class="more">看看有哪些任務 ▾</div>
      </summary>
      <div class="body">${itemsHtml(u)}</div>
    </details>`;
}

        <div class="sub">${esc(secFull(sec))}${c.squad ? '・' + esc(c.squad) : ''}${t ? '・體驗中' : c.joinDate ? '・入團 ' + fmtDate(c.joinDate) : ''}</div>
        ${c.tenure && !t ? `<div class="sub">在團時間 ${esc(c.tenure)}${c.role ? '・' + esc(c.role) : ''}</div>` : ''}
        ${(c.squadStaff || []).length ? `<div class="sub">小隊輔：${esc(c.squadStaff.join('、'))}</div>` : ''}</div></div>

    <section class="card"><div class="row-flex"><span class="grow"><b>下次集會</b><br><span class="s">${nextMeet ? fmtDate(nextMeet.date) + '　' + esc(nextMeet.name) : '行事曆還沒有之後的集會'}</span></span><button class="btn ghost small" id="toAtt" style="margin-top:0">出席紀錄 ›</button></div></section>

function viewHome(d) {
  if (d.hasProgress === false) return viewHomeBasic(d);
  const c = d.cub, n = d.nextChallenge;
  const stars = d.units.reduce((s, u) => s + u.done, 0);
  const win = levelWindow(c.currentLevel), inWin = (u) => u.category !== '進程' || win.includes(u.unit);
  const got = d.units.filter((u) => u.status === '已頒發' && inWin(u)).sort((a, b) => (a.awardDate < b.awardDate ? 1 : -1));
  const challenging = d.units.filter((u) => (u.status === '進行中' || u.status === '已完成待頒發') && inWin(u))
    .sort((a, b) => (a.category === b.category ? STATUS_ORDER[a.status] - STATUS_ORDER[b.status] : a.category === '進程' ? -1 : 1));
  const notStarted = d.units.filter((u) => u.category === '技能章' && u.status === '未開始');
  const av = c.currentLevel ? lvIcon(c.currentLevel) : '🌱';
  let next;
  if (n.type === 'allDone') next = `<div class="banner"><p class="congrats">🎉 ${esc(n.message)}</p></div>`;
  else if (n.type === 'pending') next = `<div class="banner"><p class="congrats">${esc(n.message)}</p></div>`;
  else next = `${n.message ? `<div class="banner"><p class="congrats">🎉 ${esc(n.message)}</p></div>` : ''}
    <p class="muted">${n.level ? lvIcon(n.level) : ''} ${esc(lvName(n.level))}的下一關任務：</p>
    ${n.items.map((i, k) => `<div class="mission"><span class="no">${k + 1}</span><span class="txt">${esc(i.text)}</span></div>`).join('')}
    <button class="btn ghost small" id="toMap" data-lv="${esc(n.level)}">🗺️ 看${esc(lvName(n.level))}全部任務 →</button>`;
  if (d.trial) {
    // 體驗者：只有一個條件——參加滿 N 次一般團集會（SPEC 附錄第 40 點）
    const t = d.trial;
    $app.innerHTML = `<section class="card hero"><div class="top"><div class="avatar">🧪</div>
        <div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">體驗中${c.trialStart ? '・' + fmtDate(c.trialStart) + ' 開始' : ''}</div>
          <span class="levelchip">體驗者</span></div></div>
        <div class="stats3"><div><b>🐾 ${t.count}／${t.need}</b>一般團集會</div><div><b>${t.ready ? '✅' : '⏳'}</b>${t.ready ? '可以入團' : '還差 ' + (t.need - t.count) + ' 次'}</div><div><b>🌙 ${d.attendance.counts.leave}</b>請假</div></div></section>
      <section class="card"><h2>🧪 體驗者</h2>
        <p>參加滿 <b>${t.need} 次一般團集會</b>（大活動、特殊團集會不算，請假不算）就可以入團。${t.ready ? '<br>🎉 已經滿了！團長確認後會幫孩子轉為入團，接著開始挑戰「🌱 剛入團」。' : ''}</p>
        <div class="bar ${t.ready ? 'full' : ''}"><span style="width:${Math.min(100, Math.round(t.count / t.need * 100))}%"></span></div>
        <button class="btn ghost small" id="toMap" data-lv="剛入團">🌱 先看看剛入團要做什麼 →</button></section>`;
    $('#toMap').onclick = () => { state.mapSel = '剛入團'; state.seg = 'map'; state.view = 'progress'; renderParent(true); };
    return;
  }
  const nowLv = d.units.find((u) => u.category === '進程' && (u.status === '進行中' || u.status === '已完成待頒發'));
  const nextMeet = (d.attendance.upcoming || [])[0];
  $app.innerHTML = `
    <section class="card hero">
      <div class="top"><div class="avatar">${av}</div>
        <div class="grow"><div class="name">${esc(c.name)}</div>
          <div class="sub">${esc(c.squad || '')}${c.squad ? '・' : ''}入團 ${fmtDate(c.joinDate)}</div>
          <div class="sub">在團時間 ${esc(c.tenure)}${c.role ? '・' + esc(c.role) : ''}</div>
          ${(c.squadStaff || []).length ? `<div class="sub">小隊輔：${esc(c.squadStaff.join('、'))}</div>` : ''}
          <span class="levelchip">${c.currentLevel ? '目前級別：' + esc(lvName(c.currentLevel)) : '新入團：先挑戰剛入團'}</span></div></div>
      <div class="stats3"><div><b>${nowLv ? nowLv.done + '／' + nowLv.total : '⭐ ' + stars}</b>${nowLv ? esc(lvName(nowLv.unit)) + '進度' : '收集的星星'}</div><div><b>${got.filter((u) => u.category === '技能章').length}</b>技能章</div><div><b>${d.attendance.rate ? esc(d.attendance.rate.text) : d.attendance.counts.attended + ' 次'}</b>${d.attendance.rate ? '出席率' : '出席'}</div></div>
    </section>

    <section class="card"><h2>正在挑戰的</h2>
      ${challenging.length ? challenging.map(unitCard).join('') : '<p class="muted">目前沒有進行中的關卡。</p>'}</section>
    <section class="card"><h2>已經拿到的</h2>
      ${got.length ? got.map(unitCard).join('') : '<p class="muted">還沒有拿到章，一起加油！💪</p>'}</section>

      ${notStarted.map(unitCard).join('')}</details></section>` : ''}`;
  mountNotices(3, '.hero', [c.section || '小狼']);
  const tm = $('#toMap');
  if (tm) tm.onclick = () => { state.mapSel = tm.dataset.lv; state.seg = 'map'; state.view = 'progress'; renderParent(true); };
  const ta = $('#toAtt');
  if (ta) ta.onclick = () => { state.seg = 'attendance'; state.view = 'progress'; renderParent(true); };

/** 闖關地圖：剛入團 → 羚羊 → 狼 → 鹿 → 豹 */
function viewMap(d) {
  const win = levelWindow(d.cub.currentLevel);
  const units = win.map((l) => d.units.find((u) => u.category === '進程' && u.unit === l)).filter(Boolean);
  if (state.mapSel && !win.includes(state.mapSel)) state.mapSel = null;
  if (!state.mapSel) state.mapSel = (units.find((u) => u.status === '進行中' || u.status === '已完成待頒發') || units[units.length - 1]).unit;
  const cls = (u) => (u.status === '已頒發' ? 'done' : u.status === '已完成待頒發' ? 'pending' : u.status === '進行中' ? 'active' : 'locked');
  const sel = units.find((u) => u.unit === state.mapSel);
  $app.innerHTML = `
    <section class="card"><h2>🗺️ 闖關地圖</h2>
      ${d.trial ? '<div class="msg info small">🧪 目前是體驗者：入團後才開始闖關。可以先看看每一關要做什麼。</div>' : ''}
      <p class="muted small">這裡顯示目前這一級和下一級，點一個關卡，看看要完成哪些任務！</p>
      <div class="map">${units.map((u) => {
        const pct = u.total ? Math.round((u.done / u.total) * 100) : 0;
        return `<div class="stage ${cls(u)} ${u.unit === state.mapSel ? 'sel' : ''}" data-unit="${esc(u.unit)}" role="button" tabindex="0">
          <div class="node" style="--p:${pct}"><div class="in">${lvIcon(u.unit)}</div></div>
          <div><div class="lv">${esc(lvName(u.unit))}</div><div class="st">${statusLabel(u)}</div>
            <div class="cnt">${u.status === '已頒發' ? (u.awardDate ? fmtDate(u.awardDate) + ' 頒發' : '已晉級，視為通過') : '⭐ ' + u.done + '／' + u.total}</div></div></div>`;
      }).join('')}</div>
      <div class="finish">🏁 終點：完成豹級，成為全能小狼！</div>
    </section>
    ${sel ? `<section class="card" id="lvPanel"><h2>${lvIcon(sel.unit)} ${esc(lvName(sel.unit))}任務 <span class="pill st-${esc(sel.status)}">${statusLabel(sel)}</span></h2>
      ${sel.status === '已完成待頒發' ? `<div class="msg info">${esc(sel.statusText)}</div>` : ''}
      ${sel.status === '已頒發' ? `<div class="msg ok">🏅 ${sel.awardDate ? fmtDate(sel.awardDate) + ' 頒發' + (sel.awardOccasion ? '・' + esc(sel.awardOccasion) : '') : '已經晉級到更高的級別，視為通過'}</div>` : ''}
      ${sel.rule ? `<p class="small"><b>晉級條件：</b>${esc(sel.rule)}</p>` : ''}
      ${sel.attendRequired ? `<p class="small">🐾 晉級出席要求：上一級頒發後已出席 ${sel.attendSinceLast}／${sel.attendRequired} 次</p>` : ''}
      <div class="bar ${sel.done === sel.total ? 'full' : ''}"><span style="width:${sel.total ? Math.round(sel.done / sel.total * 100) : 0}%"></span></div>
      ${itemsHtml(sel)}
      ${sel.status === '進行中' ? '<div class="tip">💡 完成任務後，記得在團集會時請團長或服務員幫你簽核，星星就會亮起來喔！</div>' : ''}
      <button class="btn ghost" id="printBtn">🖨️ 列印這一級的簽核單</button></section>` : ''}`;
  $$('.stage').forEach((s) => { s.onclick = () => { state.mapSel = s.dataset.unit; viewMap(d); const p = $('#lvPanel'); if (p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
  const pb = $('#printBtn');
  if (pb) pb.onclick = () => printSheets(sel.unit, [{ cub: d.cub, awardDate: sel.awardDate, items: sel.items }], sel.rule);
}

/** 徽章收藏冊 */
function viewBadges(d) {
  const groups = ['服務類', '健身類', '技巧類'];
  const badges = d.units.filter((u) => u.category === '技能章');
  const other = badges.filter((u) => !groups.includes(u.group));
  const total = badges.length, got = badges.filter((u) => u.status === '已頒發').length;
  const tile = (u) => {
    const pct = u.total ? Math.round((u.done / u.total) * 100) : 0;
    const cls = u.status === '已頒發' ? 'got' : u.status === '已完成待頒發' ? 'pending' : u.done ? 'part' : 'none';
    return `<button class="badge ${cls}" data-unit="${esc(u.unit)}"><div class="disc" style="--p:${pct}"><div class="in">${iconOf(u)}</div></div>
      <div class="nm">${esc(u.unit)}</div><div class="pc">${u.status === '已頒發' ? '已收藏' : u.status === '已完成待頒發' ? '等待頒發' : u.done + '／' + u.total}</div></button>`;
  };
  $app.innerHTML = `
    <section class="card center"><h2 style="justify-content:center">🎖️ 我的徽章收藏冊</h2>
      <div style="font-size:30px;font-weight:900;color:var(--blue-dark)">${got} <span class="muted">／ ${total}</span></div>
      <div class="bar ${got === total && total ? 'full' : ''}"><span style="width:${total ? Math.round(got / total * 100) : 0}%"></span></div>
      <p class="muted small">點徽章看看怎麼拿到它！</p></section>
    ${groups.concat(other.length ? ['其他'] : []).map((g) => {
      const list = g === '其他' ? other : badges.filter((u) => u.group === g);
      return `<section class="card"><h2>${g === '服務類' ? '🤝' : g === '健身類' ? '🏃' : g === '技巧類' ? '🎨' : '🎖️'} ${esc(g)} <span class="s">已收藏 ${list.filter((u) => u.status === '已頒發').length}／${list.length} 個</span></h2>
        <div class="badges">${list.map(tile).join('')}</div></section>`;
    }).join('')}`;
  $$('.badge').forEach((b) => {
    b.onclick = () => {
      const u = badges.find((x) => x.unit === b.dataset.unit);

      openSheet(`<div class="center"><div style="font-size:64px">${iconOf(u)}</div><h2 style="text-align:center">${esc(u.unit)}技能章</h2>
        <span class="pill st-${esc(u.status)}">${statusLabel(u)}</span></div>
        ${u.status === '已頒發' ? `<div class="msg ok">🏅 ${fmtDate(u.awardDate)} 頒發${u.awardOccasion ? '・' + esc(u.awardOccasion) : ''}</div>` : ''}
        ${u.status === '已完成待頒發' ? `<div class="msg info">${esc(u.statusText)}</div>` : ''}
        ${u.desc ? `<p>${esc(u.desc)}</p>` : ''}
        <h3>合格標準</h3>${itemsHtml(u)}`);
    };
  });
}

/** 出席集點卡 */
function viewStamps(d) {
  const a = d.attendance, r = a.rate;
  const pct = r && r.rate != null ? Math.round(r.rate * 100) : 0;
  $app.innerHTML = `
    <section class="card center"><h2 style="justify-content:center">🐾 出席集點卡</h2>

// ───── 我的資料 ─────
async function renderMine() {
  const me = state.me;
  loading();
  let consent = null;
  try { consent = await api('consentText'); } catch (e) { if (e.code === 'SESSION_EXPIRED') return; }
  $app.innerHTML = `
    <section class="card"><h2>👤 我的帳號</h2>
      <div class="list-row"><span class="grow">帳號</span><b>${esc(me.username)}</b></div>
      <div class="list-row"><span class="grow">稱呼</span><b>${esc(me.nickname)}</b></div>
      ${me.role ? `<div class="list-row"><span class="grow">身分</span><b>${esc(me.role)}</b></div>` : ''}
      <details><summary class="fold">✏️ 修改稱呼</summary>
        <form id="fn"><input name="nickname" type="text" value="${esc(me.nickname)}" required><button class="btn" type="submit">儲存</button><div class="out"></div></form></details>
      <details><summary class="fold">🔒 修改密碼</summary>
        <form id="fp"><label>目前的密碼</label><input name="oldPassword" type="password" autocomplete="current-password" required>
          <label>新密碼（至少 8 個字）</label><input name="newPassword" type="password" autocomplete="new-password" required>
          <label>再輸入一次新密碼</label><input name="newPassword2" type="password" autocomplete="new-password" required>
          <button class="btn" type="submit">修改密碼</button><div class="out"></div></form></details>
    </section>
    <section class="card"><h2>🧒 綁定的孩子</h2>
      ${me.cubs.length ? me.cubs.map((c) => `
        <div class="unit" style="padding:14px">
          <div class="name">${esc(c.name)}</div>
          <div class="muted small">同意個資說明：第 ${esc(c.consentVersion)} 版${c.consentAt ? '，' + esc(new Date(c.consentAt).toLocaleString('zh-TW')) : ''}</div>
          <button class="btn danger small unbind" data-id="${esc(c.cubId)}" data-name="${esc(c.name)}">解除綁定</button>
        </div>`).join('') : '<p class="muted">目前沒有綁定任何孩子。</p>'}
      ${requestsHtml(me.requests)}
      <details style="margin-top:12px" ${me.cubs.length ? '' : 'open'}><summary class="fold">＋ 新增孩子（送出申請，由團長審核）</summary>
        <form id="fr">
          <div id="kidBox2">${childInputsHtml([])}</div>
          <button type="button" class="btn ghost small" id="addKid2">＋ 再加一位孩子</button>
          ${consent ? `<label class="check"><input type="checkbox" name="agree"> 我已閱讀並同意下方的個資說明（第 ${esc(consent.version)} 版）</label>` : ''}
          <button class="btn" type="submit">送出申請</button><div class="out"></div>
        </form></details>
      <details style="margin-top:4px"><summary class="fold" style="font-size:15px;color:var(--gray)">我有綁定碼</summary>
        <form id="fb">
          <label>綁定碼</label><input name="code" type="text" autocapitalize="characters" autocomplete="off" required>
          <label>孩子的姓名</label><input name="childName" type="text" autocomplete="off">
          ${consent ? `<label class="check"><input type="checkbox" name="agree"> 我已閱讀並同意下方的個資說明（第 ${esc(consent.version)} 版）</label>` : ''}
          <button class="btn" type="submit">新增綁定</button><div class="out"></div>
        </form></details>
    </section>
    <section class="card"><h2>📜 個資說明</h2>
      <details><summary class="fold">看完整內容（第 ${esc(consent ? consent.version : '')} 版）</summary>
        <div class="consent">${esc(consent ? consent.content : '')}</div></details>
      <h3>如何要求刪除資料？</h3>
      <p class="small">・不想再查看：按上方「解除綁定」，孩子的紀錄不受影響。<br>
        ・要刪除你的帳號，或刪除孩子的全部資料：請聯絡團長，團長會在後台處理並告訴你結果。<br>
        ・資料有錯誤需要更正：也請聯絡團長。</p>
    </section>
    <section class="card"><div class="row-flex"><button class="btn ghost small" id="toProgress">🗺️ 進程查詢</button><button class="btn ghost small" id="toBadges">🎖️ 技能章查詢</button><button class="btn ghost small" id="toHome">🏠 查詢首頁</button></div>
      <button class="btn ghost" id="lo">登出</button></section>`;
  $('#lo').onclick = logout;
  $('#toProgress').onclick = () => renderCatalog('progress');
  $('#toBadges').onclick = () => renderCatalog('badges');
  $('#toHome').onclick = renderHome;
  bindForm($('#fn'), async (fd, out) => {
    await api('updateNickname', { nickname: fd.get('nickname') });
    state.me.nickname = fd.get('nickname').trim();
    msg(out, '已儲存。', 'ok');
  });
  bindForm($('#fp'), async (fd, out) => {
    if (fd.get('newPassword') !== fd.get('newPassword2')) return msg(out, '兩次輸入的新密碼不一樣。');
    await api('changePassword', { oldPassword: fd.get('oldPassword'), newPassword: fd.get('newPassword') });
    $('#fp').reset();
    msg(out, '密碼已修改。其他裝置需要重新登入。', 'ok');
  });
  wireChildAdd($('#kidBox2'), $('#addKid2'));
  bindForm($('#fr'), async (fd, out) => {
    const kids = childNamesOf($('#fr'));
    if (!kids.length) return msg(out, '請填寫孩子的姓名。');
    if (consent && !fd.get('agree')) return msg(out, '請先勾選同意個資說明。');
    await api('requestChildren', { childNames: kids, childSections: childSecsOf($('#fr')), consentVersion: consent ? consent.version : undefined });
    state.me = await api('me');
    toast('已送出申請，等待團長審核');
    if (state.mode === 'admin') return goAdmin('mine');
    renderParent(true);
  });
  bindForm($('#fb'), async (fd, out) => {
    const childName = (fd.get('childName') || '').trim();
    if (childName && consent && !fd.get('agree')) return msg(out, '請先勾選同意個資說明。');
    const r = await api('bind', { code: fd.get('code'), childName, consentVersion: consent ? consent.version : undefined });
    state.me = await api('me');
    if (r.kind === 'parent') { state.cubId = r.cubId; state.detail = null; state.view = 'home'; return renderParent(); }
    state.mode = 'admin'; route();
  });
  $$('.unbind').forEach((b) => {
    b.onclick = () => {
      if (!confirm(`確定要解除與「${b.dataset.name}」的綁定嗎？\n解除後你就看不到這個孩子的資料（孩子的紀錄不受影響），之後要再送出申請、由團長審核才能再綁定。`)) return;
      act(b, async () => {
        await api('unbind', { cubId: b.dataset.id });
        state.me = await api('me');
        if (state.cubId === b.dataset.id) { state.cubId = (state.me.cubs[0] || {}).cubId || null; state.detail = null; }
        renderParent(true);
      });
    };
  });
}

let catalogData = null;
const PUBLIC_TABS = () => [['home', '🏠', '首頁'], ['notices', '📣', '公佈欄'], ['progress', '🗺️', '進程查詢'], ['badges', '🎖️', '章查詢'], ['login', '🔑', state.me ? '我的頁面' : '登入']];
const PUBLIC_HASH = { home: '#home', progress: '#progress', badges: '#badges' };
/** 公開頁面目前看的分團（進程、章查詢用；網址 #cub/progress）。沒指定時用上次看的，再沒有就是小狼 */
let pubSec = null;
const curPubSec = () => pubSec || (() => { try { return localStorage.getItem('pubSec'); } catch (e) { return null; } })() || '小狼';
function setPubSec(sec) { pubSec = sec; try { localStorage.setItem('pubSec', sec); } catch (e) {} }
document.getElementById('title').onclick = () => { if (!canLeave()) return; if (state.me) { state.view = 'home'; state.admin = { tab: 'home', page: null }; route(); } else renderHome(); };

/** 更新網址（方便分享），不重新載入頁面 */
function setHash(h) {
  if (IN_GAS) { gasHash = h || ''; try { google.script.history.replace(null, {}, gasHash.replace(/^#/, '')); } catch (e) {} return; }
  try { history.replaceState(null, '', location.pathname + location.search + (h || '')); } catch (e) {}
}

function onPublicTab(v) {
  if (v === 'login') { setHash(''); return state.me ? route() : renderLogin(); }
  if (v === 'home') return renderHome();
  if (v === 'notices') return renderInfo('notices');
  return renderCatalog(v, { sec: curPubSec() });
}

async function loadCatalog() {
  if (!catalogData) catalogData = await api('catalog');
  return catalogData;
}

/** 純列表（沒有完成狀態），依大項分組；q 有值時標示關鍵字 */
function catalogItemsHtml(u, q) {
  const mark = (t) => (q ? esc(t).split(esc(q)).join(`<mark>${esc(q)}</mark>`) : esc(t));
  const sections = [];
  u.items.forEach((it) => {
    let x = sections.find((y) => y.name === it.section);
    if (!x) sections.push((x = { name: it.section, items: [] }));
    x.items.push(it);
  });
  const showSec = sections.length > 1 || (sections[0] && sections[0].name !== '－');
  let n = 0;
  return sections.map((x) => `${showSec ? `<div class="section-title">${mark(x.name)}</div>` : ''}
    <ul class="items">${x.items.map((it) => `<li class="todo"><span class="mark">${++n}</span><span>${mark(it.text)}${detailsHtml(it)}</span></li>`).join('')}</ul>`).join('');
}

function openUnitSheet(u) {
  openSheet(`<div class="center"><div style="font-size:64px">${iconOf(u)}</div><h2 style="text-align:center">${esc(unitLabel(u))}${u.category === '技能章' ? '技能章' : ''}</h2>
    ${u.group ? `<span class="pill st-進行中">${esc(u.group)}</span>` : ''}</div>
    ${u.desc ? `<p>${esc(u.desc)}</p>` : ''}${u.rule ? `<p class="small"><b>晉級條件：</b>${esc(u.rule)}</p>` : ''}
    <h3>${u.category === '進程' ? '任務清單' : '合格標準'}（${u.items.length} 項）</h3>${catalogItemsHtml(u)}`);
}

  // ───── 設定（團長，SPEC 7.8） ─────
  async settings() {
    const d = await api('settingsGet');

    const site = d.canSite ? await api('siteContentGet') : null;

      const id = 'st-' + d.settings.indexOf(x);
      const opts = x.type === 'bool' ? ['是', '否'] : x.type === 'choice' ? x.options : null;
      const input = opts
        ? `<select class="full" id="${id}" data-k="${esc(x.key)}">${opts.map((o) => `<option ${x.value === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : `<input id="${id}" data-k="${esc(x.key)}" type="${x.type === 'int' ? 'number' : 'text'}" ${x.type === 'int' ? `min="${x.min}" max="${x.max}" inputmode="numeric"` : ''} value="${esc(x.value)}">`;
      return `<div class="list-row" style="display:block"><label for="${id}" style="margin-top:0">${esc(x.key)}${x.type === 'int' ? `<span class="s">（${x.min}～${x.max}）</span>` : ''}</label>
        ${x.desc ? `<p class="muted small" style="margin:0 0 6px">${esc(x.desc)}</p>` : ''}${input}
        ${x.error ? `<div class="msg warn small">試算表裡的值「${esc(x.sheetValue)}」有問題（${esc(x.error)}），目前用上面的值。</div>` : ''}</div>`;
    };
    const GROUP_TITLE = { 分團: `🏕️ ${secFull(d.section)}的設定`, 全團: '🌐 全團系統設定', 權限: '🔑 共用功能由誰使用（只有 admin 可以改）' };
    const grouped = ['分團', '全團', '權限'].map((g) => [g, d.settings.filter((x) => x.group === g)]).filter((x) => x[1].length);
    $app.innerHTML = `${backBtn()}<section class="card"><h2>⚙️ 設定</h2>
      <p class="muted small">改完按最下面「儲存」，立即生效。小隊名稱請到「🏕️ 小隊設定」。</p>
      <form id="fs">${grouped.map(([g, list]) => `<h3>${GROUP_TITLE[g]}</h3>${list.map(field).join('')}`).join('')}
        <div class="savebar"><button class="btn green" type="submit">💾 儲存設定</button><div class="out"></div></div></form></section>
      ${site ? `<section class="card"><h2>🌐 網站內容（不用登入就看得到）</h2>
        <p class="muted small">這三項會出現在網站首頁、「活動時間」與「認識 22 團」頁，也是 LINE 選單按鈕連到的內容。<b>不要寫孩子的姓名或其他個人資料。</b></p>
        <form id="fw"><label>認識 22 團（團的介紹、各分團、怎麼加入、聯絡方式）</label><textarea name="about" maxlength="5000" style="min-height:220px">${esc(site.about)}</textarea>
          <label>活動時間說明（固定的時間與地點，例如「每月第一、三週日 9:00～12:00」）</label><textarea name="activity" maxlength="1000" style="min-height:90px">${esc(site.activity)}</textarea>
          <label>22 團 FB 粉絲專頁網址</label><input name="fb" type="url" placeholder="https://www.facebook.com/…" value="${esc(site.fb)}">
          <button class="btn alt" type="submit">儲存網站內容</button><div class="out"></div></form></section>` : ''}
      ${d.canConsent ? `<section class="card"><h2>📜 個資說明（家長註冊時看到的內容）</h2>
        <p class="muted small">目前是第 ${esc(d.consent ? d.consent.version : '－')} 版${d.consent && d.consent.effective ? '（' + fmtDate(d.consent.effective) + ' 起）' : ''}。儲存後會變成新的一版，舊版保留；<b>已綁定的家長下次登入要重新同意</b>。</p>
        <form id="fc"><textarea name="content" style="min-height:260px">${esc(d.consent ? d.consent.content : '')}</textarea>
          <button class="btn alt" type="submit">儲存為新版本</button><div class="out"></div></form></section>` : ''}`;
    wireBack();
    const orig = {};
    $$('[data-k]').forEach((el) => { orig[el.dataset.k] = el.value; });
    const changes = () => { const c = {}; $$('[data-k]').forEach((el) => { if (el.value.trim() !== orig[el.dataset.k]) c[el.dataset.k] = el.value.trim(); }); return c; };
    leaveGuard = Object.assign(() => !Object.keys(changes()).length || confirm('設定還沒儲存，確定要離開嗎？'), { dirty: () => Object.keys(changes()).length > 0 });

      msg(out, `已儲存為第 ${r.version} 版。`, 'ok');
    });
  },
