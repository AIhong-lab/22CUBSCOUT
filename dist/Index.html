  async requests() {
    const d = await api('requestList');
    // 申請的分團（附錄第 73 點）：家長選「不確定」的是「未指定」，任何分團的團長都可以指定；也可以轉給別的分團
    const assignBox = (r) => `<div class="row-flex" style="align-items:center">${r.section === '未指定' ? '<span class="pill st-已完成待頒發">❓ 家長不確定分團</span>' : targetPill(r.section)}
      <select data-to style="width:auto">${(d.sections || SECTIONS).map((x) => `<option value="${esc(x)}" ${x === (r.section === '未指定' ? d.section : r.section) ? 'selected' : ''}>${esc(secFull(x))}</option>`).join('')}</select>
      <button class="btn ghost small" data-assign style="margin-top:0">${r.section === '未指定' ? '指定分團' : '改到這個分團'}</button></div>`;
    const cubOpt = (sel) => d.cubs.map((c) => `<option value="${esc(c.cubId)}" ${sel.includes(c.cubId) ? 'selected' : ''}>${esc(c.name)}（${esc(c.squad || '未分小隊')}）</option>`).join('');
    const card = (r) => r.type === '服務員' ? `
      <div class="unit" style="padding:14px" data-req="${esc(r.requestId)}">
        <div class="name">🧢 服務員申請</div>
        <div class="muted small">帳號 ${esc(r.username)}・${fmtTime(Date.parse(r.at))}${r.isAdmin ? '・<b>已經是管理員</b>' : ''}</div>
        ${assignBox(r)}
        <label>顯示姓名</label><input type="text" name="name" maxlength="30" value="${esc(r.name)}">
        <div class="row-flex"><button class="btn green small" data-ok>✅ 核准為服務員</button><button class="btn danger small" data-no>退回</button></div><div class="out"></div>
      </div>` : `
      <div class="unit" style="padding:14px" data-req="${esc(r.requestId)}">
        <div class="name">🧒 ${esc(r.name)}</div>
        <div class="muted small">申請人：${esc(r.nickname)}（帳號 ${esc(r.username)}）・${fmtTime(Date.parse(r.at))}</div>
        ${assignBox(r)}
        ${r.sameName.length ? '<div class="msg warn small">已經有同名的團員，可能是爸爸或媽媽已經申請過，建議選「連結到現有團員」。</div>' : ''}
        <div class="chips"><label class="check" style="margin:4px 12px 4px 0"><input type="radio" name="mode-${esc(r.requestId)}" value="new" ${r.sameName.length ? '' : 'checked'}> 新增團員（直接入團）</label>
          <label class="check" style="margin:4px 12px 4px 0"><input type="radio" name="mode-${esc(r.requestId)}" value="trial"> 🧪 新增為體驗者</label>
          <label class="check" style="margin:4px 0"><input type="radio" name="mode-${esc(r.requestId)}" value="link" ${r.sameName.length ? 'checked' : ''} ${d.cubs.length ? '' : 'disabled'}> 連結到現有團員</label></div>
        <div data-pane="new" ${r.sameName.length ? 'hidden' : ''}>
          <label>團員姓名（可修正錯字）</label><input type="text" name="name" maxlength="30" value="${esc(r.name)}">
          <label>小隊</label><select class="full" name="squad"><option value="">（未分小隊）</option>${d.squads.map((q) => `<option>${esc(q)}</option>`).join('')}</select>
          <label data-dl>入團日</label><input type="date" name="joinDate" value="${esc(d.today)}" max="${esc(d.today)}">
        </div>
        <div data-pane="link" ${r.sameName.length ? '' : 'hidden'}><label>選擇團員</label><select class="full" name="cubId">${cubOpt(r.sameName)}</select></div>
        <div class="row-flex"><button class="btn green small" data-ok>✅ 核准</button><button class="btn danger small" data-no>退回</button></div><div class="out"></div>
      </div>`;
    $app.innerHTML = `${backBtn()}<section class="card"><h2>📝 帳號申請 <span class="pill st-已完成待頒發">${d.items.length}</span></h2>
      <p class="muted small">這裡列出${esc(secFull(d.section))}的申請，以及家長不確定分團的申請（核准後就屬於${esc(secFull(d.section))}）。不是這個分團的，請用「改到這個分團」轉給該分團的團長。孩子核准時可以「新增團員（直接入團）」「新增為體驗者」或「連結到現有團員」（例如爸爸、媽媽各自申請同一個孩子）。</p>
      ${d.items.length ? d.items.map(card).join('') : '<p class="muted">目前沒有待審核的申請。</p>'}</section>`;
    wireBack();
    $$('[data-req]').forEach((box) => {
      const id = box.dataset.req;
      const val = (n) => { const el = box.querySelector(`[name=${n}]`); return el ? el.value : ''; };
      $$('input[type=radio]', box).forEach((rb) => { rb.onchange = () => {
        $$('[data-pane]', box).forEach((p) => { p.hidden = p.dataset.pane !== (rb.value === 'link' ? 'link' : 'new'); });
        const dl = box.querySelector('[data-dl]'); if (dl) dl.textContent = rb.value === 'trial' ? '體驗開始日' : '入團日';
      }; });
      box.querySelector('[data-ok]').onclick = (ev) => act(ev.target, async () => {
        const mode = (box.querySelector('input[type=radio]:checked') || {}).value || 'new';
        try { await api('requestApprove', { requestId: id, mode, name: val('name'), squad: val('squad'), joinDate: val('joinDate'), cubId: val('cubId') }); }
        catch (e) { if (e.code === 'SESSION_EXPIRED') return; return msg(box.querySelector('.out'), e.message); }
        toast('已核准'); goAdmin('requests');
      });
      const asg = box.querySelector('[data-assign]');
      if (asg) asg.onclick = (ev) => act(ev.target, async () => {
        const to = box.querySelector('[data-to]').value;
        await api('requestAssign', { requestId: id, to }); toast('已指定為' + secFull(to)); goAdmin('requests');
      });
      box.querySelector('[data-no]').onclick = (ev) => {
        const note = prompt('退回原因（申請人看得到，可留空）：', '');
        if (note === null) return;
        act(ev.target, async () => { await api('requestReject', { requestId: id, note }); toast('已退回'); goAdmin('requests'); });
      };
    });
  },

  // ───── 點名 ─────
  async roll(params) {
    const list = await api('meetingList');
    const meetings = list.meetings.filter((m) => m.enabled);
    if (!meetings.length) {
      $app.innerHTML = `<section class="card"><h2>📋 點名</h2><p class="muted">行事曆裡還沒有集會。</p>
        ${isLeader() ? '<button class="btn alt" id="cal">前往輸入行事曆</button>' : '<p class="muted">請團長先輸入集會行事曆。</p>'}</section>`;
      const c = $('#cal'); if (c) c.onclick = () => goAdmin('calendar');
      return;
    }
    const mid = params.meetingId || list.defaultId || meetings[meetings.length - 1].meetingId;
    const sheet = await api('attendanceSheet', { meetingId: mid });
    let squad = params.squad || mySquad(sheet.squads) || '全團';
    const marks = {};
    sheet.cubs.forEach((c) => { marks[c.cubId] = c.status; });
    const orig = Object.assign({}, marks);
    const NEXT = { '': '出席', '出席': '遲到', '遲到': '請假', '請假': '' };
    $app.innerHTML = `
      <section class="card"><h2>📋 點名</h2>
        <select class="full" id="mSel">${meetings.map((m) => `<option value="${esc(m.meetingId)}" ${m.meetingId === mid ? 'selected' : ''}>${fmtDate(m.date)}　${esc(m.name)}</option>`).join('')}</select>
        ${squadChips(sheet.squads, squad)}
        <p class="muted small">點一下切換：空白 → 🐾 出席 → ⏰ 遲到 → 🌙 請假 → 空白（遲到也算出席）${sheet.meeting.type === '大活動' ? '<br>🏕️ 這場是大活動：不列體驗者。' : ''}</p>
        <button class="btn alt small" id="allIn">✅ 全部出席（請假的不變）</button>
        <div id="rows"></div>
        <div class="savebar"><div class="muted small" id="sum"></div><button class="btn green" id="save">儲存點名</button></div>
        ${isLeader() ? '<button class="linkbtn" id="cal">📅 管理行事曆</button>' : ''}</section>`;
    const draw = () => {
      const show = sheet.cubs.filter((c) => squad === '全團' || c.squad === squad);
      $('#rows').innerHTML = show.length ? show.map((c) => `<div class="list-row"><span class="grow"><span class="t">${esc(c.name)}</span>${c.trial ? ' <span class="pill st-已完成待頒發">🧪 體驗</span>' : ''} <span class="s">${esc(c.squad || '')}</span></span>
        <button class="roll-btn ${esc(marks[c.cubId])} ${marks[c.cubId] !== orig[c.cubId] ? 'changed' : ''}" data-id="${esc(c.cubId)}">${MARK_LABEL[marks[c.cubId]] || '　－　'}</button></div>`).join('') : '<p class="muted">這個小隊沒有團員。</p>';
      const vals = Object.values(marks);
      const changed = Object.keys(marks).filter((k) => marks[k] !== orig[k]).length;
      $('#sum').textContent = `出席 ${vals.filter((v) => v === '出席' || v === '遲到').length} 人${vals.includes('遲到') ? `（遲到 ${vals.filter((v) => v === '遲到').length}）` : ''}・請假 ${vals.filter((v) => v === '請假').length} 人${changed ? `・尚未儲存 ${changed} 筆` : ''}`;
      $$('.roll-btn').forEach((b) => { b.onclick = () => { marks[b.dataset.id] = NEXT[marks[b.dataset.id]]; draw(); }; });
    };
    draw();
    const dirty = () => Object.keys(marks).some((k) => marks[k] !== orig[k]);
    leaveGuard = () => !dirty() || confirm('點名還沒儲存，確定要離開嗎？（剛才的變更會不見）');
    leaveGuard.dirty = dirty;
    onSquad((s) => { squad = s; $('#allIn').textContent = s === '全團' ? '✅ 全部出席（請假的不變）' : `✅ ${s}全部出席（請假的不變）`; draw(); });
    $('#allIn').onclick = () => {
      sheet.cubs.filter((c) => (squad === '全團' || c.squad === squad) && marks[c.cubId] === '').forEach((c) => { marks[c.cubId] = '出席'; });
      draw();
    };
    $('#mSel').onchange = () => {
      if (!canLeave()) { $('#mSel').value = mid; return; }
      leaveGuard = null;
      state.admin.page = { name: 'roll', params: { meetingId: $('#mSel').value, squad } }; renderAdmin();
    };
    $('#save').onclick = (ev) => act(ev.target, async () => {
      const changed = {};
      Object.keys(marks).forEach((k) => { if (marks[k] !== orig[k]) changed[k] = marks[k]; });
      if (!Object.keys(changed).length) return toast('沒有變更');
      const r = await api('attendanceSave', { meetingId: mid, marks: changed });
      Object.assign(orig, changed);
      draw();
      toast(`已儲存 ${r.changed} 筆點名 🐾`);
    });
    const c = $('#cal'); if (c) c.onclick = () => goAdmin('calendar');
  },

  // ───── 簽核（小隊批次） ─────
  // 三步驟：① 選小隊 → ② 選項目 → ③ 選團員與日期（SPEC 附錄第 44 點）；送出後留在第 ② 步可以接著簽下一批
  async sign(params) {
    const d = await api('signoffData');
    const st = { step: 1, squad: params.squad || mySquad(d.squads) || '全團', items: new Set(), cubs: null, filter: d.recent.length ? 'recent' : '', section: '', result: '' };
    const doneSet = new Set(d.done);
    const unitsList = [];
    d.items.forEach((i) => { const k = i.category + '|' + i.unit; if (!unitsList.includes(k)) unitsList.push(k); });
    if (!st.filter) st.filter = unitsList[0] || 'recent';
    const squadCubs = () => d.cubs.filter((c) => st.squad === '全團' || c.squad === st.squad);
    const ensureCubs = () => { if (!st.cubs) st.cubs = new Set(squadCubs().map((c) => c.cubId)); };
    const sumText = () => {
      ensureCubs();
      let n = 0, skip = 0;
      st.cubs.forEach((c) => st.items.forEach((i) => { doneSet.has(c + '|' + i) ? skip++ : n++; }));
      return `已選 ${st.items.size} 個項目 × ${st.cubs.size} 位團員：將新增 ${n} 筆${skip ? `，略過已完成 ${skip} 筆` : ''}`;
    };
    const TITLES = ['', '要簽哪一個小隊？', '這次完成了哪些項目？', '哪些團員完成了？'];
    const render = () => {
      ensureCubs();
      const head = `<div class="row-flex"><h2 class="grow" style="margin:0">✅ 簽核</h2><span class="muted small">步驟 ${st.step}／3</span></div>
        <div class="steps">${[1, 2, 3].map((n) => `<i class="${n <= st.step ? 'on' : ''}"></i>`).join('')}</div>
        <div id="result">${st.result}</div><h3 style="margin-top:0">${TITLES[st.step]}</h3>`;
      let body = '', bar = '';
      if (st.step === 1) {
        body = `${squadChips(d.squads, st.squad)}<p class="muted small" id="sqInfo"></p>`;
        bar = `<div class="savebar"><button class="btn cta" id="next" style="margin-top:0">下一步：選項目</button></div>`;
      } else if (st.step === 2) {
        body = `<p class="muted small">${esc(st.squad)}・照團集會實際完成的內容選，可以跨級。</p>
          <select class="full" id="flt"><option value="recent">⭐ 最近簽過的項目</option>${unitsList.map((k) => { const [c, u] = k.split('|'); return `<option value="${esc(k)}">${c === '進程' ? '進程・' + esc(lvName(u)) : '技能章・' + esc(u)}</option>`; }).join('')}</select>
          <div id="secs" class="chips"></div><div id="items"></div>`;
        bar = `<div class="savebar"><div class="muted small" id="sum"></div><div class="row-flex" style="flex-wrap:nowrap"><button class="btn ghost" id="prev" style="margin-top:6px;flex:0 0 auto;width:auto">‹ 上一步</button><button class="btn cta" id="next" style="margin-top:6px">下一步：選團員</button></div></div>`;
      } else {
        body = `<p class="muted small">預設全選${esc(st.squad)}，沒完成的取消勾選。</p><div id="cubs"></div>
          <label>完成日期</label><input type="date" id="date" value="${esc(d.today)}" max="${esc(d.today)}">`;
        bar = `<div class="savebar"><div class="muted small" id="sum"></div><div class="row-flex" style="flex-wrap:nowrap"><button class="btn ghost" id="prev" style="margin-top:6px;flex:0 0 auto;width:auto">‹ 上一步</button><button class="btn cta" id="go" style="margin-top:6px">送出簽核</button></div></div>`;
      }
      $app.innerHTML = `<section class="card">${head}${body}${bar}</section>`;
      const drawSum = () => { const el = $('#sum'); if (el) el.textContent = sumText(); };
      const pv = $('#prev'); if (pv) pv.onclick = () => { st.step--; st.result = ''; render(); };
      wireUndo();
      if (st.step === 1) {
        const info = () => { $('#sqInfo').textContent = `共 ${squadCubs().length} 位團員`; };
        info();
        onSquad((q) => { st.squad = q; st.cubs = null; info(); });
        $('#next').onclick = () => { if (!squadCubs().length) return alert('這個小隊沒有團員。'); st.cubs = null; st.step = 2; st.result = ''; render(); };
      } else if (st.step === 2) {
        const drawItems = () => {
          let list = st.filter === 'recent' ? d.recent.map((id) => d.items.find((i) => i.id === id)).filter(Boolean) : d.items.filter((i) => i.category + '|' + i.unit === st.filter);
          const secs = [...new Set(list.map((i) => i.section))].filter((x) => x !== '－');
          $('#secs').innerHTML = secs.length > 1 ? ['全部'].concat(secs).map((x) => `<button class="chip ${(st.section || '全部') === x ? 'on' : ''}" data-sec="${esc(x)}">${esc(x)}</button>`).join('') : '';
          if (st.section && st.section !== '全部') list = list.filter((i) => i.section === st.section);
          const cubsNow = [...st.cubs];
          const doneCount = (id) => cubsNow.filter((c) => doneSet.has(c + '|' + id)).length;
          $('#items').innerHTML = list.length ? list.map((i) => { const dc = doneCount(i.id); return `<label class="check"><input type="checkbox" data-item="${esc(i.id)}" ${st.items.has(i.id) ? 'checked' : ''}><span>${st.filter === 'recent' ? `<span class="s">${esc(i.unit)}${i.section !== '－' ? '・' + esc(i.section) : ''}</span><br>` : ''}${esc(i.text)}<br><span class="s" style="color:${cubsNow.length && dc === cubsNow.length ? 'var(--green-dark)' : 'var(--gray)'}">已完成 ${dc}／${cubsNow.length} 位${cubsNow.length && dc === cubsNow.length ? ' ✅' : ''}</span></span></label>`; }).join('')
            : `<p class="muted">${st.filter === 'recent' ? '還沒有最近簽過的項目，請從上方選級別或技能章。' : '沒有項目。'}</p>`;
          $$('#secs .chip').forEach((b2) => { b2.onclick = () => { st.section = b2.dataset.sec; drawItems(); }; });
          $$('#items input').forEach((cb) => { cb.onchange = () => { cb.checked ? st.items.add(cb.dataset.item) : st.items.delete(cb.dataset.item); drawSum(); }; });
        };
        $('#flt').value = st.filter;
        $('#flt').onchange = () => { st.filter = $('#flt').value; st.section = ''; drawItems(); };
        drawItems(); drawSum();
        $('#next').onclick = () => { if (!st.items.size) return alert('請至少選一個項目。'); st.step = 3; st.result = ''; render(); };
      } else {
        $('#cubs').innerHTML = squadCubs().map((c) => `<label class="check"><input type="checkbox" data-cub="${esc(c.cubId)}" ${st.cubs.has(c.cubId) ? 'checked' : ''}>${esc(c.name)} <span class="s">${esc(c.squad || '')}</span></label>`).join('') || '<p class="muted">沒有團員。</p>';
        $$('#cubs input').forEach((cb) => { cb.onchange = () => { cb.checked ? st.cubs.add(cb.dataset.cub) : st.cubs.delete(cb.dataset.cub); drawSum(); }; });
        drawSum();
        $('#go').onclick = (ev) => act(ev.target, async () => {
          if (!st.items.size || !st.cubs.size) return alert('請至少選一個項目和一位團員。');
          const r = await api('signoff', { cubIds: [...st.cubs], itemIds: [...st.items], date: $('#date').value });
          r.batch.forEach((x) => doneSet.add(x.cubId + '|' + x.itemId));
          st.items.forEach((i) => { if (!d.recent.includes(i)) d.recent.unshift(i); });
          st.items.clear();
          st.lastBatch = r.added ? r : null;
          st.result = `<div class="msg ok">✅ 新增 ${r.added} 筆、略過 ${r.skipped} 筆（已完成的不重複寫入）。可以接著簽下一批。</div>${r.added ? '<button class="btn ghost small" id="undo">↩️ 復原剛才這一批</button>' : ''}`;
          toast(`簽核完成：新增 ${r.added} 筆`);
          st.step = 2; render(); scrollTop();
        });
      }
    };
    const wireUndo = () => {
      const u = $('#undo'), r = st.lastBatch;
      if (!u || !r) return;
      u.onclick = (e2) => act(e2.target, async () => {
        if (!confirm(`確定要復原剛才的 ${r.added} 筆簽核嗎？`)) return;
        const x = await api('signoffRevoke', { entries: r.batch });
        r.batch.forEach((y) => doneSet.delete(y.cubId + '|' + y.itemId));
        st.lastBatch = null;
        st.result = `<div class="msg info">已復原 ${x.removed} 筆。</div>`;
        render();
      });
    };
    render();
  },

  // ───── 團員名單 ─────
  async cubs(params) {
    const [d, sq] = await Promise.all([api('cubList'), isLeader() ? api('squadList') : Promise.resolve({ squads: [] })]);
    const st = { squad: params.squad || '全團', status: params.status || '在團', sort: params.sort || 'squad', edit: !!params.edit };
    const squadNames = sq.squads.map((x) => x.name);
    const edits = {}; // 直接編輯：cubId → {name, squad, joinDate}（只放有改的欄位）
    const dirtyN = () => Object.keys(edits).filter((id) => Object.keys(edits[id]).length).length;
    $app.innerHTML = `
      <section class="card"><h2>👥 團員名單</h2>
        ${isLeader() ? `<div class="row-flex"><button class="btn alt small" id="add">＋ 新增團員</button><button class="btn ghost small" id="addTrial">🧪 新增體驗者</button>
          <button class="btn ghost small" id="importBtn">📥 批次匯入</button>
          <button class="btn ${st.edit ? 'green' : 'ghost'} small" id="editMode">${st.edit ? '✅ 結束編輯' : '✏️ 直接編輯'}</button></div>` : ''}
        ${st.edit ? '<p class="muted small">直接在表格裡改姓名、小隊、入團日，改完按下方「儲存」。有改的格子會標黃色。</p>' : ''}
        ${squadChips(d.squads, st.squad)}
        <div class="chips" id="sts">${['在團', '體驗', '升團', '離團', '已匿名', '全部'].map((s) => `<button class="chip ${s === st.status ? 'on' : ''}" data-st="${s}">${s}</button>`).join('')}</div>
        <div class="row-flex"><span class="muted small">排序：</span><select id="sort"><option value="squad">小隊</option><option value="join">入團日</option><option value="name">姓名</option></select></div>
        <div id="list"></div>
        ${st.edit ? '<div class="savebar"><div class="muted small" id="esum">沒有變更</div><button class="btn green" id="esave">💾 儲存</button></div>' : ''}</section>`;
    const draw = () => {
      const list = d.cubs.filter((c) => (st.squad === '全團' || c.squad === st.squad) && (st.status === '全部' || c.status === st.status));
      list.sort((a, b) => st.sort === 'join' ? (a.joinDate < b.joinDate ? -1 : 1) : st.sort === 'name' ? a.name.localeCompare(b.name, 'zh-Hant') : (a.squad || '').localeCompare(b.squad || '', 'zh-Hant') || a.name.localeCompare(b.name, 'zh-Hant'));
      if (st.edit) {
        const val = (c, k) => (edits[c.cubId] && edits[c.cubId][k] !== undefined ? edits[c.cubId][k] : c[k] || '');
        const opts = (c) => { const o = [''].concat(squadNames); if (c.squad && !o.includes(c.squad)) o.push(c.squad); return o; };
        const mk = (c, k) => (edits[c.cubId] && edits[c.cubId][k] !== undefined ? 'style="box-shadow:0 0 0 3px var(--yellow)"' : '');
        $('#list').innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl" style="width:100%"><thead><tr><th>姓名</th><th>小隊</th><th>入團日</th></tr></thead><tbody>${list.map((c) => `<tr data-id="${esc(c.cubId)}">
          <td><input type="text" data-f="name" maxlength="30" value="${esc(val(c, 'name'))}" ${mk(c, 'name')} style="min-width:120px"></td>
          <td><select class="full" data-f="squad" ${mk(c, 'squad')}>${opts(c).map((n) => `<option value="${esc(n)}" ${n === val(c, 'squad') ? 'selected' : ''}>${n ? esc(n) : '（不分小隊）'}</option>`).join('')}</select></td>
          <td>${c.status === '體驗' ? '<span class="s">🧪 體驗者</span>' : `<input type="date" data-f="joinDate" value="${esc(val(c, 'joinDate'))}" ${mk(c, 'joinDate')}>`}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">沒有符合條件的團員。</p>';
        $$('#list [data-f]').forEach((el) => {
          el.onchange = () => {
            const id = el.closest('tr').dataset.id, k = el.dataset.f, c = d.cubs.find((x) => x.cubId === id);
            edits[id] = edits[id] || {};
            if (el.value.trim() === (c[k] || '')) delete edits[id][k]; else edits[id][k] = el.value.trim();
            const n = dirtyN();
            $('#esum').textContent = n ? `已修改 ${n} 位團員，記得儲存` : '沒有變更';
            el.style.boxShadow = edits[id][k] !== undefined ? '0 0 0 3px var(--yellow)' : '';
          };
        });
        return;
      }
      $('#list').innerHTML = list.length ? list.map((c) => `<div class="list-row tap" data-id="${esc(c.cubId)}"><span style="font-size:28px">${c.status === '體驗' ? '🧪' : c.level ? LEVEL_ICON[c.level] : '🌱'}</span>
        <span class="grow"><span class="t">${esc(c.name)}</span>${c.role ? ` <span class="pill st-已頒發">${esc(c.role)}</span>` : ''} <span class="s">${esc(c.squad || '')}</span><br><span class="s">${c.status === '體驗' ? '體驗者' : '入團 ' + fmtDate(c.joinDate)}${c.level ? '・' + esc(lvName(c.level)) : ''}${c.status !== '在團' ? '・' + esc(c.status) : ''}</span></span><span>›</span></div>`).join('') : '<p class="muted">沒有符合條件的團員。</p>';
      $$('#list .list-row').forEach((r) => { r.onclick = () => goAdmin('cub', { cubId: r.dataset.id }); });
    };
    $('#sort').value = st.sort;
    $('#sort').onchange = () => { st.sort = $('#sort').value; draw(); };
    onSquad((s) => { st.squad = s; draw(); });
    $$('#sts .chip').forEach((b) => { b.onclick = () => { st.status = b.dataset.st; $$('#sts .chip').forEach((x) => x.classList.toggle('on', x === b)); draw(); }; });
    draw();
    const add = $('#add');
    if (add) add.onclick = () => goAdmin('cubEdit', {});
    const at = $('#addTrial'); if (at) at.onclick = () => goAdmin('cubEdit', { trial: true });
    const ib = $('#importBtn');
    if (ib) ib.onclick = () => openSheet(`<h2>📥 批次匯入名單</h2><p class="muted small">每行一位：<b>姓名 小隊 入團日</b>，用空白或逗號分開。小隊、入團日可以省略（入團日預設今天）。小隊要先在「小隊設定」建立。</p>
      <form id="fim"><textarea name="lines" style="min-height:200px" placeholder="王小明 黑隊 2025-09-01&#10;李小華 棕隊&#10;陳小美" required></textarea>
      <button class="btn" type="submit">匯入</button><div class="out"></div></form>`, (sh, close) => {
      bindForm($('#fim', sh), async (fd) => { const r = await withConfirm('cubImport', { lines: fd.get('lines') }); if (!r) return; close(); toast(`已匯入 ${r.added} 位`); goAdmin('cubs', { squad: st.squad, status: '在團', sort: st.sort }); });
    });
    if (st.edit) leaveGuard = Object.assign(() => !dirtyN() || confirm('名單的修改還沒儲存，確定要離開嗎？'), { dirty: () => dirtyN() > 0 });
    const em = $('#editMode');
    if (em) em.onclick = () => { if (canLeave()) { leaveGuard = null; goAdmin('cubs', { squad: st.squad, status: st.status, sort: st.sort, edit: !st.edit }); } };
    const es = $('#esave');
    if (es) es.onclick = () => act(es, async () => {
      const changes = Object.keys(edits).filter((id) => Object.keys(edits[id]).length).map((id) => Object.assign({ cubId: id }, edits[id]));
      if (!changes.length) return toast('沒有變更');
      const r = await api('cubBatchSave', { changes });
      leaveGuard = null;
      toast(`已儲存 ${r.changed} 位團員`);
      goAdmin('cubs', { squad: st.squad, status: st.status, sort: st.sort, edit: true });
    });
  },

  // ───── 新增／編輯團員 ─────
  async cubEdit(params) {
    let cub = { name: '', squad: '', joinDate: todayStr(), trialStart: todayStr(), status: params.trial ? '體驗' : '在團' };
    const sq = await api('squadList');
    if (params.cubId) cub = (await api('cubAdminDetail', { cubId: params.cubId })).cub;
    const trial = cub.status === '體驗';
    const names = sq.squads.map((x) => x.name);
    const opts = [''].concat(names);
    if (cub.squad && !names.includes(cub.squad)) opts.push(cub.squad); // 不在清單的舊名稱仍可保留
    $app.innerHTML = `${backBtn()}<section class="card"><h2>${params.cubId ? '✏️ 編輯' + (trial ? '體驗者' : '團員') : trial ? '🧪 新增體驗者' : '＋ 新增團員'}</h2>
      ${trial && !params.cubId ? '<p class="muted small">體驗者還沒入團：只能參加一般團集會，滿 4 次後由團長「轉為入團」。</p>' : ''}
      <form id="f"><label>姓名</label><input name="name" type="text" value="${esc(cub.name)}" required>
        <label>小隊</label><select class="full" name="squad">${opts.map((n) => `<option value="${esc(n)}" ${n === (cub.squad || '') ? 'selected' : ''}>${n ? esc(n) + (names.includes(n) ? '' : '（不在清單）') : '（不分小隊）'}</option>`).join('')}</select>
        ${names.length ? '' : '<div class="msg warn small">還沒有設定小隊清單。請先到「更多 → 🏕️ 小隊設定」新增小隊。</div>'}
        <button type="button" class="linkbtn" id="toSq">🏕️ 管理小隊清單</button>
        ${trial ? `<label>體驗開始日</label><input name="trialStart" type="date" value="${esc(cub.trialStart || todayStr())}" required>`
          : `<label>入團日（可填過去日期）</label><input name="joinDate" type="date" value="${esc(cub.joinDate)}" required>`}
        <button class="btn" type="submit">儲存</button><div class="out"></div></form></section>`;
    wireBack(params.cubId ? { name: 'cub', params: { cubId: params.cubId } } : null);
    $('#toSq').onclick = () => goAdmin('squads');
    bindForm($('#f'), async (fd) => {
      const r = await api('cubSave', { cubId: params.cubId, trial, name: fd.get('name'), squad: fd.get('squad'), joinDate: fd.get('joinDate'), trialStart: fd.get('trialStart') });
      toast(params.cubId ? '已儲存' : trial ? '已新增體驗者' : '已新增，綁定碼已產生');
      goAdmin('cub', { cubId: r.cubId, tab: params.cubId ? undefined : 'bind' });
    });
  },

  // ───── 單一團員 ─────
  async cub(params) {
    const [d, list] = await Promise.all([api('cubAdminDetail', { cubId: params.cubId }), api('cubList')]);
    const info = list.cubs.find((c) => c.cubId === params.cubId) || {};
    const c = d.cub, L = isLeader();
    let bindHtml = '';
    if (L && (c.status === '在團' || c.status === '體驗')) {
      const b = await api('cubBindings', { cubId: c.cubId });
      bindHtml = `<section class="card"><h2>🔑 綁定碼</h2>
        <div class="codebox">${esc(info.code || '（無）')}</div><p class="muted small center">還可以使用 ${esc(info.codeUsesLeft)} 次</p>
        <button class="btn alt" id="copyCode">📋 複製給家長的說明文字</button>
        <button class="btn ghost small" id="newCode">🔄 重新產生（舊碼立即失效）</button>
        <h3>已綁定的家長帳號（${b.bindings.length}）</h3>
        ${b.bindings.map((x) => `<div class="list-row"><span class="grow"><span class="t">${esc(x.nickname)}</span><br><span class="s">帳號 ${esc(x.username)}・同意第 ${esc(x.consentVersion)} 版</span></span><button class="btn danger small" data-unbind="${esc(x.accountId)}" data-n="${esc(x.nickname)}">解除</button></div>`).join('') || '<p class="muted">還沒有家長綁定。</p>'}</section>`;
    }
    const unitRow = (u) => {
      const pct = u.total ? Math.round(u.done / u.total * 100) : 0;
      const items = u.items.map((i) => `<li class="${i.done ? 'done' : 'todo'}"><span class="mark">${i.done ? '⭐' : `<input type="checkbox" data-sign="${esc(i.id)}" style="width:22px;height:22px" aria-label="勾選簽核">`}</span>
        <span class="grow">${esc(i.text)}<span class="when">${i.done ? `${fmtDate(i.date)}・${esc(i.signer)}` : '未完成'}</span>${detailsHtml(i)}</span>
        ${i.canRevoke ? `<button class="btn danger small" data-revoke="${esc(i.id)}">撤銷</button>` : ''}</li>`).join('');
      let actions = '';
      if (L && u.status === '已完成待頒發') actions = `<button class="btn alt small" data-award="${esc(u.unit)}">🏅 頒章</button>`;
      if (L && u.status === '已頒發' && u.awardDate) actions = `<button class="btn ghost small" data-aedit="${esc(u.unit)}">修改頒章</button> <button class="btn danger small" data-arevoke="${esc(u.unit)}">撤銷頒章</button>`;
      const elig = u.status === '已完成待頒發' ? (u.eligible ? `<div class="msg ok small">✅ 已達標（${fmtDate(u.eligibleDate)}）</div>` : `<div class="msg warn small">⏳ ${u.waitingUntil ? '晉級間隔到 ' + fmtDate(u.waitingUntil) + ' 才滿' : u.attendRequired ? '出席 ' + u.attendSinceLast + '／' + u.attendRequired + ' 次' : '上一級尚未頒發'}</div>`) : '';
      return `<details class="unit bd-${esc(u.status)}"><summary><div class="head"><span class="name">${iconOf(u)} ${esc(unitLabel(u))}</span><span class="pill st-${esc(u.status)}">${esc(u.status)}</span></div>
        ${u.status === '已頒發' ? `<div class="muted small">🏅 ${u.awardDate ? fmtDate(u.awardDate) + (u.awardOccasion ? '・' + esc(u.awardOccasion) : '') : '已晉級，視為通過'}</div>` : `<div class="muted small">⭐ ${u.done}／${u.total}</div><div class="bar ${pct === 100 ? 'full' : ''}"><span style="width:${pct}%"></span></div>`}
        ${elig}</summary><div class="body">${actions}<ul class="items">${items}</ul>
        ${u.status !== '已頒發' && u.done < u.total && c.status === '在團' ? `<div class="row-flex"><input type="date" class="sdate" value="${todayStr()}" max="${todayStr()}" style="width:auto"><button class="btn green small" data-signunit="${esc(u.unit)}">簽核勾選的項目</button></div>` : ''}</div></details>`;
    };
    const prog = d.units.filter((u) => u.category === '進程');
    const badges = d.units.filter((u) => u.category === '技能章');
    // 沒有進程的分團（第 1 期：小狼以外）只有「家長帳號」
    const P = d.hasProgress !== false;
    const tabs = (P ? [['prog', '進程'], ['badges', '技能章']] : []).concat(L ? [['bind', '家長帳號']] : []);
    // 剛新增的團員先看綁定碼；其餘預設看進程
    const tab = tabs.some((x) => x[0] === params.tab) ? params.tab : (P && !(c.status === '體驗' && L) ? 'prog' : 'bind');
    const att = d.attendance;
    $app.innerHTML = `${backBtn('團員名單')}
      <section class="card hero"><div class="top"><div class="avatar">${P ? (c.currentLevel ? lvIcon(c.currentLevel) : '🌱') : SEC_INFO[c.section || '小狼'].icon}</div>
        <div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.squad || '未分小隊')}${c.role ? '・' + esc(c.role) : ''}・${c.status === '體驗' ? '體驗者（' + fmtDate(c.trialStart) + ' 開始）' : '入團 ' + fmtDate(c.joinDate) + '（' + esc(c.tenure) + '）'}</div>
        ${(c.squadStaff || []).length ? `<div class="sub">小隊輔：${esc(c.squadStaff.join('、'))}</div>` : ''}
        <span class="levelchip">${P ? (c.currentLevel ? esc(lvName(c.currentLevel)) : '尚未頒發剛入團') + '・' : ''}${esc(c.status)}</span></div></div>
        <div class="stats3"><div><b>🐾 ${att.counts.attended}</b>出席${att.counts.late ? `（遲到 ${att.counts.late}）` : ''}</div><div><b>🌙 ${att.counts.leave}</b>請假</div><div><b>${att.rate ? esc(att.rate.text) : '－'}</b>出席率</div></div></section>
      <div class="row-flex" style="margin-bottom:14px">
        <div class="seg grow" id="cseg" style="margin:0">${tabs.map(([k, t]) => `<button data-seg="${k}" class="${k === tab ? 'on' : ''}">${t}</button>`).join('')}</div>
        <div class="more-menu"><button class="btn ghost small" id="moreBtn" style="margin-top:0" aria-label="更多操作">⋯</button>
          <div class="pop" id="morePop" hidden>
            ${L ? `<button id="edit">✏️ 編輯資料</button>${P ? '<button id="bf">📥 補登頒章</button>' : ''}` : ''}${L && c.status === '在團' ? '<button id="role">🎗️ 設定職務</button>' : ''}${P ? '<button id="pr">🖨️ 列印簽核單</button>' : ''}
            ${L && (c.status === '在團' || c.status === '體驗') ? '<button class="dg" id="leave">標記離團</button>' : ''}${L && c.status !== '已匿名' ? '<button class="dg" id="priv">個資處理</button>' : ''}</div></div></div>
      ${c.status === '體驗' && d.trial ? `<section class="card"><h2>🧪 體驗者</h2>
        <p>一般團集會出席 <b>${d.trial.count}／${d.trial.need}</b> 次${d.trial.ready ? '（✅ 已滿，可以入團）' : ''}。大活動不算。</p>
        <div class="bar ${d.trial.ready ? 'full' : ''}"><span style="width:${Math.min(100, Math.round(d.trial.count / d.trial.need * 100))}%"></span></div>
        ${L ? '<button class="btn green" id="join">🎉 轉為入團</button>' : ''}</section>` : ''}
      ${d.units.some((u) => u.status === '已頒發') ? `<section class="card"><h2>🏅 已獲得的章</h2><div class="award-strip">${d.units.filter((u) => u.status === '已頒發').map((u) => `<span class="a"><span class="pic">${iconOf(u)}</span>${esc(unitLabel(u))}<span class="s">${u.awardDate ? fmtDate(u.awardDate) : ''}</span></span>`).join('')}</div></section>` : ''}
      ${(d.roles || []).length ? `<section class="card"><details><summary class="fold">🎗️ 職務紀錄（${d.roles.length}）</summary>${d.roles.map((x) => `<div class="list-row"><span class="grow"><span class="t">${esc(x.role)}</span> <span class="s">${esc(x.squad)}</span></span><span class="s">${fmtDate(x.start)} ～ ${x.end ? fmtDate(x.end) : '現在'}</span></div>`).join('')}</details></section>` : ''}
      ${!P ? `<section class="card"><p class="muted" style="margin:0">${esc(secFull(c.section))}的進程與章預定第 2 期上線。</p></section>` : ''}
      ${tab === 'bind' ? (bindHtml || '<section class="card"><p class="muted">只有團長可以管理綁定碼與家長帳號。</p></section>') : ''}
      ${tab === 'prog' ? (c.status === '體驗' ? '<section class="card"><p class="muted">體驗者入團後才開始進程。</p></section>' : `<section class="card"><h2>🗺️ 進程</h2>${prog.map(unitRow).join('')}</section>`) : ''}
      ${tab === 'badges' ? `<section class="card"><h2>🎖️ 技能章</h2>${badges.map(unitRow).join('')}</section>` : ''}`;
    wireBack();
    const reload = () => goAdmin('cub', { cubId: c.cubId, tab });
    $$('#cseg button').forEach((b2) => { b2.onclick = () => goAdmin('cub', { cubId: c.cubId, tab: b2.dataset.seg }); });
    $('#moreBtn').onclick = (ev) => { ev.stopPropagation(); $('#morePop').hidden = !$('#morePop').hidden; };
    document.addEventListener('click', function closePop() { const pp = $('#morePop'); if (pp) pp.hidden = true; else document.removeEventListener('click', closePop); });
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = (ev) => fn(ev.currentTarget); };
    on('#edit', () => goAdmin('cubEdit', { cubId: c.cubId }));
    on('#join', (b) => {
      const dte = prompt(`「${c.name}」轉為入團，之後開始挑戰剛入團。\n入團日（例如 ${todayStr()}）：`, todayStr());
      if (dte) act(b, async () => { const r = await withConfirm('cubJoin', { cubId: c.cubId, joinDate: dte.trim() }); if (r) { toast('已轉為入團 🎉'); goAdmin('cub', { cubId: c.cubId, tab: 'prog' }); } });
    });
    on('#bf', () => goAdmin('backfill', { cubId: c.cubId }));
    on('#pr', () => goAdmin('print', { cubIds: [c.cubId] }));
    on('#priv', () => goAdmin('privacy', { cubId: c.cubId }));
    on('#role', () => {
      if (!c.canLead && !c.role) return alert(P ? `${c.name} 目前不能擔任正副小隊長：狼級以上才可以；小隊裡沒有狼級以上的小狼時，羚羊級也可以。也請先確認已經設定小隊。` : `請先幫 ${c.name} 設定小隊。`);
      openSheet(`<h2>🎗️ 設定職務</h2><p class="muted small">${esc(c.name)}・${esc(c.squad || '未分小隊')}。每個小隊正、副小隊長各一位；換人時原本那位會自動卸任，並留下任期紀錄。</p>
        <form id="frl"><label>職務</label><select class="full" name="role">${['', '小隊長', '副小隊長'].map((r) => `<option value="${r}" ${r === (c.role || '') ? 'selected' : ''}>${r || '隊員（沒有職務）'}</option>`).join('')}</select>
        <label>開始日</label><input type="date" name="date" value="${todayStr()}" max="${todayStr()}">
        <button class="btn" type="submit">儲存</button><div class="out"></div></form>`, (sh, close) => {
        bindForm($('#frl', sh), async (fd) => { const r = await withConfirm('cubRoleSave', { cubId: c.cubId, role: fd.get('role'), date: fd.get('date') }); if (!r) return; close(); toast('已更新職務'); reload(); });
      });
    });
    on('#leave', () => {
      openSheet(`<h2>標記離開</h2><p class="muted small">「${esc(c.name)}」離開後，綁定碼立即失效、職務自動卸任；紀錄都會保留。</p>
        <form id="flv">${c.status === '在團' ? `<label class="check"><input type="radio" name="reason" value="升團" checked> 🎓 升團（升上童軍團、畢業）</label>
          <label class="check"><input type="radio" name="reason" value="離團"> 離團（中途離開）</label>` : '<input type="hidden" name="reason" value="離團">'}
        <label>日期</label><input type="date" name="leftDate" value="${todayStr()}" required>
        <button class="btn danger" type="submit">確定</button><div class="out"></div></form>`, (sh, close) => {
        bindForm($('#flv', sh), async (fd) => { const r = await api('cubLeave', { cubId: c.cubId, leftDate: fd.get('leftDate'), reason: fd.get('reason') }); close(); toast('已標記' + r.status); reload(); });
      });
    });

  // ───── 頒章（批次） ─────
  async award(params) {
    const h = await api('adminHome');
    const cands = h.pending.map((p) => Object.assign({ ok: true }, p)).concat(h.waiting.map((p) => Object.assign({ ok: false }, p)));
    if (params.deeplink) {
      // 從 LINE 通知點進來：只勾那一位；已經頒過或找不到就照平常顯示
      const [cid, un] = String(params.deeplink).split(',');
      const hit = cands.find((x) => x.cubId === cid && x.unit === un);
      params = Object.assign({}, params, { preset: hit ? [hit] : null });
    }
    (params.preset || []).forEach((p) => { if (!cands.some((x) => x.cubId === p.cubId && x.unit === p.unit)) cands.unshift(Object.assign({ ok: false }, p)); });
    const key = (p) => p.cubId + '|' + p.unit;
    const chosen = new Set((params.preset || []).map(key));
    if (!params.preset) h.pending.forEach((p) => chosen.add(key(p)));
    $app.innerHTML = `${backBtn()}<section class="card"><h2>🏅 頒章</h2>
      <p class="muted small">同一場儀式可勾選多位團員、多個級別或技能章，共用頒發日期與場合。</p>
      ${cands.length ? cands.map((p) => `<label class="check"><input type="checkbox" data-k="${esc(key(p))}" ${chosen.has(key(p)) ? 'checked' : ''}><span>${esc(p.name)} <span class="s">${esc(p.squad || '')}</span><br>${iconOf(p)} ${esc(unitLabel(p))}${p.ok ? '' : ' <span class="pill st-未開始">尚未達標</span>'}</span></label>`).join('') : '<p class="muted">目前沒有可頒章的項目。上線前已拿到的章請到團員頁面使用「補登頒章」。</p>'}
      <form id="f"><label>頒發日期（儀式當天）</label><input type="date" name="date" value="${todayStr()}" required>
        <label>頒發場合（選填）</label><input type="text" name="occasion" placeholder="例如：11 月團集會">
        <label>備註（選填）</label><input type="text" name="note">
        <button class="btn alt" type="submit">🏅 確定頒章</button><div class="out"></div></form></section>`;
    wireBack(params.back || null);
    bindForm($('#f'), async (fd) => {
      const entries = $$('input[data-k]:checked').map((x) => { const [cubId, unit] = x.dataset.k.split('|'); return { cubId, unit }; });
      if (!entries.length) throw new ApiErr('BAD_INPUT', '請至少勾選一項。');
      const r = await withConfirm('award', { entries, date: fd.get('date'), occasion: fd.get('occasion'), note: fd.get('note') });
      if (!r) return;
      confetti();
      toast(`頒章完成：${r.added} 筆 🏅`);
      state.admin.page = params.back || null; renderAdmin();
    });
  },

  async print(params) {
    const cl = await api('cubList');
    const pre = new Set(params.cubIds || []);
    const cubs = cl.cubs.filter((c) => c.status === '在團' || pre.has(c.cubId));
    let squad = '全團', lv = '狼';
    $app.innerHTML = `${backBtn()}<section class="card"><h2>🖨️ 列印紙本簽核單（A4）</h2>
      <label>級別</label><div class="chips" id="lv">${LEVELS.map((l) => `<button class="chip ${l === lv ? 'on' : ''}" data-l="${l}">${LEVEL_ICON[l]} ${lvName(l)}</button>`).join('')}</div>
      <label>團員</label>${squadChips(cl.squads, squad)}<div id="list"></div>
      <button class="btn" id="go">🖨️ 列印</button></section>`;
    wireBack(pre.size === 1 ? { name: 'cub', params: { cubId: [...pre][0] } } : null);
    $$('#lv .chip').forEach((b) => { b.onclick = () => { lv = b.dataset.l; $$('#lv .chip').forEach((x) => x.classList.toggle('on', x === b)); }; });
    const draw = () => {
      $('#list').innerHTML = cubs.filter((c) => squad === '全團' || c.squad === squad).map((c) => `<label class="check"><input type="checkbox" data-id="${esc(c.cubId)}" ${pre.size ? (pre.has(c.cubId) ? 'checked' : '') : 'checked'}>${esc(c.name)} <span class="s">${esc(c.squad || '')}</span></label>`).join('');
    };
    onSquad((s) => { squad = s; pre.clear(); draw(); });
    draw();
    $('#go').onclick = (ev) => act(ev.currentTarget, async () => {
      const ids = $$('#list input:checked').map((x) => x.dataset.id);
      if (!ids.length) return alert('請至少選一位團員。');
      const r = await api('printData', { unit: lv, cubIds: ids });
      printSheets(r.unit, r.sheets, r.rule);
    });
  },

  /** 分團身分與邀請碼（SPEC 附錄第 68 點）：只有管理員（admin）或總團看得到 */

    const [st, acc] = await Promise.all([api('staffList'), api('accountList')]);
    const roles = st.isOwner ? ['服務員', '團長', '總團'] : ['服務員'];
    const opt = (list, cur) => list.map((r) => `<option ${r === cur ? 'selected' : ''}>${esc(r)}</option>`).join('');

    const fields = (x) => `<label>身分</label><select class="full" name="role">${opt(roles, x.role || '服務員')}</select>
      <label>分團（身分選「總團」時不用選）</label><select class="full" name="section">${opt(st.sections, x.section || '小狼')}</select>
      <label>職稱（顯示用，例如副團長、小隊輔；可空白）</label><input name="title" type="text" maxlength="20" value="${esc(x.title || '')}">

    $app.innerHTML = `${backBtn()}<section class="card"><h2>🏷️ 分團身分</h2>
      <p class="muted small">同一個人可以在不同分團各有一個身分。小狼以外的分團目前只有身分、功能準備中。${st.isOwner ? '' : '你可以設定服務員；總團、團長只有 admin 能指定。'}</p>
      ${bySec.map(([sec, list]) => `<h3>${esc(sec)}</h3>${list.map((x) => `<div class="list-row"><span class="grow"><span class="t">${esc(x.name)}</span> <span class="pill ${x.role === '服務員' ? 'st-進行中' : 'st-已頒發'}">${esc(x.role)}</span>${x.title ? ' ' + esc(x.title) : ''}${x.owner ? ' <span class="pill st-未開始">🔒 admin</span>' : ''}${x.lineLinked ? ' 💬' : ''}<br><span class="s">帳號 ${esc(x.username)}</span></span>
        ${x.owner && !st.isOwner ? '' : `<button class="btn ghost small" data-sf="${esc(x.accountId)}" data-k="${esc(x.key)}">管理</button>`}</div>`).join('')}`).join('') || '<p class="muted">還沒有任何身分。</p>'}</section>
      <section class="card"><h2>🎟️ 產生邀請碼</h2><p class="muted small">邀請碼已指定分團與身分，對方到網站「登入 → 註冊新帳號 → 我有綁定碼」輸入就生效。</p>
        <form id="fi">${fields({})}<button class="btn" type="submit">產生邀請碼</button><div class="out"></div></form><div id="invOut"></div></section>
      <section class="card"><h2>➕ 指定身分給已註冊的帳號</h2><input type="search" id="q" placeholder="搜尋帳號、稱呼或孩子姓名"><div id="cands"></div></section>`;
    wireBack();
    bindForm($('#fi'), async (fd) => {
      const r = await api('inviteCreate', { role: fd.get('role'), section: fd.get('section'), title: fd.get('title'), name: fd.get('name') });
      const who = fd.get('role') === '總團' ? '總團' : fd.get('section') + '／' + fd.get('role');
      const msg = `邀請您加入 22 團網站（${who}）：\n請到網站按「登入 → 註冊新帳號 → 我有綁定碼」，輸入：${r.code}\n（${fmtTime(r.expiresAt)} 前有效）`;
      $('#invOut').innerHTML = `<div class="codebox">${esc(r.code)}</div><pre class="copytext">${esc(msg)}</pre><button class="btn alt" id="cpi">📋 複製，用 LINE 傳給對方</button>`;
      $('#cpi').onclick = () => copyText(msg);
    });
    const save = (sh, close, body) => bindForm($('#fs', sh), async (fd) => {
      await api('staffSave', Object.assign(body, { role: fd.get('role'), section: fd.get('section'), title: fd.get('title'), name: fd.get('name') }));
      close(); toast('已儲存，立即生效'); goAdmin('staff');
    });
    const drawCands = () => {
      const q = $('#q').value.trim();
      const list = q ? acc.accounts.filter((x) => x.status === '啟用' && [x.username, x.nickname].concat(x.cubs).some((v) => v.includes(q))).slice(0, 20) : [];
      $('#cands').innerHTML = q ? (list.map((x) => `<div class="list-row"><span class="grow"><span class="t">${esc(x.nickname)}</span><br><span class="s">帳號 ${esc(x.username)}</span></span><button class="btn small" data-pk="${esc(x.accountId)}" data-n="${esc(x.nickname)}">指定</button></div>`).join('') || '<p class="muted">沒有符合的帳號。</p>') : '<p class="muted small">輸入關鍵字搜尋。</p>';
      $$('[data-pk]').forEach((b) => { b.onclick = () => openSheet(`<h2>指定身分</h2><form id="fs">${fields({ name: b.dataset.n })}<button class="btn" type="submit">確認</button><div class="out"></div></form>`, (sh, close) => save(sh, close, { type: 'add', accountId: b.dataset.pk })); });
    };
    $('#q').oninput = drawCands; drawCands();
    $$('[data-sf]').forEach((b) => {
      b.onclick = () => {
        const x = st.staff.find((y) => y.accountId === b.dataset.sf && y.key === b.dataset.k);
        openSheet(`<h2>${esc(x.name)}：${esc(label(x))}</h2><form id="fs">${fields(x)}<button class="btn" type="submit">儲存</button><div class="out"></div></form>
          <button class="btn danger" id="rm">移除這個身分</button><p class="muted small">只移除這個分團的身分，帳號與其他分團身分保留。</p>`, (sh, close) => {
          save(sh, close, { type: 'update', accountId: x.accountId, key: x.key });
          $('#rm', sh).onclick = (ev) => { if (confirm(`確定移除「${x.name}」的${label(x)}身分？`)) act(ev.currentTarget, async () => { await api('staffSave', { type: 'remove', accountId: x.accountId, key: x.key }); close(); goAdmin('staff'); }); };
        });
      };
    });
  },

      <label class="check"><input type="radio" name="mode" value="anonymize" checked> 匿名化：姓名改為「已離團小狼＋流水號」、清空小隊、刪除綁定；進程與出席紀錄保留供統計</label>
      ${!state.me.ownerExists || state.me.isOwner ? '<label class="check"><input type="radio" name="mode" value="delete"> 完全刪除：刪除這位團員在所有分頁的資料</label>' : '<p class="muted small">🔒 完全刪除只有 admin 帳號可以使用。</p>'}
      <button class="btn ghost" id="pv">① 預覽會影響幾列資料</button><div id="out"></div></section>`;
    wireBack(params.cubId ? { name: 'cub', params: { cubId: params.cubId } } : null);
    $('#pv').onclick = (ev) => act(ev.currentTarget, async () => {
      const mode = $('input[name=mode]:checked').value, cubId = $('#cub').value;
      const r = await api('privacyPreview', { cubId, mode });
      $('#out').innerHTML = `<div class="msg info">${Object.entries(r.counts).map(([k, v]) => `${esc(k)}：${v} 列`).join('\n')}</div>
        <label>② 請輸入團員姓名「${esc(r.cubName)}」確認</label><input type="text" id="cn" autocomplete="off">
        <button class="btn danger" id="ex">③ 確定執行${mode === 'delete' ? '完全刪除' : '匿名化'}</button>`;
      $('#ex').onclick = (e2) => {
        if (!confirm('最後確認：執行後無法復原，確定嗎？')) return;
        act(e2.currentTarget, async () => {
          await api('privacyExecute', { cubId, mode, confirmName: $('#cn').value.trim() });
          $('#out').innerHTML = `<div class="msg ok">已完成。</div><div class="msg warn">提醒：既有的每週備份檔仍含這位團員的資料，會在保留份數輪替後自動消失。</div>
            <button class="btn ghost" id="pg">立即刪除所有舊備份並重新備份</button>`;
          $('#pg').onclick = (e3) => { if (confirm('刪除所有舊備份並重新備份一份？')) act(e3.currentTarget, async () => { const b = await api('backupPurge'); toast(b.message); }); };
        });
      };
    });
  },

  async backup() {
    const h = await api('adminHome');
    const b = h.alerts.backup, p = h.alerts.permission;
    $app.innerHTML = `${backBtn()}<section class="card"><h2>💾 備份</h2>
      ${h.alerts.backupFolderSet ? '' : '<div class="msg warn small">尚未設定備份資料夾：請在 Apps Script 執行一次 setup，會自動建立資料夾並開啟每週自動備份。</div>'}
      <p>上次備份：${b ? fmtTime(b.at) + '<br>' + esc(b.message) : '還沒有紀錄'}</p>
      <button class="btn" id="bk">立即備份</button><button class="btn danger" id="pg">刪除所有舊備份並重新備份</button></section>
      <section class="card"><h2>🛡️ 試算表權限</h2>
      <p>${p ? (p.ok ? '✅ 權限正常' : '🚨 ' + esc(p.issues.join('；'))) + '<br><span class="s">檢查時間 ' + fmtTime(p.at) + '</span>' : '還沒有檢查過'}</p>
      <button class="btn ghost" id="pc">檢查試算表權限</button></section>`;
    wireBack();
    $('#bk').onclick = (ev) => act(ev.currentTarget, async () => { const r = await api('backupNow'); toast(r.message); goAdmin('backup'); });
    $('#pg').onclick = (ev) => { if (confirm('刪除備份資料夾裡所有舊備份，再重新備份一份？')) act(ev.currentTarget, async () => { const r = await api('backupPurge'); toast(r.message); goAdmin('backup'); }); };
    $('#pc').onclick = (ev) => act(ev.currentTarget, async () => { await api('permCheck'); goAdmin('backup'); });
  },

  async line() {
    const me = await api('me');
    $app.innerHTML = `${backBtn()}<section class="card"><h2>💬 連結 LINE 通知</h2>
      <p>${me.lineLinked ? '✅ 你已連結 LINE 通知。團員達標時會在 LINE 通知你。' : '連結後，團員達標時官方帳號會在 LINE 通知你。'}</p>
      <button class="btn alt" id="go">${me.lineLinked ? '重新連結' : '取得配對碼'}</button><div id="out"></div>
      ${me.lineLinked ? '<button class="btn danger" id="un">解除連結</button>' : ''}</section>`;
    wireBack();
    $('#go').onclick = (ev) => act(ev.currentTarget, async () => {
      const r = await api('lineLinkStart');
      $('#out').innerHTML = `<div class="codebox">${esc(r.code)}</div><ol class="small"><li>用手機 LINE 加入「22團幼童軍進程系統」官方帳號好友（已加過就略過）</li><li>在聊天室輸入上面這 6 位數字並送出</li><li>收到「已連結」的回覆就完成了</li></ol><p class="muted small">配對碼 ${r.expiresInMin} 分鐘內有效，只能用一次。</p>`;
    });
    const un = $('#un');
    if (un) un.onclick = (ev) => { if (confirm('解除後就不會收到 LINE 通知了，確定嗎？')) act(ev.currentTarget, async () => { await api('lineUnlink'); goAdmin('line'); }); };
  },
};

new MutationObserver(applyUnitImages).observe($app, { childList: true, subtree: true });
const BOOT = (typeof window.__BOOT === 'object' && window.__BOOT) || null;
if (BOOT) {
  // 由 GAS 提供時，首頁要用的公開資料已經放在網頁裡（SPEC 附錄第 57 點）
  if (BOOT.catalog && BOOT.catalog.units) catalogData = BOOT.catalog;
  if (Array.isArray(BOOT.notices)) noticeData = BOOT.notices;
  if (BOOT.site && BOOT.site.meetings) siteData = BOOT.site;
  if (BOOT.images) unitImgs = BOOT.images;
  gasBase = BOOT.webUrl || '';
}
if (unitImgs) applyUnitImages();
else api('unitImages').then((r) => { unitImgs = r.images || {}; applyUnitImages(); }).catch(() => { unitImgs = {}; });
if (IN_GAS) {
  // 由 GAS 提供：先問清楚網址帶了什麼（#notices 或 ?p=notices，LINE 選單用），再開始
  if (!gasBase) api('ping').then((r) => { gasBase = r.webUrl || ''; }).catch(() => {});
  const boot = (loc) => { const p = loc && loc.parameter && loc.parameter.p; gasHash = p ? '#' + p : (loc && loc.hash ? '#' + loc.hash : ''); start(); };
  try { google.script.url.getLocation(boot); } catch (e) { boot(null); }
} else start();
// PWA（SPEC 附錄第 62 點）：GitHub 版註冊 Service Worker，網頁存在手機裡、可以加入主畫面。由 GAS 提供時不做
if (!IN_GAS && 'serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
