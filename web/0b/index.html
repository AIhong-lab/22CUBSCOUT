<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0B 技術驗證</title>
<!-- 階段 0B 技術驗證用的暫時頁面，階段 3 會由正式的 web/index.html 取代並刪除 -->
<!-- GAS 網址不寫在程式碼裡，由測試者貼上後存在自己的瀏覽器 -->
<style>
  :root { --blue:#1f4e9c; --yellow:#ffc928; --bg:#f6f8fc; --card:#fff; --text:#1d2433; --muted:#5b6475; --ok:#1d7a3a; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.6 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
  header { background:var(--blue); color:#fff; padding:16px; border-bottom:6px solid var(--yellow); }
  header h1 { margin:0; font-size:22px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  h2 { margin:0 0 8px; font-size:20px; color:var(--blue); }
  label { display:block; margin:10px 0 4px; font-weight:600; }
  input[type=text],input[type=password],input[type=url] { width:100%; font-size:18px; padding:12px; border:2px solid #cfd6e4; border-radius:10px; }
  button { font-size:18px; padding:12px 18px; border:0; border-radius:10px; background:var(--blue); color:#fff; margin-top:12px; min-height:48px; cursor:pointer; }
  button.alt { background:var(--yellow); color:var(--text); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .msg { margin-top:10px; padding:10px; border-radius:10px; white-space:pre-wrap; word-break:break-all; }
  .msg.ok { background:#e6f4ea; color:var(--ok); }
  .msg.err { background:#fce8e6; color:var(--err); }
  .msg:empty { display:none; }
  .muted { color:var(--muted); font-size:15px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header><h1>幼童軍系統・階段 0B 技術驗證</h1></header>
<main>
  <section class="card">
    <h2>設定：貼上 GAS 網址</h2>
    <label for="gasUrl">GAS 網址（以 /exec 結尾）</label>
    <input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <button id="saveUrl">儲存</button>
    <div id="urlMsg" class="msg"></div>
  </section>

  <section class="card">
    <h2>① 連線測試</h2>
    <p class="muted">按下後網頁會呼叫 GAS，成功會顯示花了幾秒。</p>
    <button id="ping">測試連線</button>
    <div id="pingMsg" class="msg"></div>
  </section>

  <section class="card">
    <h2>② 帳號登入測試</h2>
    <div id="viewAuth">
      <div id="authNotice" class="msg"></div>
      <label for="username">帳號（4～20 個英文字母、數字或底線）</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="off">
      <label for="password">密碼（至少 8 個字元）</label>
      <input id="password" type="password" autocomplete="current-password">
      <label for="nickname">稱呼（只有註冊時需要，請用虛構名字）</label>
      <input id="nickname" type="text" placeholder="例如：測試小狼媽媽">
      <label><input id="remember" type="checkbox"> 記住我（30 天）</label>
      <p class="muted">不勾「記住我」時，登入 2 分鐘後就會過期，方便測試。</p>
      <div class="row">
        <button id="register" class="alt">註冊</button>
        <button id="login">登入</button>
      </div>
      <div id="authMsg" class="msg"></div>
    </div>
    <div id="viewMe" class="hidden">
      <p>✅ 你已登入。這一頁代表「需要登入才看得到的畫面」。</p>
      <div id="meMsg" class="msg"></div>
      <div class="row">
        <button id="refresh">再呼叫一次（檢查是否過期）</button>
        <button id="logout" class="alt">登出</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>③ LINE 回覆測試</h2>
    <p class="muted">這一項在 LINE 裡測：加官方帳號好友，傳任意文字，應收到「✅ 0B 測試成功」的回覆。</p>
  </section>

  <p class="muted" id="ua"></p>
</main>
<script>
// ───── 瀏覽器儲存：失敗時（無痕模式等）不讓頁面壞掉 ─────
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const $ = (id) => document.getElementById(id);
function show(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

$('gasUrl').value = store.get('gasUrl') || '';
$('ua').textContent = '瀏覽器：' + navigator.userAgent;

$('saveUrl').onclick = () => {
  const u = $('gasUrl').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) {
    return show($('urlMsg'), '網址格式不對，應該是 https://script.google.com/macros/s/……/exec', false);
  }
  store.set('gasUrl', u);
  show($('urlMsg'), '已儲存。', true);
};

// ───── 呼叫 GAS：text/plain + JSON，避免 CORS 預檢 ─────
async function api(action, data) {
  const url = store.get('gasUrl');
  if (!url) throw new Error('請先在最上面貼上 GAS 網址並儲存。');
  const t0 = performance.now();
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token: store.get('token') }, data || {})),
  });
  const json = await res.json();
  json._sec = ((performance.now() - t0) / 1000).toFixed(1);
  return json;
}

$('ping').onclick = async () => {
  show($('pingMsg'), '連線中……', true);
  try {
    const r = await api('ping');
    show($('pingMsg'), r.ok ? `成功！花了 ${r._sec} 秒。\n伺服器時間：${r.serverTime}` : '失敗：' + r.message, r.ok);
  } catch (e) { show($('pingMsg'), '失敗：' + e.message, false); }
};

// ───── 登入流程 ─────
function showView(name) {
  $('viewAuth').classList.toggle('hidden', name !== 'auth');
  $('viewMe').classList.toggle('hidden', name !== 'me');
}

// 呼叫需要登入的 API；憑證過期時清除憑證、回到登入畫面，登入後自動回到原畫面
let returnTo = null;
async function authed(action, onOk) {
  const r = await api(action);
  if (!r.ok && r.code === 'SESSION_EXPIRED') {
    store.del('token');
    returnTo = action;
    showView('auth');
    show($('authNotice'), '登入已過期，請重新登入。登入後會自動回到剛才的畫面。', false);
    return;
  }
  onOk(r);
}

function loadMe() {
  return authed('me', (r) => {
    showView('me');
    show($('meMsg'), r.ok ? `帳號：${r.username}\n稱呼：${r.nickname}\n憑證到期：${new Date(r.expiresAt).toLocaleString()}\n這次呼叫花了 ${r._sec} 秒` : '失敗：' + r.message, r.ok);
  });
}

function formData() {
  return { username: $('username').value.trim(), password: $('password').value, nickname: $('nickname').value.trim(), remember: $('remember').checked };
}

$('register').onclick = async () => {
  show($('authMsg'), '註冊中……', true);
  try {
    const r = await api('register', formData());
    show($('authMsg'), r.ok ? `註冊成功！密碼雜湊 ${r.hashIter} 次花了 ${r.hashMs} 毫秒（整趟 ${r._sec} 秒）。請按「登入」。` : r.message, r.ok);
  } catch (e) { show($('authMsg'), '失敗：' + e.message, false); }
};

$('login').onclick = async () => {
  show($('authMsg'), '登入中……', true);
  try {
    const r = await api('login', formData());
    if (!r.ok) return show($('authMsg'), r.message, false);
    store.set('token', r.token);
    $('password').value = '';
    $('authMsg').textContent = ''; $('authNotice').textContent = '';
    const back = returnTo; returnTo = null;
    if (back) console.log('登入後回到：' + back);
    await loadMe();
  } catch (e) { show($('authMsg'), '失敗：' + e.message, false); }
};

$('refresh').onclick = () => loadMe().catch((e) => show($('meMsg'), '失敗：' + e.message, false));

$('logout').onclick = async () => {
  try { await api('logout'); } catch (e) {}
  store.del('token');
  showView('auth');
};

// 開啟頁面時：已有憑證就直接進「已登入」畫面（測試「記住我」）
if (store.get('token') && store.get('gasUrl')) loadMe().catch(() => showView('auth'));
</script>
</body>
</html>
