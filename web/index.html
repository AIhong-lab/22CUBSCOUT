    let squad = '全團', lv = '狼';
    $app.innerHTML = `${backBtn()}<section class="card"><h2>🖨️ 列印簽核單（A4）</h2>
      <label>級別</label><div class="chips" id="lv">${LEVELS.map((l) => `<button class="chip ${l === lv ? 'on' : ''}" data-l="${l}">${LEVEL_ICON[l]} ${l}級</button>`).join('')}</div>
      <label>小狼</label>${squadChips(cl.squads, squad)}<div id="list"></div>
      <button class="btn" id="go">🖨️ 列印</button></section>`;
    wireBack(pre.size === 1 ? { name: 'cub', params: { cubId: [...pre][0] } } : null);
    $$('#lv .chip').forEach((b) => { b.onclick = () => { lv = b.dataset.l; $$('#lv .chip').forEach((x) => x.classList.toggle('on', x === b)); }; });
    const draw = () => {
      $('#list').innerHTML = cubs.filter((c) => squad === '全團' || c.squad === squad).map((c) => `<label class="check"><input type="checkbox" data-id="${esc(c.cubId)}" ${pre.size ? (pre.has(c.cubId) ? 'checked' : '') : 'checked'}>${esc(c.name)} <span class="s">${esc(c.squad || '')}</span></label>`).join('');
    };
    onSquad((s) => { squad = s; pre.clear(); draw(); });
    draw();
    $('#go').onclick = (ev) => act(ev.currentTarget, async () => {
      const ids = $$('#list input:checked').map((x) => x.dataset.id);
      if (!ids.length) return alert('請至少選一位小狼。');
      const r = await api('printData', { unit: lv, cubIds: ids });
      printSheets(r.unit, r.sheets, r.rule);
    });
  },

  async admins() {
    const [a, acc, inv] = await Promise.all([api('adminList'), api('accountList'), api('inviteList')]);
    const adminIds = new Set(a.admins.map((x) => x.accountId));
    $app.innerHTML = `${backBtn()}<section class="card"><h2>👥 管理員</h2>
      ${a.admins.map((x) => `<div class="list-row"><span class="grow"><span class="t">${esc(x.name)}</span> <span class="pill ${x.role === '團長' ? 'st-已頒發' : 'st-進行中'}">${esc(x.role)}</span>${x.lineLinked ? ' 💬' : ''}<br>
        <span class="s">帳號 ${esc(x.username)}・加入 ${fmtTime(x.joinedAt)}・指定人 ${esc(x.assignedBy || '－')}</span></span>
        <button class="btn ghost small" data-ad="${esc(x.accountId)}">管理</button></div>`).join('')}</section>
      <section class="card"><h2>➕ 從已註冊的帳號指定</h2><p class="muted small">對方已有帳號（例如家長兼服務員）時用。</p>
        <input type="search" id="q" placeholder="搜尋帳號、稱呼或孩子姓名"><div id="cands"></div></section>
      <section class="card"><h2>✉️ 邀請新的管理員</h2><p class="muted small">對方沒有孩子在團裡時用。</p>
        <form id="fi"><label>角色</label><select class="full" name="role"><option>服務員</option><option>團長</option></select>
          <label>對方姓名</label><input name="name" type="text" required><button class="btn alt" type="submit">產生邀請碼</button><div class="out"></div></form>
        <h3>尚未使用的邀請碼</h3>${inv.invites.map((i) => `<div class="list-row"><span class="grow"><span class="t">${esc(i.code)}</span> ${esc(i.name)}（${esc(i.role)}）<br><span class="s">${i.expired ? '已過期' : '有效到 ' + fmtTime(i.expiresAt)}</span></span><button class="btn danger small" data-void="${esc(i.code)}">作廢</button></div>`).join('') || '<p class="muted">沒有。</p>'}</section>`;
    wireBack();
    const drawCands = () => {
      const q = $('#q').value.trim();
      const list = acc.accounts.filter((x) => !adminIds.has(x.accountId) && x.status === '啟用' && (!q || [x.username, x.nickname].concat(x.cubs).some((s) => s.includes(q)))).slice(0, 20);
      $('#cands').innerHTML = list.map((x) => `<div class="list-row"><span class="grow"><span class="t">${esc(x.nickname)}</span><br><span class="s">帳號 ${esc(x.username)}${x.cubs.length ? '・孩子 ' + esc(x.cubs.join('、')) : ''}</span></span><button class="btn small" data-pick="${esc(x.accountId)}" data-n="${esc(x.nickname)}">指定</button></div>`).join('') || '<p class="muted">沒有符合的帳號。</p>';
      $$('[data-pick]').forEach((b) => {
        b.onclick = () => openSheet(`<h2>指定管理員</h2><form id="fa"><label>角色</label><select class="full" name="role"><option>服務員</option><option>團長</option></select>
          <label>要顯示的姓名</label><input name="name" type="text" value="${esc(b.dataset.n)}" required><button class="btn" type="submit">確認指定</button><div class="out"></div></form>`, (sh, close) => {
          bindForm($('#fa', sh), async (fd) => { await api('adminAdd', { accountId: b.dataset.pick, role: fd.get('role'), name: fd.get('name') }); close(); toast('已指定，立即生效'); goAdmin('admins'); });
        });
      });
    };
    $('#q').oninput = drawCands;
    drawCands();
    bindForm($('#fi'), async (fd, out) => {
      const r = await api('inviteCreate', { role: fd.get('role'), name: fd.get('name') });
      out.innerHTML = `<div class="codebox">${esc(r.code)}</div><pre class="copytext">${esc(r.message)}</pre><button type="button" class="btn alt" id="cp">📋 複製邀請說明文字</button>`;
      $('#cp').onclick = () => copyText(r.message);
    });
    $$('[data-void]').forEach((b) => { b.onclick = () => { if (confirm('作廢這組邀請碼？')) act(b, async () => { await api('inviteVoid', { code: b.dataset.void }); goAdmin('admins'); }); }; });
    $$('[data-ad]').forEach((b) => {
      b.onclick = () => {
        const x = a.admins.find((y) => y.accountId === b.dataset.ad);
        openSheet(`<h2>管理：${esc(x.name)}</h2><form id="fu"><label>角色</label><select class="full" name="role"><option ${x.role === '服務員' ? 'selected' : ''}>服務員</option><option ${x.role === '團長' ? 'selected' : ''}>團長</option></select>
          <label>顯示姓名</label><input name="name" type="text" value="${esc(x.name)}" required><button class="btn" type="submit">儲存</button><div class="out"></div></form>
          <button class="btn danger" id="rm">移除管理員身分</button><p class="muted small">移除後帳號保留，綁定的孩子仍可用家長身分查詢。</p>`, (sh, close) => {
          bindForm($('#fu', sh), async (fd) => { await api('adminUpdate', { accountId: x.accountId, role: fd.get('role'), name: fd.get('name') }); close(); toast('已更新，立即生效'); goAdmin('admins'); });
          $('#rm', sh).onclick = (ev) => { if (confirm(`確定移除「${x.name}」的管理員身分？`)) act(ev.currentTarget, async () => { await api('adminRemove', { accountId: x.accountId }); close(); goAdmin('admins'); }); };
        });
      };
    });
  },

  async accounts() {
    const acc = await api('accountList');
    $app.innerHTML = `${backBtn()}<section class="card"><h2>🔑 帳號管理</h2><input type="search" id="q" placeholder="搜尋帳號、稱呼或孩子姓名"><div id="list"></div></section>`;
    wireBack();
    const draw = () => {
      const q = $('#q').value.trim();
      const list = acc.accounts.filter((x) => !q || [x.username, x.nickname].concat(x.cubs).some((s) => s.includes(q)));
      $('#list').innerHTML = list.map((x) => `<div class="list-row"><span class="grow"><span class="t">${esc(x.nickname)}</span> ${x.role ? `<span class="pill st-進行中">${esc(x.role)}</span>` : ''}${x.status !== '啟用' ? ' <span class="pill st-未開始">停用</span>' : ''}<br>
        <span class="s">帳號 ${esc(x.username)}${x.cubs.length ? '・孩子 ' + esc(x.cubs.join('、')) : ''}<br>最後登入 ${fmtTime(x.lastLogin)}</span></span><button class="btn ghost small" data-m="${esc(x.accountId)}">管理</button></div>`).join('') || '<p class="muted">沒有符合的帳號。</p>';
      $$('[data-m]').forEach((b) => {
        b.onclick = () => {
          const x = acc.accounts.find((y) => y.accountId === b.dataset.m);
          openSheet(`<h2>${esc(x.nickname)}（${esc(x.username)}）</h2>
            <button class="btn alt" id="tc">🔁 產生重設密碼臨時碼</button><div id="tcOut"></div>
            <button class="btn ghost" id="st">${x.status === '啟用' ? '⛔ 停用帳號' : '✅ 重新啟用'}</button>
            <button class="btn danger" id="del">🗑️ 刪除帳號（家長要求時）</button>
            <p class="muted small">刪除帳號會一併刪除登入與綁定紀錄，孩子的資料不受影響。</p>`, (sh, close) => {
            $('#tc', sh).onclick = (ev) => act(ev.currentTarget, async () => {
              const r = await api('accountTempCode', { accountId: x.accountId });
              $('#tcOut', sh).innerHTML = `<div class="codebox">${esc(r.code)}</div><pre class="copytext">${esc(r.message)}</pre><button class="btn alt" id="cp">📋 複製，用 LINE 傳給對方</button>`;
              $('#cp', sh).onclick = () => copyText(r.message);
            });
            $('#st', sh).onclick = (ev) => act(ev.currentTarget, async () => { await api('accountStatus', { accountId: x.accountId, status: x.status === '啟用' ? '停用' : '啟用' }); close(); goAdmin('accounts'); });
            $('#del', sh).onclick = (ev) => {
              const u = prompt(`刪除後無法復原。請輸入帳號名稱「${x.username}」確認：`);
              if (u) act(ev.currentTarget, async () => { await api('accountDelete', { accountId: x.accountId, confirmUsername: u.trim() }); close(); toast('已刪除帳號'); goAdmin('accounts'); });
            };
          });
        };
      });
    };
    $('#q').oninput = draw;
    draw();
  },

  async privacy(params) {
    const cl = await api('cubList');
    const cubs = cl.cubs.filter((c) => c.status !== '已匿名').sort((a, b) => (a.status === '離團' ? 0 : 1) - (b.status === '離團' ? 0 : 1));
    $app.innerHTML = `${backBtn()}<section class="card"><h2>🔐 個資處理</h2>
      <div class="msg warn small">針對離團小狼或家長要求時使用。執行後無法復原。</div>
      <label>小狼</label><select class="full" id="cub">${cubs.map((c) => `<option value="${esc(c.cubId)}" ${c.cubId === params.cubId ? 'selected' : ''}>${esc(c.name)}（${esc(c.status)}${c.leftDate ? ' ' + fmtDate(c.leftDate) : ''}）</option>`).join('')}</select>
      <label>處理方式</label>
      <label class="check"><input type="radio" name="mode" value="anonymize" checked> 匿名化：姓名改為「已離團小狼＋流水號」、清空小隊、刪除綁定；進程與出席紀錄保留供統計</label>
      <label class="check"><input type="radio" name="mode" value="delete"> 完全刪除：刪除這位小狼在所有分頁的資料</label>
      <button class="btn ghost" id="pv">① 預覽會影響幾列資料</button><div id="out"></div></section>`;
    wireBack(params.cubId ? { name: 'cub', params: { cubId: params.cubId } } : null);
    $('#pv').onclick = (ev) => act(ev.currentTarget, async () => {
      const mode = $('input[name=mode]:checked').value, cubId = $('#cub').value;
      const r = await api('privacyPreview', { cubId, mode });
      $('#out').innerHTML = `<div class="msg info">${Object.entries(r.counts).map(([k, v]) => `${esc(k)}：${v} 列`).join('\n')}</div>
        <label>② 請輸入小狼姓名「${esc(r.cubName)}」確認</label><input type="text" id="cn" autocomplete="off">
        <button class="btn danger" id="ex">③ 確定執行${mode === 'delete' ? '完全刪除' : '匿名化'}</button>`;
      $('#ex').onclick = (e2) => {
        if (!confirm('最後確認：執行後無法復原，確定嗎？')) return;
        act(e2.currentTarget, async () => {
          await api('privacyExecute', { cubId, mode, confirmName: $('#cn').value.trim() });
          $('#out').innerHTML = `<div class="msg ok">已完成。</div><div class="msg warn">提醒：既有的每週備份檔仍含這位小狼的資料，會在保留份數輪替後自動消失。</div>
            <button class="btn ghost" id="pg">立即刪除所有舊備份並重新備份</button>`;
          $('#pg').onclick = (e3) => { if (confirm('刪除所有舊備份並重新備份一份？')) act(e3.currentTarget, async () => { const b = await api('backupPurge'); toast(b.message); }); };
        });
      };
    });
  },

  async backup() {
    const h = await api('adminHome');
    const b = h.alerts.backup, p = h.alerts.permission;
    $app.innerHTML = `${backBtn()}<section class="card"><h2>💾 備份</h2>
      ${h.alerts.backupFolderSet ? '' : '<div class="msg warn small">尚未設定備份資料夾（見 SETUP.md 第 7 步）。</div>'}
      <p>上次備份：${b ? fmtTime(b.at) + '<br>' + esc(b.message) : '還沒有紀錄'}</p>
      <button class="btn" id="bk">立即備份</button><button class="btn danger" id="pg">刪除所有舊備份並重新備份</button></section>
      <section class="card"><h2>🛡️ 試算表權限</h2>
      <p>${p ? (p.ok ? '✅ 權限正常' : '🚨 ' + esc(p.issues.join('；'))) + '<br><span class="s">檢查時間 ' + fmtTime(p.at) + '</span>' : '還沒有檢查過'}</p>
      <button class="btn ghost" id="pc">檢查試算表權限</button></section>`;
    wireBack();
    $('#bk').onclick = (ev) => act(ev.currentTarget, async () => { const r = await api('backupNow'); toast(r.message); goAdmin('backup'); });
    $('#pg').onclick = (ev) => { if (confirm('刪除備份資料夾裡所有舊備份，再重新備份一份？')) act(ev.currentTarget, async () => { const r = await api('backupPurge'); toast(r.message); goAdmin('backup'); }); };
    $('#pc').onclick = (ev) => act(ev.currentTarget, async () => { await api('permCheck'); goAdmin('backup'); });
  },

  async line() {
    const me = await api('me');
    $app.innerHTML = `${backBtn()}<section class="card"><h2>💬 連結 LINE 通知</h2>
      <p>${me.lineLinked ? '✅ 你已連結 LINE 通知。小狼達標時會在 LINE 通知你。' : '連結後，小狼達標時官方帳號會在 LINE 通知你。'}</p>
      <button class="btn alt" id="go">${me.lineLinked ? '重新連結' : '取得配對碼'}</button><div id="out"></div>
      ${me.lineLinked ? '<button class="btn danger" id="un">解除連結</button>' : ''}</section>`;
    wireBack();
    $('#go').onclick = (ev) => act(ev.currentTarget, async () => {
      const r = await api('lineLinkStart');
      $('#out').innerHTML = `<div class="codebox">${esc(r.code)}</div><ol class="small"><li>用手機 LINE 加入「22團幼童軍進程系統」官方帳號好友（已加過就略過）</li><li>在聊天室輸入上面這 6 位數字並送出</li><li>收到「已連結」的回覆就完成了</li></ol><p class="muted small">配對碼 ${r.expiresInMin} 分鐘內有效，只能用一次。</p>`;
    });
    const un = $('#un');
    if (un) un.onclick = (ev) => { if (confirm('解除後就不會收到 LINE 通知了，確定嗎？')) act(ev.currentTarget, async () => { await api('lineUnlink'); goAdmin('line'); }); };
  },
};

start();
</script>
</body>
</html>
