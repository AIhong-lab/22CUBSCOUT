<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4e9c">
<title>22團幼童軍冒險</title>
<!--
  幼童軍進程與技能章查詢系統：前端（查詢端與後台同一頁，依身分顯示）
  ⚠️ 本 repo 為公開：這個檔案只能放 GAS 網址，其他任何設定值、金鑰都不可以出現在這裡。
  設計：叢林闖關冒險風（SPEC 附錄第 19 點）。不使用外部圖片，圖示用表情符號與 CSS。
-->
<style>
  :root {
    --blue: #1f4e9c; --blue-dark: #163a75; --blue-soft: #e6eefc; --sky: #dff0ff;
    --yellow: #ffc928; --yellow-dark: #e0a800; --yellow-soft: #fff4cc;
    --green: #2e9d57; --green-dark: #1d7a3a; --green-soft: #e2f6e9;
    --gray: #6b7385; --gray-soft: #eef0f4; --gray-line: #dfe4ee;
    --red: #c62828; --red-soft: #fde7e7;
    --bg: #fffaf0; --card: #ffffff; --text: #1d2433;
    --radius: 22px; --shadow: 0 4px 0 rgba(31, 78, 156, .12), 0 8px 20px rgba(31, 78, 156, .08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    background-image: radial-gradient(circle at 10% 0%, #fff1c2 0, transparent 40%), radial-gradient(circle at 100% 30%, #e3f4e8 0, transparent 35%);
    background-attachment: fixed;
    font: 18px/1.65 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--blue); }

  /* ───── 頂部 ───── */
  header.top { position: sticky; top: 0; z-index: 20; color: #fff; background: linear-gradient(135deg, var(--blue) 0%, #2d6bc4 100%); box-shadow: 0 3px 0 var(--yellow); }
  header.top .row { display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; padding: 12px 16px; }
  header.top h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 900; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top select { max-width: 48%; font-size: 16px; padding: 8px 10px; border-radius: 999px; border: 0; background: #fff; color: var(--text); font-weight: 700; }
  .chip-btn { background: var(--yellow); color: var(--text); border: 0; border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 0 var(--yellow-dark); white-space: nowrap; }

  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow); border: 2px solid #f2ead8; }
  .card h2 { margin: 0 0 12px; font-size: 21px; font-weight: 900; color: var(--blue-dark); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 { margin: 14px 0 6px; font-size: 18px; font-weight: 900; }
  .muted { color: var(--gray); font-size: 16px; }
  .small { font-size: 15px; }
  .s { font-size: 15px; color: var(--gray); font-weight: 400; }
  .center { text-align: center; }
  .row-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }

  /* ───── 表單與按鈕 ───── */
  label { display: block; margin: 14px 0 6px; font-weight: 800; }
  input[type=text], input[type=password], input[type=date], input[type=number], input[type=search], select.full, textarea {
    width: 100%; font-size: 18px; padding: 13px 15px; border: 3px solid var(--gray-line); border-radius: 16px; background: #fff;
  }
  textarea { min-height: 120px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px var(--yellow-soft); }
  .check { display: flex; gap: 12px; align-items: flex-start; font-weight: 800; margin: 12px 0; cursor: pointer; }
  .check input { width: 26px; height: 26px; margin-top: 2px; flex: none; accent-color: var(--blue); }
  .btn { display: block; width: 100%; min-height: 54px; font-size: 19px; font-weight: 900; padding: 12px 18px; border: 0; border-radius: 18px; background: var(--blue); color: #fff; cursor: pointer; margin-top: 14px; box-shadow: 0 4px 0 var(--blue-dark); transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
  .btn.alt { background: var(--yellow); color: var(--text); box-shadow: 0 4px 0 var(--yellow-dark); }
  .btn.green { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
  .btn.ghost { background: #fff; color: var(--blue); border: 3px solid var(--blue); box-shadow: none; }
  .btn.danger { background: var(--red-soft); color: var(--red); box-shadow: 0 4px 0 #f3b8b8; }
  .btn.small { display: inline-block; width: auto; min-height: 42px; font-size: 16px; padding: 8px 14px; margin-top: 8px; border-radius: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--blue); text-decoration: underline; padding: 8px 0; font-size: 17px; cursor: pointer; font-weight: 700; }
  .msg { padding: 12px 15px; border-radius: 16px; margin-top: 12px; white-space: pre-wrap; font-weight: 700; }
  .msg.err { background: var(--red-soft); color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green-dark); }
  .msg.info { background: var(--blue-soft); color: var(--blue-dark); }
  .msg.warn { background: var(--yellow-soft); color: #7a5a00; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .chip { border: 3px solid var(--gray-line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pill { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 14px; font-weight: 900; white-space: nowrap; }
  .st-已頒發 { background: #fff1b8; color: #8a6100; }
  .st-已完成待頒發 { background: var(--blue-soft); color: var(--blue-dark); }
  .st-進行中 { background: var(--green-soft); color: var(--green-dark); }
  .st-未開始 { background: var(--gray-soft); color: var(--gray); }
  .bar { height: 14px; background: var(--gray-soft); border-radius: 999px; overflow: hidden; margin-top: 8px; border: 2px solid #fff; box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
  .bar > span { display: block; height: 100%; background: repeating-linear-gradient(45deg, var(--green) 0 12px, #39b169 12px 24px); border-radius: 999px; transition: width .6s; }
  .bar.full > span { background: repeating-linear-gradient(45deg, var(--yellow) 0 12px, #ffd85c 12px 24px); }
  .consent { background: var(--bg); border-radius: 16px; padding: 14px; max-height: 50vh; overflow: auto; white-space: pre-wrap; font-size: 16px; border: 2px solid var(--gray-line); }
  details > summary.fold { cursor: pointer; font-weight: 900; color: var(--blue); padding: 6px 0; }
  details.sub { margin-top: 6px; font-size: 15px; }
  details.sub > summary { cursor: pointer; color: var(--blue); font-weight: 700; }
  details.sub .g { margin: 6px 0 2px; font-weight: 900; }
  details.sub ul { margin: 2px 0 4px; padding-left: 1.4em; list-style: disc; }
  details.sub li { display: list-item; padding: 2px 0; border: 0; min-height: 0; font-size: 15px; }
  details.sub .std { color: var(--gray); margin: 0 0 4px; }

  /* ───── 登入頁 ───── */
  .welcome { text-align: center; padding: 26px 18px 18px; background: linear-gradient(180deg, var(--sky), #fff); }
  .welcome .mascot { font-size: 74px; line-height: 1; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .welcome h2 { justify-content: center; font-size: 25px; margin: 10px 0 4px; }
  .welcome.compact { padding: 14px 16px; }
  .welcome.compact .mascot { font-size: 44px; }
  .welcome.compact h2 { font-size: 21px; margin: 4px 0 0; }
  .tip { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--green-soft); color: var(--green-dark); font-weight: 700; font-size: 15px; }

  /* ───── 冒險家卡片 ───── */
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, #2d6bc4, var(--blue)); color: #fff; border: 0; }
  .hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .hero .top { display: flex; gap: 16px; align-items: center; position: relative; z-index: 1; }
  .avatar { width: 88px; height: 88px; flex: none; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 52px; border: 5px solid var(--yellow); box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hero .name { font-size: 26px; font-weight: 900; line-height: 1.2; }
  .hero .sub { opacity: .92; font-size: 16px; }
  .levelchip { display: inline-block; margin-top: 6px; background: var(--yellow); color: var(--text); font-weight: 900; border-radius: 999px; padding: 2px 12px; font-size: 15px; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
  .stats3 div { background: rgba(255,255,255,.14); border-radius: 16px; padding: 8px 4px; text-align: center; font-size: 14px; }
  .stats3 b { display: block; font-size: 22px; line-height: 1.3; }

  .mission { display: flex; gap: 12px; align-items: flex-start; padding: 12px; margin-top: 10px; border-radius: 16px; background: var(--yellow-soft); border: 2px dashed var(--yellow-dark); }
  .mission .no { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; font-weight: 900; }
  .mission .txt { font-weight: 700; }
  .congrats { font-size: 20px; font-weight: 900; color: var(--blue-dark); margin: 0; white-space: pre-wrap; }
  .banner { background: linear-gradient(90deg, var(--yellow-soft), #fff); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid var(--yellow); }

  /* 可展開卡片 */
  .unit { border: 3px solid var(--gray-line); border-radius: 18px; margin-top: 12px; overflow: hidden; background: #fff; }
  .unit > summary { list-style: none; cursor: pointer; padding: 14px; display: block; }
  .unit > summary::-webkit-details-marker { display: none; }
  .unit .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .unit .name { font-size: 20px; font-weight: 900; }
  .unit .body { padding: 2px 14px 14px; border-top: 2px dashed var(--gray-line); }
  .unit .more { color: var(--blue); font-size: 15px; margin-top: 6px; font-weight: 700; }
  .unit[open] .more { display: none; }
  .unit.bd-已頒發 { border-color: #ffd85c; }
  .unit.bd-已完成待頒發 { border-color: #9fbcec; }

  ul.items { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.items li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 2px solid var(--gray-soft); align-items: flex-start; }
  ul.items li:last-child { border-bottom: 0; }
  ul.items .mark { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; margin-top: 1px; }
  ul.items .done .mark { background: var(--yellow); box-shadow: 0 2px 0 var(--yellow-dark); }
  ul.items .todo .mark { background: var(--gray-soft); color: var(--gray); border: 2px dashed #c7cdd9; }
  ul.items .when { display: block; color: var(--gray); font-size: 15px; }
  ul.items .done .when { color: var(--green-dark); font-weight: 700; }
  .section-title { margin: 14px 0 0; font-weight: 900; color: var(--blue-dark); display: inline-block; background: var(--blue-soft); padding: 2px 12px; border-radius: 999px; font-size: 16px; }

  /* ───── 闖關地圖 ───── */
  .map { padding: 6px 0 4px; }
  .stage { position: relative; display: flex; align-items: center; gap: 14px; margin: 0 0 34px; cursor: pointer; }
  .stage:nth-child(even) { flex-direction: row-reverse; text-align: right; }
  .stage:not(:last-child)::after { content: ''; position: absolute; top: 96px; left: 52px; width: calc(100% - 104px); height: 36px; border-bottom: 5px dashed #c9d8c2; border-left: 5px dashed #c9d8c2; border-radius: 0 0 0 30px; }
  .stage:nth-child(even):not(:last-child)::after { border-left: 0; border-right: 5px dashed #c9d8c2; border-radius: 0 0 30px 0; }
  .node { position: relative; width: 104px; height: 104px; flex: none; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--green) calc(var(--p) * 1%), #e6ebe3 0); padding: 8px; transition: transform .15s; }
  .node .in { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 46px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.06); }
  .stage.locked .node .in { filter: grayscale(1); opacity: .45; }
  .stage.locked .node::before { content: '🔒'; position: absolute; right: -2px; bottom: -2px; font-size: 26px; z-index: 1; }
  .stage.active .node { animation: pulse 1.8s ease-in-out infinite; }
  .stage.pending .node { background: conic-gradient(var(--blue) 100%, #fff 0); }
  .stage.done .node { background: conic-gradient(var(--yellow) 100%, #fff 0); }
  .stage.done .node::before { content: '🏅'; position: absolute; right: -4px; bottom: -4px; font-size: 32px; z-index: 1; }
  .stage.sel .node { transform: scale(1.08); box-shadow: 0 0 0 5px var(--yellow-soft); }
  .stage .lv { font-size: 22px; font-weight: 900; }
  .stage .st { font-size: 15px; font-weight: 800; }
  .stage .cnt { font-size: 15px; color: var(--gray); }
  .stage.open .node { background: conic-gradient(var(--yellow) 100%, #fff 0); }
  .badge.open .disc { background: conic-gradient(var(--blue) 100%, #fff 0); }
  .hit { padding: 10px 0; border-bottom: 2px solid var(--gray-soft); cursor: pointer; }
  .hit mark { background: var(--yellow-soft); color: inherit; border-radius: 4px; padding: 0 2px; }
  .finish { text-align: center; font-size: 15px; font-weight: 800; color: var(--green-dark); }

  /* ───── 徽章收藏冊 ───── */
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; }
  .badge { border: 0; background: none; cursor: pointer; text-align: center; padding: 0; }
  .badge .disc { position: relative; width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; padding: 6px; background: conic-gradient(var(--green) calc(var(--p) * 1%), #e8ecf3 0); }
  .badge .disc .in { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 36px; }
  .badge.got .disc { background: conic-gradient(var(--yellow) 100%, #fff 0); box-shadow: 0 0 0 3px #fff3c2, 0 4px 0 var(--yellow-dark); }
  .badge.got .disc .in { background: radial-gradient(circle at 35% 30%, #fffbe6, #ffe37a); }
  .badge.got .disc::after { content: '✓'; position: absolute; right: -2px; top: -2px; width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 900; font-size: 16px; display: grid; place-items: center; }
  .badge.none .disc .in { filter: grayscale(1); opacity: .4; }
  .badge.pending .disc { background: conic-gradient(var(--blue) 100%, #fff 0); }
  .badge .nm { font-weight: 900; font-size: 15px; margin-top: 6px; line-height: 1.3; }
  .badge .pc { font-size: 13px; color: var(--gray); }

  /* ───── 集點卡 ───── */
  .ring { width: 160px; height: 160px; margin: 6px auto 10px; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 1%), #e8ecf3 0); display: grid; place-items: center; padding: 14px; }
  .ring .in { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; }
  .ring b { font-size: 36px; color: var(--green-dark); line-height: 1; }
  .stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px; }
  .stamp { text-align: center; font-size: 13px; color: var(--gray); }
  .stamp .sp { width: 62px; height: 62px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; border: 3px dashed #d5dbe6; background: #fff; }
  .stamp.出席 .sp { border: 3px solid var(--green); background: var(--green-soft); transform: rotate(-8deg); }
  .stamp.請假 .sp { border: 3px solid #b39ddb; background: #f3eefc; }
  .counts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .counts span { background: var(--gray-soft); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 15px; }

  /* ───── 底部分頁 ───── */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 3px solid var(--yellow); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 20; box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
  nav.tabs[hidden] { display: none; } /* 上面的 display:flex 會蓋過 hidden 屬性，需明確隱藏 */
  nav.tabs .inner { display: flex; width: 100%; max-width: 760px; }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 7px 2px 9px; font-size: 13px; font-weight: 800; color: var(--gray); cursor: pointer; }
  nav.tabs button .ic { display: block; font-size: 25px; line-height: 1.25; transition: transform .15s; }
  nav.tabs button.on { color: var(--blue); }
  nav.tabs button.on .ic { transform: translateY(-3px) scale(1.18); }

  /* ───── 彈出視窗、提示 ───── */
  .sheet-bg { position: fixed; inset: 0; background: rgba(20, 30, 50, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 760px; max-height: 86vh; overflow: auto; border-radius: 26px 26px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
  .sheet .grab { width: 54px; height: 6px; background: var(--gray-line); border-radius: 3px; margin: 0 auto 12px; }
  .sheet h2 { margin: 0 0 10px; font-size: 21px; color: var(--blue-dark); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 800; z-index: 50; max-width: 90vw; text-align: center; animation: pop .2s ease-out; }
  .loading { text-align: center; padding: 60px 0; color: var(--gray); font-weight: 700; }
  .loading .paw { font-size: 44px; display: inline-block; animation: bob 1s ease-in-out infinite; }
  .confetti { position: fixed; top: -20px; font-size: 22px; z-index: 60; pointer-events: none; animation: fall linear forwards; }

  /* ───── 後台 ───── */
  .list-row { display: flex; gap: 10px; align-items: center; padding: 12px 4px; border-bottom: 2px solid var(--gray-soft); }
  .list-row:last-child { border-bottom: 0; }
  .list-row.tap { cursor: pointer; }
  .list-row .t { font-weight: 900; }
  .roll-btn { min-width: 96px; min-height: 50px; border-radius: 14px; border: 3px solid var(--gray-line); background: #fff; font-weight: 900; font-size: 17px; cursor: pointer; }
  .roll-btn.出席 { background: var(--green); border-color: var(--green); color: #fff; }
  .roll-btn.請假 { background: #ede7f6; border-color: #b39ddb; color: #4a2c8a; }
  .roll-btn.changed { box-shadow: 0 0 0 4px var(--yellow); }
  .savebar { position: sticky; bottom: 84px; z-index: 5; background: #fff; border-radius: 18px; padding: 8px 12px 12px; box-shadow: 0 -2px 16px rgba(0,0,0,.12); margin-top: 12px; }
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .menu-grid button { border: 3px solid var(--gray-line); background: #fff; border-radius: 18px; padding: 14px 8px; font-weight: 900; font-size: 16px; cursor: pointer; }
  .menu-grid button .ic { display: block; font-size: 30px; }
  .alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 14px; margin-top: 8px; font-weight: 700; }
  .alert.red { background: var(--red-soft); color: var(--red); }
  .alert.yellow { background: var(--yellow-soft); color: #7a5a00; }
  .alert.green { background: var(--green-soft); color: var(--green-dark); }
  .tbl-wrap { overflow-x: auto; margin: 8px -6px 0; }
  table.tbl { border-collapse: collapse; font-size: 15px; min-width: 100%; }
  table.tbl th, table.tbl td { padding: 7px 8px; border-bottom: 2px solid var(--gray-soft); white-space: nowrap; text-align: center; }
  table.tbl th:first-child, table.tbl td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
  .codebox { font-family: ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 900; letter-spacing: 4px; background: var(--yellow-soft); border: 3px dashed var(--yellow-dark); border-radius: 16px; padding: 8px 14px; text-align: center; margin-top: 10px; }
  .back { background: none; border: 0; color: var(--blue); font-weight: 900; font-size: 17px; padding: 4px 0 10px; cursor: pointer; }
  pre.copytext { white-space: pre-wrap; background: var(--gray-soft); border-radius: 14px; padding: 12px; font-size: 15px; font-family: inherit; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: translateX(-50%) scale(.8); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<header class="top"><div class="row"><h1 id="title">🐾 22團幼童軍冒險</h1><span id="headerRight" class="row-flex"></span></div></header>
<main id="app"><div class="loading"><div class="paw">🐾</div><br>載入中……</div></main>
<nav class="tabs" id="tabs" hidden><div class="inner"></div></nav>
<div id="print"></div>

<script>
'use strict';
// ───── 唯一的設定值：後端（Google Apps Script）網址。不得放其他任何設定或金鑰。 ─────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxTq1Gkr2bWq9M9AkJFkrSI7aW_ivJMQEjtyY9nH06qOmW3VBzcTh9uulduGlkGa4l3NQ/exec';

// ═════════════ 小工具 ═════════════
const $app = document.getElementById('app');
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (d) => (d ? String(d).replace(/^(\d{4})-(\d{2})-(\d{2})$/, (m, y, mo, da) => `${y}/${+mo}/${+da}`) : '');
const shortDate = (d) => (d ? String(d).replace(/^\d{4}-(\d{2})-(\d{2})$/, (m, mo, da) => `${+mo}/${+da}`) : '');
const fmtTime = (ms) => (ms ? new Date(ms).toLocaleString('zh-TW', { hour12: false }) : '－');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const LEVELS = ['羚羊', '狼', '鹿', '豹'];
const LEVEL_ICON = { '羚羊': '🐐', '狼': '🐺', '鹿': '🦌', '豹': '🐆' };
const BADGE_ICON = { 嚮導: '🧭', 環保: '♻️', 交通安全: '🚦', 表演: '🎭', 種植: '🌱', 飼養: '🐹', 勞作: '🔨', 義工: '🤝', 球類運動: '⚽', 體適能運動: '💪', 民俗體育運動: '🪀', 游泳: '🏊', 自行車: '🚲', 旅行: '🎒', 休閒活動: '🎲', 舞蹈: '💃', 體操: '🤸', 繪畫: '🎨', 音樂: '🎵', 模型: '🏠', 口技: '🗣️', 書法: '🖌️', 歌詠: '🎤', 收集: '📦', 資訊: '💻', 語文: '📖' };
const iconOf = (u) => (u.category === '進程' ? LEVEL_ICON[u.unit] : BADGE_ICON[u.unit]) || '🎖️';
const unitLabel = (u) => (u.category === '進程' ? u.unit + '級' : u.unit);
const STATUS_ORDER = { '已完成待頒發': 0, '進行中': 1, '已頒發': 2, '未開始': 3 };
const webRoot = () => location.origin + location.pathname.replace(/web\/?[^/]*$/, '');

// 瀏覽器儲存：無痕模式等可能失敗，失敗時不讓頁面壞掉
const store = {
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, persist) { try { (persist ? localStorage : sessionStorage).setItem(k, v); (persist ? sessionStorage : localStorage).removeItem(k); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} },
};

const state = { me: null, cubId: null, detail: null, view: 'home', mode: 'parent', admin: { tab: 'home', page: null }, returnTo: null, mapSel: null };

class ApiErr extends Error { constructor(code, message) { super(message); this.code = code; } }

/** 呼叫後端：text/plain + JSON，避免 CORS 預檢 */
async function api(action, data) {
  if (!GAS_URL) throw new ApiErr('NO_URL', '網站尚未設定後端網址，請聯絡團長。');
  let res;
  try {
    res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token: store.get('token') || undefined }, data || {})) });
  } catch (e) { throw new ApiErr('NETWORK', '連線失敗，請確認網路後再試一次。'); }
  let json;
  try { json = await res.json(); } catch (e) { throw new ApiErr('NETWORK', '系統暫時無法使用，請稍後再試。'); }
  if (!json.ok) {
    if (json.code === 'SESSION_EXPIRED') { onExpired(); throw new ApiErr('SESSION_EXPIRED', json.message); }
    throw new ApiErr(json.code, json.message);
  }
  return json;
}

/** 登入過期：清除憑證、回登入畫面，登入後回到原本的畫面 */
function onExpired() {
  const hadLogin = !!state.me;
  store.del('token');
  state.returnTo = hadLogin ? { view: state.view, cubId: state.cubId, mode: state.mode, admin: Object.assign({}, state.admin) } : null;
  state.me = null;
  renderLogin({ notice: hadLogin ? '登入已過期，請重新登入。登入後會回到剛才的畫面。' : '' });
}

function loading(text) { $app.innerHTML = `<div class="loading"><div class="paw">🐾</div><br>${esc(text || '載入中……')}</div>`; }
function msg(el, text, kind) { if (el) el.innerHTML = text ? `<div class="msg ${kind || 'err'}">${esc(text)}</div>` : ''; }
/** 有未儲存資料的頁面設定這個函式；回傳 false 表示使用者選擇留下 */
let leaveGuard = null;
const canLeave = () => !leaveGuard || leaveGuard();
window.addEventListener('beforeunload', (e) => { if (leaveGuard && leaveGuard.dirty && leaveGuard.dirty()) { e.preventDefault(); e.returnValue = ''; } });

function setTabs(list, cur, onPick) {
  const nav = document.getElementById('tabs');
  if (!list) { nav.hidden = true; return; }
  nav.querySelector('.inner').innerHTML = list.map(([k, ic, t]) => `<button data-v="${k}" class="${cur === k ? 'on' : ''}"><span class="ic">${ic}</span>${t}</button>`).join('');
  $$('button', nav).forEach((b) => { b.onclick = () => { if (canLeave()) onPick(b.dataset.v); }; });
  nav.hidden = false;
}
function setHeader(html) { document.getElementById('headerRight').innerHTML = html || ''; }
function scrollTop() { window.scrollTo(0, 0); }
function toast(text) {
  $$('.toast').forEach((x) => x.remove()); // 只保留最新的一個
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const set = ['⭐', '🎉', '✨', '🏅', '🐾', '🌟'];
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('div');
    c.className = 'confetti'; c.textContent = set[i % set.length];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = 1.1 + Math.random() * 0.8 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('已複製，可以貼到 LINE 了'); }
  catch (e) { prompt('請長按複製以下文字：', text); }
}
/** 表單送出：停用按鈕、顯示錯誤訊息 */
function bindForm(form, handler) {
  if (!form) return;
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    const out = form.querySelector('.out');
    if (btn) btn.disabled = true;
    msg(out, '');
    try { await handler(new FormData(form), out); }
    catch (e) { if (e.code !== 'SESSION_EXPIRED') { if (out) msg(out, e.message); else alert(e.message); } }
    finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
  });
}
/** 按鈕點擊包裝：執行中停用、錯誤用 alert 顯示 */
async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { if (e.code !== 'SESSION_EXPIRED') alert(e.message); }
  finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
}
/** 需要確認的後台操作：後端回 needConfirm 時詢問，確認後帶 confirm 重送 */
async function withConfirm(action, data) {
  let r = await api(action, data);
  if (r.needConfirm) {
    if (!confirm('請再確認一次：\n\n' + (r.warnings || []).join('\n') + '\n\n確定要繼續嗎？')) return null;
    r = await api(action, Object.assign({}, data, { confirm: true }));
  }
  return r;
}
function openSheet(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div>${html}<button class="btn ghost" data-close>關閉</button></div>`;
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
  document.body.appendChild(bg);
  if (onMount) onMount(bg.querySelector('.sheet'), close);
  return close;
}

/** 註冊第 1 步：代碼與小孩姓名 */

/** 註冊第 2 步：帳號密碼 */
function renderRegister2(ctx) {
  scrollTop();
  const isAdmin = ctx.kind === 'admin';
  $app.innerHTML = `
    <section class="card">
      <h2>🎒 註冊 2／${isAdmin ? 2 : 3}：設定帳號</h2>
      ${isAdmin ? '<div class="msg ok">這是管理員邀請碼，註冊後就能進入後台。</div>' : `<div class="msg ok">代碼正確！孩子：${esc(ctx.childName)}</div>`}
      <form id="f">
        <label for="u">帳號（4～20 個英文字母、數字或底線）</label>
        <p class="muted small" style="margin-top:-2px">建議用好記的英文，例如孩子英文名＋稱呼：<b>xiaoming_mom</b>、<b>amy_dad</b>。英文大小寫都可以。</p>
        <input id="u" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(ctx.username || '')}" required>
        <label for="p">密碼（至少 8 個字）</label><input id="p" name="password" type="password" autocomplete="new-password" required>
        <label for="p2">再輸入一次密碼</label><input id="p2" name="password2" type="password" autocomplete="new-password" required>
        <label for="nk">${isAdmin ? '你的稱呼' : '你的稱呼（孩子姓名＋稱呼，例如「王小明媽媽」）'}</label>
        <input id="nk" name="nickname" type="text" value="${esc(ctx.nickname || '')}" placeholder="${isAdmin ? '例如：陳服務員' : esc('例如：' + ctx.childName + '媽媽')}" required>
        <label class="check"><input type="checkbox" name="remember" checked> 記住我（這台裝置下次不用再登入）</label>
        <button class="btn" type="submit">${isAdmin ? '完成註冊' : '下一步：閱讀個資說明'}</button>
        <div class="out"></div>
      </form>
      <button class="linkbtn" id="back">← 上一步</button>
    </section>`;
  $('#back').onclick = () => renderRegister1(ctx);
  bindForm($('#f'), async (fd, out) => {
    if (fd.get('password') !== fd.get('password2')) return msg(out, '兩次輸入的密碼不一樣。');
    if (!/^[A-Za-z0-9_]{4,20}$/.test(fd.get('username').trim())) return msg(out, '帳號需為 4～20 個英文字母、數字或底線。');
    if (fd.get('password').length < 8) return msg(out, '密碼至少 8 個字。');
    const next = Object.assign({}, ctx, { username: fd.get('username').trim(), password: fd.get('password'), nickname: fd.get('nickname').trim(), remember: !!fd.get('remember') });
    if (isAdmin) return doRegister(next);
    renderRegister3(next);
  });
}

/** 註冊第 3 步：個資告知同意（不同意就不建立任何資料） */
function renderRegister3(ctx) {
  scrollTop();

  bindForm($('#f'), async () => doRegister(ctx));
}

async function doRegister(ctx) {
  try {
    const r = await api('register', { code: ctx.code, childName: ctx.childName, username: ctx.username, password: ctx.password,
      nickname: ctx.nickname, remember: ctx.remember, consentVersion: ctx.consent ? ctx.consent.version : undefined });
    store.set('token', r.token, ctx.remember);
    confetti();
    await start();
  } catch (e) {
    if (e.code === 'NAME_TAKEN' || e.code === 'BAD_INPUT') { renderRegister2(ctx); msg($('.out'), e.message); return; }
    if (e.code === 'CODE_INVALID' || e.code === 'LOCKED') { renderRegister1(ctx); msg($('.out'), e.message); return; }
    throw e;
  }
}

// ═════════════ 主流程 ═════════════

async function start() {
  const h = location.hash;
  if (h === '#home' || h === '#catalog') return renderHome();
  if (h === '#progress' || h === '#badges') return renderCatalog(h.slice(1));
  if (!store.get('token')) return renderHome(); // 沒登入：先看附說明的首頁
  loading();
  try { state.me = await api('me'); }
  catch (e) {
    if (e.code === 'SESSION_EXPIRED') return;
    $app.innerHTML = `<section class="card"><div class="msg err">${esc(e.message)}</div><button class="btn" id="re">再試一次</button></section>`;
    $('#re').onclick = start;
    return;
  }
  if (state.me.needsConsent) return renderReconsent();
  const back = state.returnTo; state.returnTo = null;
  state.mode = back ? back.mode : (state.me.role ? 'admin' : 'parent'); // 管理員預設進後台
  if (!state.me.role) state.mode = 'parent';
  if (back && back.cubId) state.cubId = back.cubId;
  if (!state.cubId || !state.me.cubs.some((c) => c.cubId === state.cubId)) state.cubId = (state.me.cubs[0] || {}).cubId || null;
  state.view = back ? back.view : 'home';
  if (back && back.admin) state.admin = back.admin;
  route();
}

function route() { return state.mode === 'admin' ? renderAdmin() : renderParent(); }

async function logout() {
  try { await api('logout'); } catch (e) {}
  store.del('token');
  Object.assign(state, { me: null, detail: null, cubId: null, admin: { tab: 'home', page: null } });
  renderLogin({ notice: '已登出，下次見！' });
}

// ═════════════ 家長畫面：闖關冒險 ═════════════

const PARENT_TABS = [['home', '🏕️', '冒險'], ['progress', '🗺️', '闖關'], ['badges', '🎖️', '徽章'], ['attendance', '🐾', '集點'], ['mine', '👤', '我的']];

function renderParentHeader() {
  const me = state.me;
  let html = '';
  if (me.cubs.length > 1) html += `<select id="cubSel" aria-label="切換孩子">${me.cubs.map((c) => `<option value="${esc(c.cubId)}" ${c.cubId === state.cubId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  if (me.role) html += `<button class="chip-btn" id="toAdmin">後台</button>`;
  setHeader(html);
  const sel = $('#cubSel');
  if (sel) sel.onchange = () => { state.cubId = sel.value; state.detail = null; state.mapSel = null; renderParent(); };
  const ta = $('#toAdmin');
  if (ta) ta.onclick = () => { state.mode = 'admin'; route(); };
}

/** keep=true 時沿用已載入的資料（切換分頁不重新呼叫後端） */
async function renderParent(keep) {
  document.getElementById('title').textContent = '🐾 22團幼童軍冒險';
  renderParentHeader();
  setTabs(PARENT_TABS, state.view, (v) => { state.view = v; renderParent(true); });
  scrollTop();
  if (state.view === 'mine') return renderMine();
  if (!state.cubId) return renderNoCub();
  if (!keep || !state.detail || state.detail.cub.cubId !== state.cubId) {
    loading('正在打開冒險地圖……');
    try { state.detail = await api('cubDetail', { cubId: state.cubId }); }
    catch (e) {
      if (e.code === 'SESSION_EXPIRED') return;
      if (e.code === 'NEED_CONSENT') return renderReconsent();
      $app.innerHTML = `<section class="card"><div class="msg err">${esc(e.message)}</div><button class="btn" id="re">再試一次</button></section>`;
      $('#re').onclick = () => renderParent();
      return;
    }
  }
  ({ home: viewHome, progress: viewMap, badges: viewBadges, attendance: viewStamps })[state.view](state.detail);
}

function renderNoCub() {
  $app.innerHTML = `
    <section class="card welcome"><div class="mascot">🧒</div><h2>還沒有綁定孩子</h2>
      <p class="muted">到「我的」頁面輸入團長給的綁定碼，就能看到孩子的冒險紀錄。</p>
      <button class="btn alt" id="go">前往新增綁定</button></section>`;
  $('#go').onclick = () => { state.view = 'mine'; renderParent(true); };
}

/** 進程細項（團自訂，只顯示不勾選）：收合在項目下面，點開才看到 */
function detailsHtml(it) {
  const gs = it.details || [];
  if (!gs.length) return '';
  const n = gs.reduce((a, g) => a + g.subs.length, 0);
  const many = gs.length > 1;
  return `<details class="sub" onclick="event.stopPropagation()"><summary>📋 本團細項 ${n} 條</summary>${gs.map((g) => `
    ${many && g.group ? `<div class="g">${esc(g.group)}</div>` : ''}<ul>${g.subs.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
    ${g.standard ? `<p class="std">✅ 通過標準：${esc(g.standard)}</p>` : ''}${g.life ? `<p class="std">🏠 生活應用：${esc(g.life)}</p>` : ''}`).join('')}</details>`;
}

/** 單一級別或技能章的任務清單（依大項分組） */
function itemsHtml(u) {
  const sections = [];
  u.items.forEach((it) => {
    let s = sections.find((x) => x.name === it.section);
    if (!s) sections.push((s = { name: it.section, items: [] }));
    s.items.push(it);
  });
  const showSec = sections.length > 1 || (sections[0] && sections[0].name !== '－');
  return sections.map((s) => `
    ${showSec ? `<div class="section-title">${esc(s.name)}</div>` : ''}
    <ul class="items">${s.items.map((it) => `
      <li class="${it.done ? 'done' : 'todo'}"><span class="mark">${it.done ? '⭐' : ''}</span>
        <span>${esc(it.text)}<span class="when">${it.done ? `完成！${fmtDate(it.date)}${it.auto ? '（出席自動完成）' : ''}` : '待挑戰'}</span>${detailsHtml(it)}</span></li>`).join('')}
    </ul>`).join('');
}

function statusLabel(u) {
  return u.status === '已頒發' ? '🏅 已拿到' : u.status === '已完成待頒發' ? '⏳ 等待頒發' : u.status === '進行中' ? '🔥 挑戰中' : '🔒 未開始';
}

/** 可展開的卡片（首頁用） */
function unitCard(u) {
  const pct = u.total ? Math.round((u.done / u.total) * 100) : 0;
  const sub = u.status === '已頒發'
    ? `<div class="muted">🏅 ${fmtDate(u.awardDate)} 頒發${u.awardOccasion ? `・${esc(u.awardOccasion)}` : ''}</div>`
    : `<div class="muted">⭐ ${u.done}／${u.total}</div><div class="bar ${pct === 100 ? 'full' : ''}"><span style="width:${pct}%"></span></div>`;
  return `
    <details class="unit bd-${esc(u.status)}">
      <summary>
        <div class="head"><span class="name">${iconOf(u)} ${esc(unitLabel(u))}</span><span class="pill st-${esc(u.status)}">${statusLabel(u)}</span></div>
        ${sub}
        ${u.status === '已完成待頒發' ? `<div class="msg info small">${esc(u.statusText)}</div>` : ''}
        ${u.desc ? `<div class="small" style="margin-top:6px">${esc(u.desc)}</div>` : ''}
        <div class="more">看看有哪些任務 ▾</div>
      </summary>
      <div class="body">${itemsHtml(u)}</div>
    </details>`;
}

function viewHome(d) {
  const c = d.cub, n = d.nextChallenge;
  const stars = d.units.reduce((s, u) => s + u.done, 0);
  const got = d.units.filter((u) => u.status === '已頒發').sort((a, b) => (a.awardDate < b.awardDate ? 1 : -1));
  const challenging = d.units.filter((u) => u.status === '進行中' || u.status === '已完成待頒發')
    .sort((a, b) => (a.category === b.category ? STATUS_ORDER[a.status] - STATUS_ORDER[b.status] : a.category === '進程' ? -1 : 1));
  const notStarted = d.units.filter((u) => u.category === '技能章' && u.status === '未開始');
  const av = c.currentLevel ? LEVEL_ICON[c.currentLevel] : '🌱';
  let next;
  if (n.type === 'allDone') next = `<div class="banner"><p class="congrats">🎉 ${esc(n.message)}</p></div>`;
  else if (n.type === 'pending') next = `<div class="banner"><p class="congrats">${esc(n.message)}</p></div>`;
  else next = `${n.message ? `<div class="banner"><p class="congrats">🎉 ${esc(n.message)}</p></div>` : ''}
    <p class="muted">${esc(LEVEL_ICON[n.level] || '')} ${esc(n.level)}級的下一關任務：</p>
    ${n.items.map((i, k) => `<div class="mission"><span class="no">${k + 1}</span><span class="txt">${esc(i.text)}</span></div>`).join('')}
    <button class="btn ghost small" id="toMap" data-lv="${esc(n.level)}">🗺️ 看${esc(n.level)}級全部任務 →</button>`;
  $app.innerHTML = `
    <section class="card hero">
      <div class="top"><div class="avatar">${av}</div>
        <div class="grow"><div class="name">${esc(c.name)}</div>
          <div class="sub">${esc(c.squad || '')}${c.squad ? '・' : ''}入團 ${fmtDate(c.joinDate)}</div>
          <div class="sub">在團時間 ${esc(c.tenure)}</div>
          <span class="levelchip">${c.currentLevel ? '目前級別：' + esc(c.currentLevel) + '級' : '準備挑戰羚羊級'}</span></div></div>
      <div class="stats3"><div><b>⭐ ${stars}</b>收集的星星</div><div><b>🏅 ${got.length}</b>拿到的章</div><div><b>🐾 ${d.attendance.counts.attended}</b>出席次數</div></div>
    </section>
    <section class="card"><h2>🎯 下一步挑戰</h2>${next}</section>
    <section class="card"><h2>🔥 正在挑戰的</h2>
      ${challenging.length ? challenging.map(unitCard).join('') : '<p class="muted">目前沒有進行中的關卡。</p>'}</section>
    <section class="card"><h2>🏆 已經拿到的</h2>
      ${got.length ? got.map(unitCard).join('') : '<p class="muted">還沒有拿到章，一起加油！💪</p>'}</section>
    ${notStarted.length ? `<section class="card"><details><summary class="fold">🌱 還沒開始的技能章（${notStarted.length} 個）▾</summary>
      ${notStarted.map(unitCard).join('')}</details></section>` : ''}`;
  const tm = $('#toMap');
  if (tm) tm.onclick = () => { state.mapSel = tm.dataset.lv; state.view = 'progress'; renderParent(true); };
}

/** 闖關地圖：羚羊 → 狼 → 鹿 → 豹 */
function viewMap(d) {
  const units = LEVELS.map((l) => d.units.find((u) => u.category === '進程' && u.unit === l)).filter(Boolean);
  if (!state.mapSel) state.mapSel = (units.find((u) => u.status === '進行中' || u.status === '已完成待頒發') || units[units.length - 1]).unit;
  const cls = (u) => (u.status === '已頒發' ? 'done' : u.status === '已完成待頒發' ? 'pending' : u.status === '進行中' ? 'active' : 'locked');
  const sel = units.find((u) => u.unit === state.mapSel);
  $app.innerHTML = `
    <section class="card"><h2>🗺️ 闖關地圖</h2>
      <p class="muted small">點一個關卡，看看要完成哪些任務！</p>
      <div class="map">${units.map((u) => {
        const pct = u.total ? Math.round((u.done / u.total) * 100) : 0;
        return `<div class="stage ${cls(u)} ${u.unit === state.mapSel ? 'sel' : ''}" data-unit="${esc(u.unit)}" role="button" tabindex="0">
          <div class="node" style="--p:${pct}"><div class="in">${LEVEL_ICON[u.unit]}</div></div>
          <div><div class="lv">${esc(u.unit)}級</div><div class="st">${statusLabel(u)}</div>
            <div class="cnt">${u.status === '已頒發' ? fmtDate(u.awardDate) + ' 頒發' : '⭐ ' + u.done + '／' + u.total}</div></div></div>`;
      }).join('')}</div>
      <div class="finish">🏁 終點：完成豹級，成為全能小狼！</div>
    </section>
    ${sel ? `<section class="card" id="lvPanel"><h2>${LEVEL_ICON[sel.unit]} ${esc(sel.unit)}級任務 <span class="pill st-${esc(sel.status)}">${statusLabel(sel)}</span></h2>
      ${sel.status === '已完成待頒發' ? `<div class="msg info">${esc(sel.statusText)}</div>` : ''}
      ${sel.status === '已頒發' ? `<div class="msg ok">🏅 ${fmtDate(sel.awardDate)} 頒發${sel.awardOccasion ? '・' + esc(sel.awardOccasion) : ''}</div>` : ''}
      ${sel.rule ? `<p class="small"><b>晉級條件：</b>${esc(sel.rule)}</p>` : ''}
      ${sel.attendRequired ? `<p class="small">🐾 晉級出席要求：上一級頒發後已出席 ${sel.attendSinceLast}／${sel.attendRequired} 次</p>` : ''}
      <div class="bar ${sel.done === sel.total ? 'full' : ''}"><span style="width:${sel.total ? Math.round(sel.done / sel.total * 100) : 0}%"></span></div>
      ${itemsHtml(sel)}
      ${sel.status === '進行中' ? '<div class="tip">💡 完成任務後，記得在團集會時請團長或服務員幫你簽核，星星就會亮起來喔！</div>' : ''}
      <button class="btn ghost" id="printBtn">🖨️ 列印這一級的簽核單</button></section>` : ''}`;
  $$('.stage').forEach((s) => { s.onclick = () => { state.mapSel = s.dataset.unit; viewMap(d); const p = $('#lvPanel'); if (p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
  const pb = $('#printBtn');
  if (pb) pb.onclick = () => printSheets(sel.unit, [{ cub: d.cub, awardDate: sel.awardDate, items: sel.items }], sel.rule);
}

/** 徽章收藏冊 */
function viewBadges(d) {
  const groups = ['服務類', '健身類', '技巧類'];
  const badges = d.units.filter((u) => u.category === '技能章');
  const other = badges.filter((u) => !groups.includes(u.group));
  const total = badges.length, got = badges.filter((u) => u.status === '已頒發').length;
  const tile = (u) => {
    const pct = u.total ? Math.round((u.done / u.total) * 100) : 0;
    const cls = u.status === '已頒發' ? 'got' : u.status === '已完成待頒發' ? 'pending' : u.done ? 'part' : 'none';
    return `<button class="badge ${cls}" data-unit="${esc(u.unit)}"><div class="disc" style="--p:${pct}"><div class="in">${iconOf(u)}</div></div>
      <div class="nm">${esc(u.unit)}</div><div class="pc">${u.status === '已頒發' ? '已收藏' : u.status === '已完成待頒發' ? '等待頒發' : u.done + '／' + u.total}</div></button>`;
  };
  $app.innerHTML = `
    <section class="card center"><h2 style="justify-content:center">🎖️ 我的徽章收藏冊</h2>
      <div style="font-size:30px;font-weight:900;color:var(--blue-dark)">${got} <span class="muted">／ ${total}</span></div>
      <div class="bar ${got === total && total ? 'full' : ''}"><span style="width:${total ? Math.round(got / total * 100) : 0}%"></span></div>
      <p class="muted small">點徽章看看怎麼拿到它！</p></section>
    ${groups.concat(other.length ? ['其他'] : []).map((g) => {
      const list = g === '其他' ? other : badges.filter((u) => u.group === g);
      return `<section class="card"><h2>${g === '服務類' ? '🤝' : g === '健身類' ? '🏃' : g === '技巧類' ? '🎨' : '🎖️'} ${esc(g)} <span class="s">已收藏 ${list.filter((u) => u.status === '已頒發').length}／${list.length} 個</span></h2>
        <div class="badges">${list.map(tile).join('')}</div></section>`;
    }).join('')}`;
  $$('.badge').forEach((b) => {
    b.onclick = () => {
      const u = badges.find((x) => x.unit === b.dataset.unit);
      if (u.status === '已頒發') confetti();
      openSheet(`<div class="center"><div style="font-size:64px">${iconOf(u)}</div><h2 style="text-align:center">${esc(u.unit)}技能章</h2>
        <span class="pill st-${esc(u.status)}">${statusLabel(u)}</span></div>
        ${u.status === '已頒發' ? `<div class="msg ok">🏅 ${fmtDate(u.awardDate)} 頒發${u.awardOccasion ? '・' + esc(u.awardOccasion) : ''}</div>` : ''}
        ${u.status === '已完成待頒發' ? `<div class="msg info">${esc(u.statusText)}</div>` : ''}
        ${u.desc ? `<p>${esc(u.desc)}</p>` : ''}
        <h3>合格標準</h3>${itemsHtml(u)}`);
    };
  });
}

/** 出席集點卡 */

  $app.innerHTML = `

      ${r ? `<div class="ring" style="--p:${pct}"><div class="in"><div><b>${esc(r.text)}</b><div class="small muted">${esc(r.period)}<br>出席率</div></div></div></div>
        <div class="counts"><span>🐾 出席 ${r.attended}</span><span>🌙 請假 ${r.leave}</span>${r.extra ? `<span>✨ 額外出席 ${r.extra}</span>` : ''}<span>📅 本年度 ${r.total} 次</span></div>
        <p class="muted small">出席率 =（出席 ＋ 額外出席）÷ 本年度總次數，請假不算出席。</p>`
      : `<div class="counts"><span>🐾 出席 ${a.counts.attended}</span><span>🌙 請假 ${a.counts.leave}</span></div>`}
    </section>
    ${a.upcoming.length ? `<section class="card"><h2>🔜 下次集會</h2>${a.upcoming.map((m) => `<div class="list-row"><span class="t">${fmtDate(m.date)}</span><span class="grow">${esc(m.name)}</span></div>`).join('')}</section>` : ''}
    <section class="card"><h2>🗓️ 集點紀錄</h2>
      ${a.meetings.length ? `<div class="stamps">${a.meetings.map((m) => `<div class="stamp ${esc(m.status)}" title="${esc(m.name)}"><div class="sp">${m.status === '出席' ? '🐾' : m.status === '請假' ? '🌙' : ''}</div>${shortDate(m.date)}<br>${esc(m.status === '－' ? '' : m.status)}</div>`).join('')}</div>
        <p class="muted small">🐾 出席　🌙 請假　空白：當天沒有點名紀錄</p>` : '<p class="muted">還沒有集會紀錄。</p>'}

}

  $('#toProgress').onclick = () => renderCatalog('progress');
  $('#toBadges').onclick = () => renderCatalog('badges');
  $('#toHome').onclick = renderHome;
  bindForm($('#fn'), async (fd, out) => {
    await api('updateNickname', { nickname: fd.get('nickname') });
    state.me.nickname = fd.get('nickname').trim();
    msg(out, '已儲存。', 'ok');
  });
  bindForm($('#fp'), async (fd, out) => {
    if (fd.get('newPassword') !== fd.get('newPassword2')) return msg(out, '兩次輸入的新密碼不一樣。');
    await api('changePassword', { oldPassword: fd.get('oldPassword'), newPassword: fd.get('newPassword') });
    $('#fp').reset();
    msg(out, '密碼已修改。其他裝置需要重新登入。', 'ok');
  });
  bindForm($('#fb'), async (fd, out) => {
    const childName = (fd.get('childName') || '').trim();
    if (childName && consent && !fd.get('agree')) return msg(out, '請先勾選同意個資說明。');
    const r = await api('bind', { code: fd.get('code'), childName, consentVersion: consent ? consent.version : undefined });
    state.me = await api('me');
    confetti();
    if (r.kind === 'parent') { state.cubId = r.cubId; state.detail = null; state.view = 'home'; return renderParent(); }
    state.mode = 'admin'; route();
  });
  $$('.unbind').forEach((b) => {
    b.onclick = () => {
      if (!confirm(`確定要解除與「${b.dataset.name}」的綁定嗎？\n解除後你就看不到這個孩子的資料（孩子的紀錄不受影響），之後需要團長的綁定碼才能再綁定。`)) return;
      act(b, async () => {
        await api('unbind', { cubId: b.dataset.id });
        state.me = await api('me');
        if (state.cubId === b.dataset.id) { state.cubId = (state.me.cubs[0] || {}).cubId || null; state.detail = null; }
        renderParent(true);
      });
    };
  });
}

let catalogData = null;
const PUBLIC_TABS = () => [['home', '🏠', '首頁'], ['progress', '🗺️', '進程'], ['badges', '🎖️', '技能章'], ['login', '🔑', state.me ? '我的' : '登入']];
const PUBLIC_HASH = { home: '#home', progress: '#progress', badges: '#badges' };

/** 更新網址（方便分享），不重新載入頁面 */
function setHash(h) { try { history.replaceState(null, '', location.pathname + location.search + (h || '')); } catch (e) {} }

function onPublicTab(v) {
  if (v === 'login') { setHash(''); return state.me ? route() : renderLogin(); }
  if (v === 'home') return renderHome();
  return renderCatalog(v);
}

async function loadCatalog() {
  if (!catalogData) catalogData = await api('catalog');
  return catalogData;
}

/** 純列表（沒有完成狀態），依大項分組；q 有值時標示關鍵字 */
function catalogItemsHtml(u, q) {
  const mark = (t) => (q ? esc(t).split(esc(q)).join(`<mark>${esc(q)}</mark>`) : esc(t));
  const sections = [];
  u.items.forEach((it) => {
    let x = sections.find((y) => y.name === it.section);
    if (!x) sections.push((x = { name: it.section, items: [] }));
    x.items.push(it);
  });
  const showSec = sections.length > 1 || (sections[0] && sections[0].name !== '－');
  let n = 0;
  return sections.map((x) => `${showSec ? `<div class="section-title">${mark(x.name)}</div>` : ''}
    <ul class="items">${x.items.map((it) => `<li class="todo"><span class="mark">${++n}</span><span>${mark(it.text)}${detailsHtml(it)}</span></li>`).join('')}</ul>`).join('');
}

function openUnitSheet(u) {
  openSheet(`<div class="center"><div style="font-size:64px">${iconOf(u)}</div><h2 style="text-align:center">${esc(unitLabel(u))}${u.category === '技能章' ? '技能章' : ''}</h2>
    ${u.group ? `<span class="pill st-進行中">${esc(u.group)}</span>` : ''}</div>
    ${u.desc ? `<p>${esc(u.desc)}</p>` : ''}${u.rule ? `<p class="small"><b>晉級條件：</b>${esc(u.rule)}</p>` : ''}
    <h3>${u.category === '進程' ? '任務清單' : '合格標準'}（${u.items.length} 項）</h3>${catalogItemsHtml(u)}`);
}

/** 進程查詢（view='progress'）或技能章查詢（view='badges'），各自一頁、各自搜尋 */
async function renderCatalog(view, opt = {}) {
  document.getElementById('title').textContent = view === 'progress' ? '🗺️ 進程查詢' : '🎖️ 技能章查詢';
  setHeader(''); setHash(PUBLIC_HASH[view]);
  setTabs(PUBLIC_TABS(), view, onPublicTab);
  scrollTop();
  let data;
  if (!catalogData) loading('正在打開任務手冊……');
  try { data = await loadCatalog(); }
  catch (e) {
    $app.innerHTML = `<section class="card"><div class="msg err">${esc(e.message)}</div><button class="btn" id="re">再試一次</button></section>`;
    $('#re').onclick = () => renderCatalog(view, opt);
    return;
  }
  const units = data.units;
  const searchBox = (ph) => `<input type="search" id="q" placeholder="${ph}" autocomplete="off" value="${esc(opt.q || '')}"><div id="hits"></div>`;
  const hitsOf = (list, q) => {
    const out = [];
    list.forEach((u) => u.items.forEach((it) => { if (u.unit.includes(q) || it.text.includes(q) || it.section.includes(q) || (it.details || []).some((g) => g.group.includes(q) || g.subs.some((t) => t.includes(q)))) out.push({ u, it }); }));
    return out;
  };
  const drawHits = (list) => {
    const q = $('#q').value.trim();
    const box = $('#hits');
    if (!q) { box.innerHTML = ''; return; }
    const mark = (t) => esc(t).split(esc(q)).join(`<mark>${esc(q)}</mark>`);
    const hits = hitsOf(list, q);
    box.innerHTML = `<p class="muted small">找到 ${hits.length} 項</p>` + hits.map(({ u, it }) => `<div class="hit" data-u="${esc(u.unit)}">
      <span class="pill ${u.category === '進程' ? 'st-已完成待頒發' : 'st-進行中'}">${iconOf(u)} ${esc(unitLabel(u))}${it.section !== '－' ? '・' + mark(it.section) : ''}</span><div>${mark(it.text)}</div></div>`).join('');
    $$('.hit', box).forEach((h) => { h.onclick = () => openUnitSheet(list.find((u) => u.unit === h.dataset.u)); });
  };

  if (view === 'progress') {
    const levels = LEVELS.map((l) => units.find((u) => u.category === '進程' && u.unit === l)).filter(Boolean);
    const sel = levels.find((u) => u.unit === opt.sel) || levels[0];
    $app.innerHTML = `
      <section class="card"><h2>🗺️ 幼童軍進程</h2>
        <p class="muted small">從羚羊級開始，依序挑戰狼級、鹿級、豹級。點一個關卡看看要完成哪些任務！</p>
        ${searchBox('搜尋進程任務，例如：結繩、國旗')}
        <div class="map">${levels.map((u) => `<div class="stage open ${u === sel ? 'sel' : ''}" data-unit="${esc(u.unit)}" role="button" tabindex="0">
          <div class="node"><div class="in">${LEVEL_ICON[u.unit]}</div></div>
          <div><div class="lv">${esc(u.unit)}級</div><div class="cnt">${u.items.length} 項任務</div></div></div>`).join('')}</div>
        <div class="finish">🏁 完成豹級，就是全能小狼！</div></section>
      ${sel ? `<section class="card" id="lvPanel"><h2>${LEVEL_ICON[sel.unit]} ${esc(sel.unit)}級任務（${sel.items.length} 項）</h2>
        ${sel.desc ? `<p>${esc(sel.desc)}</p>` : ''}${sel.rule ? `<div class="msg info small"><b>晉級條件：</b>${esc(sel.rule)}</div>` : ''}
        ${catalogItemsHtml(sel)}</section>` : ''}
      <section class="card center"><button class="btn alt" id="other">🎖️ 去看技能章</button></section>
      <p class="muted small center">內容依據中華民國童軍總會〈幼童軍活動進程〉。</p>`;
    $$('.stage').forEach((st) => { st.onclick = () => { renderCatalog('progress', { sel: st.dataset.unit }); const pn = $('#lvPanel'); if (pn && pn.scrollIntoView) pn.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
    $('#q').oninput = () => drawHits(levels);
    drawHits(levels);
    $('#other').onclick = () => renderCatalog('badges');
  } else {
    const badges = units.filter((u) => u.category === '技能章');
    const groups = ['服務類', '健身類', '技巧類'];
    const other = badges.filter((u) => !groups.includes(u.group));
    $app.innerHTML = `
      <section class="card center"><h2 style="justify-content:center">🎖️ 幼童軍技能章</h2>
        <p class="muted">共 ${badges.length} 個技能章，點徽章看合格標準。</p>
        <div style="text-align:left">${searchBox('搜尋技能章，例如：游泳、音樂')}</div></section>
      ${groups.concat(other.length ? ['其他'] : []).map((g) => {
        const list = g === '其他' ? other : badges.filter((u) => u.group === g);
        return `<section class="card"><h2>${g === '服務類' ? '🤝' : g === '健身類' ? '🏃' : g === '技巧類' ? '🎨' : '🎖️'} ${esc(g)} <span class="s">${list.length} 個</span></h2>
          <div class="badges">${list.map((u) => `<button class="badge open" data-unit="${esc(u.unit)}"><div class="disc"><div class="in">${iconOf(u)}</div></div>
            <div class="nm">${esc(u.unit)}</div><div class="pc">${u.items.length} 項標準</div></button>`).join('')}</div></section>`;
      }).join('')}
      <section class="card center"><button class="btn" id="other">🗺️ 去看進程</button></section>
      <p class="muted small center">內容依據中華民國童軍總會〈幼童軍技能章合格標準〉。</p>`;
    $$('.badge').forEach((bd) => { bd.onclick = () => openUnitSheet(badges.find((u) => u.unit === bd.dataset.unit)); });
    $('#q').oninput = () => drawHits(badges);
    drawHits(badges);
    $('#other').onclick = () => renderCatalog('progress');
  }
}

    $app.innerHTML = `

      ${h.waiting.length ? `<section class="card"><h2>⏳ 項目完成、等待條件</h2>${h.waiting.map((p) => row(p, `<span class="s">${p.waitingUntil ? '間隔到 ' + fmtDate(p.waitingUntil) + ' 才滿' : '出席 ' + p.attendSinceLast + '／' + p.attendRequired + ' 次'}</span>`)).join('')}</section>` : ''}
      <section class="card"><h2>🔥 快達標 <span class="pill st-進行中">${h.near.length}</span></h2>
        ${h.near.length ? h.near.map((p) => row(p, `<span class="s">還差 ${p.remaining} 項</span>`)).join('') : '<p class="muted">目前沒有快達標的小狼。</p>'}</section>
      <section class="card"><h2>📣 系統提示</h2>${alerts.map(([c, ic, t]) => `<div class="alert ${c}"><span>${ic}</span><span>${esc(t)}</span></div>`).join('')}</section>`;
    const ta = $('#toAward');
    if (ta) ta.onclick = () => goAdmin('award');
    $$('[data-cub]').forEach((r) => { r.onclick = () => goAdmin('cub', { cubId: r.dataset.cub }); });
    const tabTo = (t) => { state.admin = { tab: t, page: null }; renderAdmin(); };
    const gr = $('#goRoll'); if (gr) gr.onclick = () => tabTo('roll');
    const gs = $('#goSign'); if (gs) gs.onclick = () => tabTo('sign');
    const gc = $('#goCal'); if (gc) gc.onclick = () => goAdmin('calendar');
  },

  // ───── 點名 ─────
  async roll(params) {
    const list = await api('meetingList');
    const meetings = list.meetings.filter((m) => m.enabled);
    if (!meetings.length) {
      $app.innerHTML = `<section class="card"><h2>📋 點名</h2><p class="muted">行事曆裡還沒有集會。</p>
        ${isLeader() ? '<button class="btn alt" id="cal">前往輸入行事曆</button>' : '<p class="muted">請團長先輸入集會行事曆。</p>'}</section>`;
      const c = $('#cal'); if (c) c.onclick = () => goAdmin('calendar');
      return;
    }
    const mid = params.meetingId || list.defaultId || meetings[meetings.length - 1].meetingId;
    const sheet = await api('attendanceSheet', { meetingId: mid });
    let squad = params.squad || '全團';
    const marks = {};
    sheet.cubs.forEach((c) => { marks[c.cubId] = c.status; });
    const orig = Object.assign({}, marks);
    const NEXT = { '': '出席', '出席': '請假', '請假': '' };
    $app.innerHTML = `
      <section class="card"><h2>📋 點名</h2>
        <select class="full" id="mSel">${meetings.map((m) => `<option value="${esc(m.meetingId)}" ${m.meetingId === mid ? 'selected' : ''}>${fmtDate(m.date)}　${esc(m.name)}</option>`).join('')}</select>
        ${squadChips(sheet.squads, squad)}
        <p class="muted small">點一下切換：空白 → 🐾 出席 → 🌙 請假 → 空白</p>
        <button class="btn alt small" id="allIn">✅ 全部出席（請假的不變）</button>
        <div id="rows"></div>
        <div class="savebar"><div class="muted small" id="sum"></div><button class="btn green" id="save">儲存點名</button></div>
        ${isLeader() ? '<button class="linkbtn" id="cal">📅 管理行事曆</button>' : ''}</section>`;
    const draw = () => {
      const show = sheet.cubs.filter((c) => squad === '全團' || c.squad === squad);
      $('#rows').innerHTML = show.length ? show.map((c) => `<div class="list-row"><span class="grow"><span class="t">${esc(c.name)}</span> <span class="s">${esc(c.squad || '')}</span></span>
        <button class="roll-btn ${esc(marks[c.cubId])} ${marks[c.cubId] !== orig[c.cubId] ? 'changed' : ''}" data-id="${esc(c.cubId)}">${marks[c.cubId] === '出席' ? '🐾 出席' : marks[c.cubId] === '請假' ? '🌙 請假' : '　－　'}</button></div>`).join('') : '<p class="muted">這個小隊沒有小狼。</p>';
      const vals = Object.values(marks);
      const changed = Object.keys(marks).filter((k) => marks[k] !== orig[k]).length;
      $('#sum').textContent = `出席 ${vals.filter((v) => v === '出席').length} 人・請假 ${vals.filter((v) => v === '請假').length} 人${changed ? `・尚未儲存 ${changed} 筆` : ''}`;
      $$('.roll-btn').forEach((b) => { b.onclick = () => { marks[b.dataset.id] = NEXT[marks[b.dataset.id]]; draw(); }; });
    };
    draw();
    const dirty = () => Object.keys(marks).some((k) => marks[k] !== orig[k]);
    leaveGuard = () => !dirty() || confirm('點名還沒儲存，確定要離開嗎？（剛才的變更會不見）');
    leaveGuard.dirty = dirty;
    onSquad((s) => { squad = s; $('#allIn').textContent = s === '全團' ? '✅ 全部出席（請假的不變）' : `✅ ${s}全部出席（請假的不變）`; draw(); });
    $('#allIn').onclick = () => {
      sheet.cubs.filter((c) => (squad === '全團' || c.squad === squad) && marks[c.cubId] === '').forEach((c) => { marks[c.cubId] = '出席'; });
      draw();
    };
    $('#mSel').onchange = () => {
      if (!canLeave()) { $('#mSel').value = mid; return; }
      leaveGuard = null;
      state.admin.page = { name: 'roll', params: { meetingId: $('#mSel').value, squad } }; renderAdmin();
    };
    $('#save').onclick = (ev) => act(ev.target, async () => {
      const changed = {};
      Object.keys(marks).forEach((k) => { if (marks[k] !== orig[k]) changed[k] = marks[k]; });
      if (!Object.keys(changed).length) return toast('沒有變更');
      const r = await api('attendanceSave', { meetingId: mid, marks: changed });
      Object.assign(orig, changed);
      draw();
      toast(`已儲存 ${r.changed} 筆點名 🐾`);
    });
    const c = $('#cal'); if (c) c.onclick = () => goAdmin('calendar');
  },

  // ───── 簽核（小隊批次） ─────
  async sign(params) {
    const d = await api('signoffData');
    const st = { squad: params.squad || '全團', items: new Set(), cubs: null, filter: d.recent.length ? 'recent' : '', section: '' };
    const doneSet = new Set(d.done);
    const unitsList = [];
    d.items.forEach((i) => { const k = i.category + '|' + i.unit; if (!unitsList.includes(k)) unitsList.push(k); });
    if (!st.filter) st.filter = unitsList[0] || 'recent';
    $app.innerHTML = `
      <section class="card"><h2>✅ 簽核</h2>
        <h3>① 選小隊</h3>${squadChips(d.squads, st.squad)}
        <h3>② 選項目</h3>
        <select class="full" id="flt"><option value="recent">⭐ 最近簽過的項目</option>${unitsList.map((k) => { const [c, u] = k.split('|'); return `<option value="${esc(k)}">${c === '進程' ? '進程・' + esc(u) + '級' : '技能章・' + esc(u)}</option>`; }).join('')}</select>
        <div id="secs" class="chips"></div><div id="items"></div>
        <h3>③ 選小狼與日期</h3><div id="cubs"></div>
        <label>完成日期</label><input type="date" id="date" value="${esc(d.today)}" max="${esc(d.today)}">
        <div class="savebar"><div class="muted small" id="sum"></div><button class="btn green" id="go">送出簽核</button></div>
        <div id="result"></div></section>`;
    const drawItems = () => {
      let list = st.filter === 'recent' ? d.recent.map((id) => d.items.find((i) => i.id === id)).filter(Boolean) : d.items.filter((i) => i.category + '|' + i.unit === st.filter);
      const secs = [...new Set(list.map((i) => i.section))].filter((s) => s !== '－');
      $('#secs').innerHTML = secs.length > 1 ? ['全部'].concat(secs).map((s) => `<button class="chip ${(st.section || '全部') === s ? 'on' : ''}" data-sec="${esc(s)}">${esc(s)}</button>`).join('') : '';
      if (st.section && st.section !== '全部') list = list.filter((i) => i.section === st.section);
      const cubsNow = st.cubs ? [...st.cubs] : [];
      const doneCount = (id) => cubsNow.filter((c) => doneSet.has(c + '|' + id)).length;
      $('#items').innerHTML = list.length ? list.map((i) => { const dc = doneCount(i.id); return `<label class="check"><input type="checkbox" data-item="${esc(i.id)}" ${st.items.has(i.id) ? 'checked' : ''}><span>${st.filter === 'recent' ? `<span class="s">${esc(i.unit)}${i.section !== '－' ? '・' + esc(i.section) : ''}</span><br>` : ''}${esc(i.text)}<br><span class="s" style="color:${cubsNow.length && dc === cubsNow.length ? 'var(--green-dark)' : 'var(--gray)'}">已完成 ${dc}／${cubsNow.length} 位${cubsNow.length && dc === cubsNow.length ? ' ✅' : ''}</span></span></label>`; }).join('')
        : `<p class="muted">${st.filter === 'recent' ? '還沒有最近簽過的項目，請從上方選級別或技能章。' : '沒有項目。'}</p>`;
      $$('#secs .chip').forEach((b) => { b.onclick = () => { st.section = b.dataset.sec; drawItems(); }; });
      $$('#items input').forEach((cb) => { cb.onchange = () => { cb.checked ? st.items.add(cb.dataset.item) : st.items.delete(cb.dataset.item); drawSum(); }; });
    };
    const drawCubs = () => {
      const list = d.cubs.filter((c) => st.squad === '全團' || c.squad === st.squad);
      if (!st.cubs) st.cubs = new Set(list.map((c) => c.cubId)); // 預設全選該小隊
      $('#cubs').innerHTML = list.map((c) => `<label class="check"><input type="checkbox" data-cub="${esc(c.cubId)}" ${st.cubs.has(c.cubId) ? 'checked' : ''}>${esc(c.name)} <span class="s">${esc(c.squad || '')}</span></label>`).join('') || '<p class="muted">沒有小狼。</p>';
      $$('#cubs input').forEach((cb) => { cb.onchange = () => { cb.checked ? st.cubs.add(cb.dataset.cub) : st.cubs.delete(cb.dataset.cub); drawItems(); drawSum(); }; });
    };
    const drawSum = () => {
      let n = 0, skip = 0;
      st.cubs.forEach((c) => st.items.forEach((i) => { doneSet.has(c + '|' + i) ? skip++ : n++; }));
      $('#sum').textContent = `已選 ${st.items.size} 個項目 × ${st.cubs.size} 位小狼：將新增 ${n} 筆${skip ? `，略過已完成 ${skip} 筆` : ''}`;
    };
    $('#flt').value = st.filter;
    $('#flt').onchange = () => { st.filter = $('#flt').value; st.section = ''; drawItems(); };
    onSquad((s) => { st.squad = s; st.cubs = null; drawCubs(); drawItems(); drawSum(); });
    drawCubs(); drawItems(); drawSum();
    $('#go').onclick = (ev) => act(ev.target, async () => {
      if (!st.items.size || !st.cubs.size) return alert('請至少選一個項目和一位小狼。');
      const r = await api('signoff', { cubIds: [...st.cubs], itemIds: [...st.items], date: $('#date').value });
      r.batch.forEach((b) => doneSet.add(b.cubId + '|' + b.itemId));
      st.items.forEach((i) => { if (!d.recent.includes(i)) d.recent.unshift(i); });
      st.items.clear(); drawItems(); drawSum();
      $('#result').innerHTML = `<div class="msg ok">✅ 新增 ${r.added} 筆、略過 ${r.skipped} 筆（已完成的不重複寫入）</div>${r.added ? '<button class="btn ghost small" id="undo">↩️ 復原剛才這一批</button>' : ''}`;
      toast(`簽核完成：新增 ${r.added} 筆`);
      const u = $('#undo');
      if (u) u.onclick = (e2) => act(e2.target, async () => {
        if (!confirm(`確定要復原剛才的 ${r.added} 筆簽核嗎？`)) return;
        const x = await api('signoffRevoke', { entries: r.batch });
        r.batch.forEach((b) => doneSet.delete(b.cubId + '|' + b.itemId));
        $('#result').innerHTML = `<div class="msg info">已復原 ${x.removed} 筆。</div>`;
        drawSum();
      });
    });
  },

  // ───── 小狼名單 ─────
  async cubs(params) {

        ${squadChips(d.squads, st.squad)}

        <span class="grow"><span class="t">${esc(c.name)}</span> <span class="s">${esc(c.squad || '')}</span><br><span class="s">入團 ${fmtDate(c.joinDate)}${c.level ? '・' + esc(c.level) + '級' : ''}${c.status !== '在團' ? '・' + esc(c.status) : ''}</span></span><span>›</span></div>`).join('') : '<p class="muted">沒有符合條件的小狼。</p>';

      const elig = u.status === '已完成待頒發' ? (u.eligible ? `<div class="msg ok small">✅ 已達標（${fmtDate(u.eligibleDate)}）</div>` : `<div class="msg warn small">⏳ ${u.waitingUntil ? '晉級間隔到 ' + fmtDate(u.waitingUntil) + ' 才滿' : u.attendRequired ? '出席 ' + u.attendSinceLast + '／' + u.attendRequired + ' 次' : '上一級尚未頒發'}</div>`) : '';
      return `<details class="unit bd-${esc(u.status)}"><summary><div class="head"><span class="name">${iconOf(u)} ${esc(unitLabel(u))}</span><span class="pill st-${esc(u.status)}">${esc(u.status)}</span></div>

        ${elig}</summary><div class="body">${actions}<ul class="items">${items}</ul>

      <section class="card"><div class="row-flex">${L ? '<button class="btn ghost small" id="edit">✏️ 編輯</button><button class="btn ghost small" id="bf">📥 補登頒章</button>' : ''}<button class="btn ghost small" id="pr">🖨️ 列印簽核單</button>

  // ───── 頒章（批次） ─────
  async award(params) {
    const h = await api('adminHome');
    const cands = h.pending.map((p) => Object.assign({ ok: true }, p)).concat(h.waiting.map((p) => Object.assign({ ok: false }, p)));
    (params.preset || []).forEach((p) => { if (!cands.some((x) => x.cubId === p.cubId && x.unit === p.unit)) cands.unshift(Object.assign({ ok: false }, p)); });
    const key = (p) => p.cubId + '|' + p.unit;
    const chosen = new Set((params.preset || []).map(key));
    if (!params.preset) h.pending.forEach((p) => chosen.add(key(p)));
    $app.innerHTML = `${backBtn()}<section class="card"><h2>🏅 頒章</h2>
      <p class="muted small">同一場儀式可勾選多位小狼、多個級別或技能章，共用頒發日期與場合。</p>
      ${cands.length ? cands.map((p) => `<label class="check"><input type="checkbox" data-k="${esc(key(p))}" ${chosen.has(key(p)) ? 'checked' : ''}><span>${esc(p.name)} <span class="s">${esc(p.squad || '')}</span><br>${iconOf(p)} ${esc(unitLabel(p))}${p.ok ? '' : ' <span class="pill st-未開始">尚未達標</span>'}</span></label>`).join('') : '<p class="muted">目前沒有可頒章的項目。上線前已拿到的章請到小狼頁面使用「補登頒章」。</p>'}
      <form id="f"><label>頒發日期（儀式當天）</label><input type="date" name="date" value="${todayStr()}" required>
        <label>頒發場合（選填）</label><input type="text" name="occasion" placeholder="例如：11 月團集會">
        <label>備註（選填）</label><input type="text" name="note">
        <button class="btn alt" type="submit">🏅 確定頒章</button><div class="out"></div></form></section>`;
    wireBack(params.back || null);
    bindForm($('#f'), async (fd) => {
      const entries = $$('input[data-k]:checked').map((x) => { const [cubId, unit] = x.dataset.k.split('|'); return { cubId, unit }; });
      if (!entries.length) throw new ApiErr('BAD_INPUT', '請至少勾選一項。');
      const r = await withConfirm('award', { entries, date: fd.get('date'), occasion: fd.get('occasion'), note: fd.get('note') });
